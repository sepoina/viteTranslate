# Generated from storyboard.md (the source of truth) following site/video/README.md.
# Content (scenes, order, what is said) lives in storyboard.md; tune the technique here.
# Run from site/video: `node uty/run.mjs quick2 tts record preview --silent` to rehearse.
#
# LINKED-DATA: the fixture is demo/Vite_8/quickApp. `goto: 9` is the closing </p> of the first
# paragraph in its src/App.jsx; `find: "null"` is the value Sync writes for the new key in
# locale/fr-FR.yml. Change those files, check this storyboard.

title: viteTranslate quick start
fixture: demo/Vite_8/quickApp
app:
  port: 5199
  style: "@commons/app-dark.css"
poster: { scene: fallback, at: 2 } # the new sentence is already in the browser

voice:
  model: google/gemini-3.8-flash-lite-tts
  voice: Leda
  instructions: A developer showing a tool to a colleague. Relaxed and clear, with a half smile. No sales pitch.

# Under the voice, ducked around every line (README.md § "Music"); no level asked: the defaults.
music: { track: Chris Haugen - Mirage }

# Not recorded: the stage as the first VS Code scene finds it.
setup:
  - click: { selector: '.activitybar [aria-label^="viteTranslate"]' } # the panel on the left
  - wait: 3 # its webviews load and take the focus
  - open: src/App.jsx
  - wait: 3

scenes:
  - id: title
    stage: card
    card: "@commons/title.html"
    params: { line: Write the sentence., accent: Get the translation. }
    say: viteTranslate. Translations for React and Vite, written right where the text lives.
    hold: 0.4

  - id: app
    stage: app
    say: Here's a small React app. One click, and it speaks French.
    do:
      - wait: 1.8 # "Here's a small React app." first
      - mark: { page: app, text: Français } # on "One click" (real voice: ~2.1 s)
      - click: { page: app, text: Français }
    hold: 0.8

  - id: write
    stage: vscode
    say: Need a new sentence? Write it in the JSX, the way it reads. No keys to invent. Save, and the extension spots it.
    do:
      - wait: 0.8
      - goto: 9 # end of the first paragraph's </p>
      - key: Enter
      - type: <p><Trans>You have three new messages.</Trans></p> # typed in full, no cuts
      - wait: 1.2 # save on "Save" (real voice: ~5.5 s into the scene)
      - save
      - waitFor: { text: "🔄 You have three new messages.", exact: false } # Results: not synced
      - mark: { text: "🔄 You have three new messages.", exact: false } # its row, on "the extension spots it"
    hold: 2 # the row stays circled long enough to read it

  - id: fallback
    stage: split
    say: The page is already up to date. Not translated yet? French shows the English text instead. Never a blank.
    do:
      - wait: 4 # "French shows the English text" (real voice: ~4.2 s)
      - mark: { page: app, text: You have three new messages., exact: false, shape: underline }
    hold: 0.4

  - id: sync
    stage: vscode
    say: One click on Sync, and the new key lands in every language file. In French, it waits as null.
    do:
      - wait: 0.3
      - mark: { selector: 'vscode-button[data-cmd="sync"]', shape: arrow } # "One click on Sync"
      - click: { selector: 'vscode-button[data-cmd="sync"]' } # Project's Sync button
      - wait: 1.2 # Sync runs; fr-FR.yml opens on "In French" (real voice: ~4.7 s)
      - open: locale/fr-FR.yml
      - waitFor: { text: "null" } # Sync has written the new key
      - find: "null" # selected: the next scene types over it
      - mark: selection # on "it waits as null"; the arrow fades out
    hold: 1.3 # null stays circled 1.5 s at least (record measured it)

  - id: translate
    stage: split
    say: Write the translation and save. The page reloads, and the French is all there.
    do:
      - key: Control+J # hide Sync's terminal on the cut: left open, it closes itself mid-scene
      - type: '"Vous avez trois nouveaux messages."'
      - save
      - wait: 1.5 # the reload, back in English
      - click: { page: app, text: Français }
      - waitFor: { page: app, text: Vous avez trois nouveaux messages. }
      - mark: { page: app, text: Vous avez trois nouveaux messages., shape: box } # "the French is all there"
    hold: 2 # a sentence to read: 2 s boxed

  - id: outro
    stage: card
    card: "@commons/outro.html"
    say: viteTranslate. On npm, and in the VS Code Marketplace.
    hold: 1

