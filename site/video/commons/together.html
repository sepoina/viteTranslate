<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>viteTranslate — list card</title>
    <style>
      /* Columns of ticked items, filling one after another; when the last is in, every tick
         glows once. Colors from site/theme/tokens.css (dark), the same background as title.html;
         the tick is the accent ✓ of the landing's comparison. Played live by the recorder: 1920x1080. */
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: radial-gradient(90% 80% at 50% 10%, #18201c 0%, #0b0f0d 55%, #050706 100%);
        color: #eef2ef;
        font-family: "Segoe UI", system-ui, sans-serif;
        overflow: hidden;
      }
      main {
        width: 1760px;
      }
      h1 {
        margin: 0 0 64px;
        text-align: center;
        font-size: 80px;
        font-weight: 700;
        color: #f4f7f5;
      }
      h1:empty {
        display: none;
      }
      html:not(.go) h1 {
        opacity: 0;
      }
      .go h1 {
        animation: su 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      #groups {
        display: grid;
        grid-auto-columns: 1fr;
        grid-auto-flow: column;
        gap: 32px;
      }
      section {
        padding: 36px 32px 40px;
        background: #1c2521;
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-radius: 28px;
        opacity: 0;
      }
      section.on {
        opacity: 1;
        animation: su 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      h2 {
        margin: 0 0 28px;
        font-size: 38px;
        font-weight: 700;
        color: #4ade80;
      }
      ul {
        display: grid;
        gap: 22px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      li {
        display: grid;
        grid-template-columns: 44px 1fr;
        gap: 18px;
        align-items: start;
        font-size: 34px;
        line-height: 1.25;
        color: #eef2ef;
        opacity: 0;
      }
      li.on {
        opacity: 1;
        animation: su 0.5s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      /* The tick: drawn, not an emoji, in the accent. */
      .tick {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        margin-top: -2px;
        border-radius: 50%;
        background: rgba(74, 222, 128, 0.14);
      }
      .tick svg {
        width: 26px;
        height: 26px;
        stroke: #4ade80;
        stroke-width: 3.2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 30;
        stroke-dashoffset: 30;
      }
      li.on .tick svg {
        animation: draw 0.4s 0.15s ease-out forwards;
      }
      .done .tick {
        animation: glow 1.2s ease-out;
      }
      footer {
        margin-top: 56px;
        text-align: center;
        font-size: 32px;
        color: #9aa59e;
        opacity: 0;
        transition: opacity 0.8s ease-out;
      }
      footer.on {
        opacity: 1;
      }
      @keyframes su {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
      }
      @keyframes draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes glow {
        30% {
          background: rgba(74, 222, 128, 0.55);
          box-shadow: 0 0 28px rgba(74, 222, 128, 0.6);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title"></h1>
      <div id="groups"></div>
      <footer id="note"></footer>
    </main>
    <script src="clock.js"></script>
    <script>
      // params: { title, groups (one per line: "Heading|item|item…"), at (when each group starts),
      // beat (seconds between two items of a group, default 0.3), note (a small line at the bottom),
      // noteAt (when it shows; default: after the last item) }. See clock.js.
      document.getElementById("title").textContent = card.param("title");
      const groups = card.list("groups", [
        ["In your JSX", "Keyless, natural text", "ICU plurals, select, dates"],
        ["In VS Code", "Official extension", "LLM auto-translation"],
        ["In Vite", "Official Vite plugin", "Extraction in the Vite lifecycle", "Lazy-loaded locales"],
        ["In production", "Zero runtime dependencies", "5 kB gzip runtime", "No message parsing at runtime"],
      ]);
      const beat = Number(card.param("beat", "0.3"));
      const times = card.times(groups.length, { first: 0.8, step: 1.4 });
      const box = document.getElementById("groups");
      let last = 0;
      groups.forEach(([heading, ...items], g) => {
        const section = document.createElement("section");
        const ul = document.createElement("ul");
        section.append(Object.assign(document.createElement("h2"), { textContent: heading }), ul);
        box.append(section);
        card.at(times[g], () => section.classList.add("on"));
        items.forEach((item, i) => {
          const li = document.createElement("li");
          li.innerHTML = `<span class="tick"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>`;
          li.append(Object.assign(document.createElement("span"), { textContent: item }));
          ul.append(li);
          const t = times[g] + 0.25 + beat * i;
          last = Math.max(last, t);
          card.at(t, () => li.classList.add("on"));
        });
      });
      card.at(last + 0.7, () => box.classList.add("done"));
      const note = document.getElementById("note");
      note.textContent = card.param("note");
      card.at(Number(card.param("noteAt", String(last + 1))), () => note.classList.add("on"));
    </script>
  </body>
</html>
