<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>viteTranslate — question card</title>
    <style>
      /* A question, then its answer lighting up word by word. Colors from site/theme/tokens.css
         (dark), the same background as title.html. Played live by the recorder: 1920x1080. */
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: radial-gradient(90% 80% at 50% 10%, #18201c 0%, #0b0f0d 55%, #050706 100%);
        color: #eef2ef;
        font-family: "Segoe UI", system-ui, sans-serif;
        overflow: hidden;
      }
      main {
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 128px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #f4f7f5;
      }
      html:not(.go) h1,
      html:not(.go) ul {
        opacity: 0;
      }
      .go h1 {
        animation: su 1s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      .go ul {
        animation: su 1s 0.3s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      /* The words wait, barely visible, so nothing moves when they light up. */
      ul {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 44px;
        margin: 96px 0 0;
        padding: 0;
        list-style: none;
        font-size: 92px;
        font-weight: 600;
      }
      li {
        color: #4ade80;
        opacity: 0.08;
        transition: opacity 0.35s ease-out;
      }
      li.dot {
        font-size: 64px;
        color: #3a4640;
        opacity: 0;
      }
      li.on {
        opacity: 1;
        animation: pop 0.6s cubic-bezier(0.2, 0.7, 0.2, 1);
        text-shadow: 0 0 48px rgba(74, 222, 128, 0.35);
      }
      li.dot.on {
        animation: none;
        text-shadow: none;
      }
      @keyframes su {
        from {
          opacity: 0;
          transform: translateY(32px);
        }
      }
      @keyframes pop {
        from {
          transform: scale(0.86);
          text-shadow: 0 0 96px rgba(74, 222, 128, 0.9);
        }
        45% {
          transform: scale(1.06);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="question">Another i18n library?</h1>
      <ul id="words"></ul>
    </main>
    <script src="clock.js"></script>
    <script>
      // params: { question, words (one per line), at (when each word lights up) }: see clock.js.
      const question = card.param("question");
      if (question) document.getElementById("question").textContent = question;

      const words = card.list("words", [["JSX"], ["Vite"], ["VS Code"]]).map(([w]) => w);
      const times = card.times(words.length, { first: 1.6, step: 0.6 });
      const ul = document.getElementById("words");
      words.forEach((word, i) => {
        if (i) {
          const dot = Object.assign(document.createElement("li"), { className: "dot", textContent: "·" });
          ul.append(dot);
          card.at(times[i], () => dot.classList.add("on"));
        }
        const li = Object.assign(document.createElement("li"), { textContent: word });
        ul.append(li);
        card.at(times[i], () => li.classList.add("on"));
      });
    </script>
  </body>
</html>
