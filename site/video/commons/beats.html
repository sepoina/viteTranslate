<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>viteTranslate — beats card</title>
    <style>
      /* A title, then a few beats landing one by one, each with a small hit. Colors from
         site/theme/tokens.css (dark), the same background as title.html. Played live by the
         recorder: 1920x1080. */
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: radial-gradient(90% 80% at 50% 10%, #18201c 0%, #0b0f0d 55%, #050706 100%);
        color: #eef2ef;
        font-family: "Segoe UI", system-ui, sans-serif;
        overflow: hidden;
      }
      main {
        width: 1680px;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 88px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: #f4f7f5;
      }
      code {
        display: inline-block;
        margin-top: 36px;
        padding: 10px 26px;
        font: 600 42px Consolas, "Cascadia Mono", monospace;
        color: #4ade80;
        background: #18201c;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
      }
      code:empty {
        display: none;
      }
      html:not(.go) h1,
      html:not(.go) code {
        opacity: 0;
      }
      .go h1 {
        animation: su 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      .go code {
        animation: su 0.9s 0.25s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      /* The beats: tiles in a row, empty until their time. */
      ol {
        display: grid;
        grid-auto-columns: minmax(0, 1fr);
        grid-auto-flow: column;
        gap: 40px;
        margin: 88px 0 0;
        padding: 0;
        list-style: none;
      }
      li {
        display: grid;
        grid-template-columns: minmax(0, 1fr); /* the tile's width, whatever the text: so the big line can be measured */
        align-content: center;
        gap: 14px;
        min-height: 300px;
        padding: 36px 32px;
        background: #1c2521;
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-radius: 28px;
        opacity: 0;
      }
      li.on {
        opacity: 1;
        animation: hit 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both;
        border-color: rgba(74, 222, 128, 0.35);
      }
      .big {
        font-size: 128px; /* shrunk to fit its tile by the script */
        font-weight: 700;
        line-height: 1.05;
        white-space: nowrap;
        color: #4ade80;
      }
      .small {
        font-size: 44px;
        font-weight: 500;
        line-height: 1.25;
        color: #dfe5e1;
      }
      .small:empty {
        display: none;
      }
      footer {
        margin-top: 64px;
        font-size: 36px;
        color: #9aa59e;
        opacity: 0;
        transition: opacity 0.8s ease-out;
      }
      footer.on {
        opacity: 1;
      }
      @keyframes su {
        from {
          opacity: 0;
          transform: translateY(28px);
        }
      }
      @keyframes hit {
        from {
          opacity: 0;
          transform: translateY(40px) scale(0.9);
          border-color: rgba(74, 222, 128, 1);
          box-shadow: 0 0 80px rgba(74, 222, 128, 0.5);
        }
        50% {
          opacity: 1;
          transform: translateY(0) scale(1.04);
          border-color: rgba(74, 222, 128, 0.9);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">LLM auto-translation</h1>
      <div><code id="code"></code></div>
      <ol id="beats"></ol>
      <footer id="note"></footer>
    </main>
    <script src="clock.js"></script>
    <script>
      // params: { title, code, beats (one per line: "big" or "big|small"), at (when each beat
      // lands), note (a small line at the bottom), noteAt (when it shows; default: with the title) }.
      // See clock.js.
      document.getElementById("title").textContent = card.param("title", "LLM auto-translation");
      document.getElementById("code").textContent = card.param("code");
      const note = document.getElementById("note");
      note.textContent = card.param("note");
      card.at(Number(card.param("noteAt", "0.8")), () => note.classList.add("on"));

      const beats = card.list("beats", [["💰", "Cost first"], ["✋", "Asks before spending"], ["🛡️", "Every result validated"]]);
      const times = card.times(beats.length, { first: 1.5, step: 1.2 });
      const ol = document.getElementById("beats");
      const bigs = beats.map(([big, small = ""], i) => {
        const li = document.createElement("li");
        const b = Object.assign(document.createElement("div"), { className: "big", textContent: big });
        li.append(b, Object.assign(document.createElement("div"), { className: "small", textContent: small }));
        ol.append(li);
        card.at(times[i], () => li.classList.add("on"));
        return b;
      });
      // Each big line as large as its tile allows: a number stays big, a word shrinks to fit.
      for (const b of bigs) {
        for (let size = 128; size > 48 && b.scrollWidth > b.clientWidth; size -= 2) b.style.fontSize = `${size - 2}px`;
      }
    </script>
  </body>
</html>
