App_17k0c41: "The <b>expected</b> column applies in <b>development</b>, with the source language active and the language files already synchronized."
App_1ombhjz: "Every category has its own address (<code>#icu</code>, <code>#html</code>, <code>#not-text</code>…): the <code>#</code> next to the title is the link to share."
App_1wc6kj8: "<b>Optimal</b>: renders exactly what is written, no diagnostics. <b>Warning</b>: renders, but something gets lost or surprises you (a <code>⁇</code>, a dropped tag, a build warning). <b>Error</b>: a <code>‼️</code> or <code>🚫</code> mark, or a console error: fix it."
App_20ci9k: "Hover over <code>&lt;/&gt;</code> next to a case name to see the code that produced it."
App_4ibyhz: "Edge cases · v%s"
App_4j76hr: "How to read the table"
App_a9vbkj: "In a real app the diagnostic marks disappear in the build — where you read <code>🚫[type]</code> here, nothing is rendered any more — while <code>⁇</code> stays: it isn’t a diagnostic, it’s normal output. This page keeps them on in the build too, on purpose."
App_aj0s62: "How to read the table ↓"
App_iy34f8: "<code>🔸</code> (not translated here) and <code>🔹</code> (not translated elsewhere) are not shown: they depend on the state of the language files, not on the row. <code>‼️</code>, <code>🚫</code> and <code>⁇</code>, on the other hand, are part of the expected result."
App_j4wz87: "Every edge case, <em>live</em>"
App_onj53g: "One row per case: what you write, what viteTranslate actually renders, what you expect. In every category the recommended forms come first, the errors last."
