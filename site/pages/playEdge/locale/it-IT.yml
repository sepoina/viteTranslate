App_17k0c41: "La colonna <b>atteso</b> vale in <b>sviluppo</b>, con la lingua sorgente attiva e i file di lingua già sincronizzati."
App_1ombhjz: "Ogni categoria ha un indirizzo suo (<code>#icu</code>, <code>#html</code>, <code>#not-text</code>…): il <code>#</code> accanto al titolo è il link da condividere."
App_1wc6kj8: "<b>Ottimale</b>: rende esattamente ciò che è scritto, senza diagnostica. <b>Warning</b>: rende, ma qualcosa si perde o sorprende (un <code>⁇</code>, un tag scartato, un avviso di build). <b>Errore</b>: un mark <code>‼️</code> o <code>🚫</code>, o un errore in console: da correggere."
App_20ci9k: "Passa sopra <code>&lt;/&gt;</code> accanto al nome di un caso per vedere il codice che l’ha prodotto."
App_4ibyhz: "Casi limite · v%s"
App_4j76hr: "Come leggere la tabella"
App_a9vbkj: "In un’app vera i mark diagnostici spariscono in build — dove qui si legge <code>🚫[tipo]</code> non si rende più niente — mentre <code>⁇</code> resta: non è una diagnostica, è una resa normale. Questa pagina li tiene accesi anche in build, apposta."
App_aj0s62: "Come leggere la tabella ↓"
App_iy34f8: "<code>🔸</code> (non tradotto qui) e <code>🔹</code> (non tradotto altrove) non sono riportati: dipendono dallo stato dei file di lingua, non dalla riga. <code>‼️</code>, <code>🚫</code> e <code>⁇</code> invece fanno parte del risultato atteso."
App_j4wz87: "Ogni caso limite, <em>dal vivo</em>"
App_onj53g: "Una riga per caso: cosa scrivi, cosa rende davvero viteTranslate, cosa ti aspetti. In ogni categoria prima le forme consigliate, in fondo gli errori."
App_xheo4s: "← viteTranslate: tutte le demo"
