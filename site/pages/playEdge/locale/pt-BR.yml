App_17k0c41: "A coluna <b>esperado</b> vale em <b>desenvolvimento</b>, com o idioma de origem ativo e os arquivos de idioma já sincronizados."
App_1ekphjo: "Alternar tema"
App_1ombhjz: "Cada categoria tem seu próprio endereço (<code>#icu</code>, <code>#html</code>, <code>#not-text</code>…): o <code>#</code> ao lado do título é o link para compartilhar."
App_1wc6kj8: "<b>Ideal</b>: renderiza exatamente o que está escrito, sem diagnóstico. <b>Aviso</b>: renderiza, mas algo se perde ou surpreende (um <code>⁇</code>, uma tag descartada, um aviso de build). <b>Erro</b>: uma marca <code>‼️</code> ou <code>🚫</code>, ou um erro no console: a corrigir."
App_20ci9k: "Passe o mouse sobre <code>&lt;/&gt;</code> ao lado do nome de um caso para ver o código que o produziu."
App_4ibyhz: "Casos-limite · v%s"
App_4j76hr: "Como ler a tabela"
App_4lj7z0: "Idioma da página"
App_a9vbkj: "Num app real, as marcas de diagnóstico somem no build — onde aqui se lê <code>🚫[tipo]</code>, nada mais é renderizado — enquanto <code>⁇</code> permanece: não é um diagnóstico, é uma saída normal. Esta página as mantém ativas também no build, de propósito."
App_aj0s62: "Como ler a tabela ↓"
App_iy34f8: "<code>🔸</code> (não traduzido aqui) e <code>🔹</code> (não traduzido em outro idioma) não aparecem: dependem do estado dos arquivos de idioma, não da linha. <code>‼️</code>, <code>🚫</code> e <code>⁇</code>, por outro lado, fazem parte do resultado esperado."
App_j4wz87: "Cada caso-limite, <em>ao vivo</em>"
App_onj53g: "Uma linha por caso: o que você escreve, o que o viteTranslate realmente renderiza, o que você espera. Em cada categoria, primeiro as formas recomendadas, por último os erros."
