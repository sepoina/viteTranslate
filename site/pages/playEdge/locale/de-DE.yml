App_1dtvcsy: "\n          <small>\n              Die Spalte <b>Erwartet</b> gilt in der <b>Entwicklung</b> mit aktiver Quellsprache und bereits synchronisierten Sprachdateien. Die Markierungen <code>🔸</code> (hier nicht übersetzt) und <code>🔹</code> (anderswo nicht übersetzt) werden nicht angezeigt: Sie hängen vom Status der Sprachdateien ab, nicht von der Zeile. <code>‼️</code>, <code>🚫</code> <code>⁇</code> hingegen sind Teil des erwarteten Ergebnisses. Im Build verschwinden die diagnostischen Markierungen – wo hier <code>🚫[Typ]</code> steht, wird nichts mehr ausgegeben – während <code>⁇</code> erhalten bleibt: das ist keine Diagnostik, sondern eine normale Darstellung.<br /> Wenn Sie mit der Maus über <code>&lt;/&gt;</code> neben dem Zeilennamen fahren, sehen Sie den Code, der sie erzeugt hat.            \n          </small>            \n          "
