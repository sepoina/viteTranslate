InstallSection_10dmb4o: ". È lo stesso file che il plugin crea da solo al primo avvio, descritto in Esecuzione dev."
InstallSection_132q22t: "Il blocco da tradurre puoi anche non copiarlo tu: l’opzione <code>llm</code> punta il comando a un modello con API compatibili OpenAI (Gemini, OpenAI, OpenRouter, Groq, Ollama…). Nella configurazione va il nome della variabile d’ambiente con la chiave, mai la chiave."
InstallSection_157cj31: "Dalla 4.2 non serve preparare nulla prima del primo avvio: il plugin sincronizza le tabelle da solo, dentro l'hook di configurazione di Vite, prima ancora che il server esista. Al primo npm run dev il file della lingua di default viene creato in automatico (vedi Build linguistico), pronto per essere letto da TranslateContainer."
InstallSection_19xkq7a: "Che parta da sola o lanciato a mano, il risultato è lo stesso: anche a progetto appena creato e senza altri file di lingua presenti, viene generata la prima tabella linguistica, quella della lingua indicata come lingua di default in"
InstallSection_1agwhaj: "Dalla 4.2 la sincronizzazione avviene da sola: un controllo rapido a ogni avvio del dev server, una scansione completa prima di ogni build di produzione. Nessuno script da scrivere, nessun comando da ricordare."
InstallSection_1fktekt: "Costi, limiti di spesa, la chiave nel portachiavi di sistema e tutte le opzioni:"
InstallSection_1rl7c67: "Ogni lingua è un file .yml dentro localeDir, con lo stesso nome del suo tag"
InstallSection_1w2c6tx: "Le stesse chiavi compaiono, nello stesso momento, anche nel file della lingua di default: mai come null lì, ma raggruppate sotto la stessa riga separatrice finché restano da tradurre in almeno un'altra lingua. È un'occasione pratica: puoi copiare quel blocco (testo reale, non null) e incollarlo in un LLM per farlo tradurre, poi incollare la risposta al posto dei null nel file della lingua di destinazione."
InstallSection_3809a4: ". Il file della lingua di default viene creato e tenuto aggiornato in automatico dal comando di sincronizzazione: non va scritto a mano, solo tradotto se serve."
InstallSection_89ggya: "Ecco come appare il progetto una volta configurato il plugin: locale è una cartella accanto a src, indicata da localeDir, con dentro un file .yml per ogni lingua."
InstallSection_b1j9f6: "Installazione"
InstallSection_dhlwwk: "Avvolgi l'app in TranslateContainer indicando la lingua iniziale da caricare: espone il contesto usato da Translate e dagli altri hook per leggere la tabella di traduzione corrente. In sviluppo il fallback resta incorporato nel codice compilato, quindi l'app mostra già il testo tradotto senza dover lanciare altri comandi."
InstallSection_eqg418: "Registra il plugin viteTranslate in vite.config.js: gli va indicata la cartella dei file di lingua e la lingua di default. Il plugin si occupa sia dell'estrazione delle stringhe da tradurre via Babel sia della generazione del modulo virtuale che elenca le lingue disponibili."
InstallSection_fc81ky: "Installa il pacchetto nel tuo progetto Vite + React: React e Vite sono peer dependency, quindi devono già essere presenti."
InstallSection_fhcky6: "Subito dopo il comando il file contiene già tutte le chiavi trovate nel sorgente, ma non tradotte (valore null): sotto la riga separatrice trovi l'elenco esatto di ciò che manca."
InstallSection_kxaz28: "Poi un comando: stima il costo e chiede conferma prima di spendere, e ogni traduzione passa da un validatore che scarta un <code>%s</code> perso o un tag rovinato. Gira solo dalla CLI, mai dentro <code>vite dev</code>."
InstallSection_sn8wj: "Per aggiungere una nuova lingua usa il flag --add del comando di sincronizzazione: crea subito il file con il tag scelto, già popolato con tutte le chiavi trovate nel sorgente (valore null), e chiude con il riepilogo di quante restano da tradurre. Basta sostituire quei null con il testo tradotto."
InstallSection_t5nanj: "Sostituendo ogni null con il testo tradotto (mantenendo invariati eventuali %s) il file risulta completo, pronto per essere usato come lingua disponibile."
InstallSection_ten73a: "Il comando resta comunque disponibile, per lanciarlo a mano o da una pipeline di CI:"
InstallSection_uq5uv6: "Ogni file .yml trovato in localeDir diventa automaticamente disponibile: useTranslateLanguage() lo elenca e TranslateContainer lo carica pigramente alla richiesta, senza bisogno di registrarlo altrove."
InstallSection_ye4k9g: "Per un controllo in CI che non scrive nulla c’è <code>--status</code>: riporta lo stato di ogni tabella ed esce con 1 solo se trova errori."
