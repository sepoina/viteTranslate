App_8faavq: "Plugin Vite per estrarre stringhe dal sorgente (marcatore %s e componente <code>&#60;Translate&#62;</code> ) e generare/sincronizzare le tabelle di traduzione. I file di lingua sono dati (.yml), non moduli JS, e stanno in una cartella tutta loro, indicata da localeDir, caricati pigramente uno alla volta: il cambio lingua a runtime scarica solo il chunk necessario, senza appesantire il bundle iniziale con le lingue non usate."
App_9bx0t0: "Esempi dal vivo"
App_b9yj01: "Ogni sezione ha un indirizzo suo (<code>#icu-plural</code>, <code>#autowrap</code>, <code>#install-llm</code>…): il <code>#</code> accanto al titolo è il link da condividere. I vecchi indirizzi in italiano portano ancora al posto giusto."
App_gh893s: "Marcatori rotti, argomenti mancanti, valori che testo non sono: i comportamenti di confine stanno nella pagina dei casi limite, uno per riga."
