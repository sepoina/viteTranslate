App_nutn8e: "Ogni esempio gira in questa pagina: cambia lingua in alto e guardalo tradursi. Accanto a ciascuno, il codice che lo produce."
App_vwloc: "I testi di questa pagina sono scritti in italiano, la lingua sorgente; si parte in inglese, o nell’ultima lingua scelta sul sito. Il selettore in alto cambia lingua a tutto, esempi compresi."
