ZZZsnippetList_1cpi6bi: "autoWrap: marcatori senza componente"
ZZZsnippetList_1f899uf: "Con ICU il plurale lo decide la lingua: <code>&#123;0, plural, …}</code> sceglie il ramo giusto per ogni numero, e <code>#</code> è il numero stesso, già formattato. Ogni lingua ha le sue categorie: gli ordinali italiani distinguono “l’8º” da “il 7º”, l’inglese ne vuole quattro (1st, 2nd, 3rd, 4th)."
ZZZsnippetList_1itbzsw: "<code>&lt;Translate&gt;</code> restituisce nodi React: non può essere usato in attributi HTML che richiedono una stringa semplice, come <code>placeholder</code>, <code>aria-label</code> o <code>title</code>. In questi casi serve l'hook <code>useTranslateToString()</code>, che risolve la stessa traduzione ma restituisce una stringa primitiva. Questi attributi non sono visibili come testo a schermo: per vederli tradotti ispeziona l'elemento con F12."
ZZZsnippetList_1ju6i1g: "Con l’opzione <code>autoWrap</code> accesa basta marcare il testo JSX o l’attributo di un tag HTML: la chiamata di traduzione la aggiunge il plugin, niente <code>&lt;Translate&gt;</code> e niente <code>ts()</code>. I casi che non copre sono nella pagina dei casi limite."
ZZZsnippetList_1l71q7g: "Dentro il marcatore vale un piccolo dialetto HTML (<code>&lt;b&gt;</code>, <code>&lt;i&gt;</code>, <code>&lt;code&gt;</code>, <code>&lt;br&gt;</code>…), compilato in build: nessun parser nel browser, nessun attributo che passi. Un argomento può essere un nodo React, per esempio un link: React lo rende come qualunque altro figlio, mai come HTML."
ZZZsnippetList_1ployd4: "L'hook useTranslateLanguage() espone in un colpo solo la lingua corrente (id), i tag BCP 47 trovati in localeDir (nessun caricamento, solo l'elenco), il flag debug e proposeNewLanguage per richiedere il caricamento pigro di un'altra lingua a runtime, con callback onStart/onDone/onError per seguirne l'esito."
ZZZsnippetList_1s73ur1: "Il componente <code>&lt;Translate&gt;</code> avvolge il testo statico marcato con %s, sostituito in build-time con l'id di traduzione e il relativo fallback."
ZZZsnippetList_1vw64t6: "Markup e nodi React"
ZZZsnippetList_51ffe2: "Placeholder e attributi"
ZZZsnippetList_6qxhzk: "<code>select</code> sceglie un ramo per chiave; gli argomenti con nome (<code>&#123;name}</code>) arrivano in un oggetto, <code>a=&#123;&#123; name, gender }}</code>. Chi traduce può spostarli dove vuole la sua grammatica, ma il nome resta lo stesso in ogni lingua."
ZZZsnippetList_7dt5dq: "Lo stesso dialetto HTML, per un testo che non passa da una tabella, come la risposta di un server: i tag ammessi diventano nodi React, il resto è sciolto o scartato. Niente <code>dangerouslySetInnerHTML</code>, e l’<code>onerror</code> dell’immagine non parte."
ZZZsnippetList_9kh3ay: "Numeri, valute, date e ore nel formato della lingua corrente, senza librerie: cambia lingua e guarda separatori e nomi dei giorni. Il fuso orario si fissa con la prop <code>timeZone</code> di <code>TranslateContainer</code>, o con l’opzione <code>icu.timeZone</code> del plugin."
