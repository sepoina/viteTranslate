App_11zjdoa: "Vite 插件，用于从源码中提取字符串（%s 标记和 <Trans> 组件）并生成/同步翻译表。语言文件是数据文件（.yml），而非 JS 模块，存放在由 localeDir 指定的专用文件夹中，按需逐个懒加载：运行时切换语言只会下载所需的 chunk，不会因为未使用的语言而使初始 bundle 变得臃肿。"
