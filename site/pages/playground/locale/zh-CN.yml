StrengthsSection_15r2z3b: "<strong>自动检测新语言。</strong>只需在语言文件夹中添加一个 .yml 文件，无需在代码的其他地方注册。"
StrengthsSection_18ktc1p: "<strong>在 CLI 中用 LLM 翻译。</strong>一个命令就能用你选择的模型填补缺失的键：先估算费用，并拒绝任何会在运行时出错的译文。"
StrengthsSection_1dj4mdv: "<strong>ICU MessageFormat，构建时编译。</strong>复数、select、数字和日期，浏览器中无需解析器：只有当某张表用到时才会打包这些辅助函数。"
StrengthsSection_1ecmosj: "<strong>翻译表是数据，不是 JS 模块。</strong>语言文件不携带可执行代码：它在构建时被编译，而不是原样提供给浏览器。"
StrengthsSection_1r3j0je: "<strong>开发环境中自动回退。</strong> 在翻译准备好之前，原始文本始终可见，绝不会出现空字符串或错误。"
StrengthsSection_1rplbik: "<strong>语言延迟加载。</strong> 在运行时切换语言只会下载所需的 chunk，而不会用未使用的语言使初始 bundle 变得臃肿。"
StrengthsSection_1tgj83t: "<strong>零运行时依赖。</strong>Babel 和 Vite 都是 peer dependency：它们在你的机器上工作，绝不会进入打包产物。React 就是你的应用本来就有的那一份。"
StrengthsSection_1uxxl2f: "优势"
StrengthsSection_7t8nu9: "<strong>翻译在重命名后依然保留。</strong> 如果同一段文本只是 id 发生变化，同步会沿用已完成的翻译，而不是从头开始。"
StrengthsSection_gsbr24: "<strong>最终产物中 %s gzip。</strong>真正发送到浏览器的运行时（<code>&#60;Trans&#62;</code>、<code>TransContainer</code>、<code>useTransLanguage</code>）为 %s gzip，包含 ICU 辅助函数，由测试套件测得。翻译内容的体积随你的内容增长，而非随库本身增长。"
StrengthsSection_qebam7: "<strong>从 Vite 5 到 Vite 8，同一套代码。</strong>Vite 7 及以前用 Rollup 和 esbuild，Vite 8 用 Rolldown 和 Oxc：无需不同的配置。"
StrengthsSection_wv4ype: "<strong>自动同步翻译表。</strong> 一条命令即可更新所有语言并标出仍需翻译的内容。"
StrengthsSection_ww3koi: "<strong>文本保留在 JSX 中，包括变量和标签。</strong>无需手动创建或维护键名。"
ThemeToggle_1i35buc: "切换主题"
TopBar_1dz7foh: "全部演示"
ZZZsnippetList_1231a9k: "<code>&lt;Trans&gt;</code> 返回的是 React 节点：不能用在需要普通字符串的 HTML 属性上，比如 <code>placeholder</code>、<code>aria-label</code> 或 <code>title</code>。这些场合需要 <code>useTrans()</code> 这个 hook，以模板形式调用——<code>trans&#96;Write to $&#123;name}&#96;</code>——它解析同样的翻译，但返回的是原始字符串。这些属性在屏幕上看不到文字：用 F12 检查元素才能看到翻译结果。"
ZZZsnippetList_1ba68a8: "开启 <code>autoWrap</code> 选项后，连 <code>&lt;Trans&gt;</code> 都不需要了：一段标记文本——哪怕中间被标签或变量隔开——都会自动变成正确的调用，无需手写 <code>trans()</code>。它覆盖不到的情况列在边缘用例页面中。"
ZZZsnippetList_1cpi6bi: "autoWrap：无需组件的标记"
ZZZsnippetList_1f899uf: "有了 ICU，复数形式由语言决定：<code>&#123;0, plural, …}</code> 为每个数字选择正确的分支，<code>#</code> 就是已格式化的数字本身。每种语言都有自己的类别：意大利语序数词区分 “l’8º” 和 “il 7º”，英语则需要四种（1st、2nd、3rd、4th）。"
ZZZsnippetList_1vw64t6: "标记与 React 节点"
ZZZsnippetList_49z8by: "文本直接写在需要的地方，放进 <code>&lt;Trans&gt;</code> 里：翻译 id 和备用文本由构建过程生成，无需手写任何标记。"
ZZZsnippetList_51ffe2: "占位符与属性"
ZZZsnippetList_6qxhzk: "<code>select</code> 按键选择分支；具名参数（<code>&#123;name}</code>）通过对象传入，<code>a=&#123;&#123; name, gender }}</code>。译者可以按自己语言的语法随意调整它们的位置，但名称在每种语言中都保持不变。"
ZZZsnippetList_7dt5dq: "同一套 HTML 方言，用于不经过翻译表的文本，例如服务器响应：允许的标签变成 React 节点，其余的被拆解或丢弃。无需 <code>dangerouslySetInnerHTML</code>，图片的 <code>onerror</code> 也永远不会触发。"
ZZZsnippetList_7lte6q: "变量像 JSX 一样书写，<code>&#123;name}</code>，放在 <code>&lt;Trans&gt;</code> 里：和以往完全一样的写法。"
ZZZsnippetList_bu91mp: "外部 HTML：basicHtmlToNodes()"
ZZZsnippetList_c0apzk: "复数与序数（ICU）"
ZZZsnippetList_cghb5q: "Select 与具名参数（ICU）"
ZZZsnippetList_dhbcpz: "动态翻译"
ZZZsnippetList_jbhldw: "静态翻译"
ZZZsnippetList_kq7s2m: "数字、货币、日期和时间都按当前语言的格式显示，无需任何库：切换语言，看分隔符和星期名称的变化。时区可通过 <code>TransContainer</code> 的 <code>timeZone</code> 属性设置，或用插件的 <code>icu.timeZone</code> 选项。"
ZZZsnippetList_lu6qcc: "useTransLanguage() hook 一次性暴露当前语言（id）、在 localeDir 中找到的 BCP 47 标签（不加载，只列出）、debug 标志以及 proposeNewLanguage，用于在运行时请求延迟加载另一种语言，并提供 onStart/onDone/onError 回调以跟踪其结果。"
ZZZsnippetList_nesane: "数字、货币与日期（ICU）"
ZZZsnippetList_ns6u8j: "没有属性的方言标签（<code>&lt;b&gt;</code>、<code>&lt;i&gt;</code>、<code>&lt;code&gt;</code>、<code>&lt;br&gt;</code>……）仍然是文本，译者可以把它移到句子需要的位置。链接或组件则变成一个编号的插槽：属性留在代码里，绝不会出现在译文中。"
ZZZsnippetList_ska6o3: "语言切换"
