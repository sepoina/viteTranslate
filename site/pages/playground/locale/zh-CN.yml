App_8faavq: "Vite 插件，用于从源码中提取字符串（%s 标记和 <Translate> 组件）并生成/同步翻译表。语言文件是数据文件（.yml），而非 JS 模块，存放在由 localeDir 指定的专用文件夹中，按需逐个懒加载：运行时切换语言只会下载所需的 chunk，不会因为未使用的语言而使初始 bundle 变得臃肿。"
App_9bx0t0: "实时示例"
App_b9yj01: "每个部分都有自己的地址（<code>#icu-plural</code>、<code>#autowrap</code>、<code>#install-llm</code>…）：标题旁的 <code>#</code> 就是可分享的链接。旧的意大利语地址仍然会跳到正确的位置。"
App_gh893s: "损坏的标记、缺失的参数、不是文本的值：这些边界行为都在边界情况页面里，每行一个。"
