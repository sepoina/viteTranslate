InstallSection_10dmb4o: "。这与插件首次运行时自动创建的文件完全相同，详见开发运行。"
InstallSection_132q22t: "待翻译的内容块也不必亲自复制：<code>llm</code> 选项让命令调用一个兼容 OpenAI API 的模型（Gemini、OpenAI、OpenRouter、Groq、Ollama…）。配置里写的是保存密钥的环境变量名，绝不是密钥本身。"
InstallSection_157cj31: "自 4.2 版本起，首次运行前无需任何准备：插件会在 Vite 的 config 钩子中自行同步表格，甚至在服务器存在之前就完成。第一次运行 npm run dev 时，默认语言文件会自动创建（见语言构建），随时可供 TranslateContainer 读取。"
InstallSection_19xkq7a: "无论是自动运行还是手动运行，结果都一样：即使是全新项目、还没有其他语言文件，也会生成第一份语言表，也就是在"
InstallSection_1agwhaj: "自 4.2 版本起，同步是自动完成的：开发服务器每次启动时做一次快速检查，每次生产构建前做一次完整扫描。不需要编写脚本，也不需要记住命令。"
InstallSection_1fktekt: "费用、支出上限、把密钥存进系统钥匙串，以及全部选项："
InstallSection_1rl7c67: "每种语言都是 localeDir 中的一个 .yml 文件，文件名与其语言标签相同"
InstallSection_1w2c6tx: "同样的这些键，与此同时也会出现在默认语言文件中：在那里它们永远不会是 null，但只要在至少一种其他语言中仍未翻译，就会被归到同一条分隔线下方。这是一个方便之处：你可以复制那个区块（真实文本，不是 null）粘贴给 LLM 进行翻译，然后把结果粘贴回目标语言文件中替换掉对应的 null。"
InstallSection_3809a4: "。默认语言文件由同步命令自动创建并保持更新：无需手动编写，只在需要时进行翻译。"
InstallSection_89ggya: "配置好插件后项目的样子如下：locale 是与 src 并列的文件夹，由 localeDir 指定，其中每种语言对应一个 .yml 文件。"
InstallSection_b1j9f6: "安装"
InstallSection_dhlwwk: "将应用包裹在 TranslateContainer 中，并指定要加载的初始语言：它会暴露 Translate 和其他 hook 所使用的上下文，用于读取当前的翻译表。在开发环境中，回退值仍嵌入在编译后的代码里，因此应用无需运行其他命令即可显示已翻译的文本。"
InstallSection_eqg418: "在 vite.config.js 中注册 viteTranslate 插件：需要向它指明语言文件所在的文件夹和默认语言。该插件既负责通过 Babel 提取需要翻译的字符串，也负责生成列出可用语言的虚拟模块。"
InstallSection_fc81ky: "在你的 Vite + React 项目中安装该软件包：React 和 Vite 是 peer dependency，因此它们必须已经存在。"
InstallSection_fhcky6: "命令执行后，该文件已包含源代码中找到的所有键，但尚未翻译（值为 null）：在分隔线下方，你会看到缺失内容的确切清单。"
InstallSection_kxaz28: "然后只需一个命令：它先估算费用并在花钱前征求确认，每条译文都要通过校验器，丢失的 <code>%s</code> 或损坏的标签都会被拒绝。它只在 CLI 中运行，绝不会在 <code>vite dev</code> 里运行。"
InstallSection_sn8wj: "要添加新语言，使用同步命令的 --add 参数：它会立即创建所选标签对应的文件，并用源码中找到的所有键预先填充（值为 null），最后显示还有多少条待翻译的汇总。只需把这些 null 替换为翻译后的文本即可。"
InstallSection_t5nanj: "把每个 null 替换为翻译后的文本（保持任何 %s 不变），该文件即完整，可作为一种可用语言使用。"
InstallSection_ten73a: "该命令依然可用，可以手动运行，也可以放进 CI 流程中："
InstallSection_uq5uv6: "localeDir 中找到的每个 .yml 文件都会自动可用：useTranslateLanguage() 会将其列出，TranslateContainer 会在请求时懒加载它，无需在别处注册。"
InstallSection_ye4k9g: "如需在 CI 中做只读检查，可以用 <code>--status</code>：它报告每张表的状态，只有发现错误时才以 1 退出。"
