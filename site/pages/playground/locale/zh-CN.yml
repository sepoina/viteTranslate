ZZZsnippetList_1cpi6bi: "autoWrap：无需组件的标记"
ZZZsnippetList_1f899uf: "有了 ICU，复数形式由语言决定：<code>&#123;0, plural, …}</code> 为每个数字选择正确的分支，<code>#</code> 就是已格式化的数字本身。每种语言都有自己的类别：意大利语序数词区分 “l’8º” 和 “il 7º”，英语则需要四种（1st、2nd、3rd、4th）。"
ZZZsnippetList_1itbzsw: "<code>&lt;Translate&gt;</code> 返回 React 节点：它不能用于需要纯字符串的 HTML 属性中，例如 <code>placeholder</code>、<code>aria-label</code> 或 <code>title</code>。这些情况下需要使用 <code>useTranslateToString()</code> hook，它解析相同的翻译，但返回一个原始字符串。这些属性不会作为屏幕上的文本可见：要查看它们的翻译，请用 F12 检查该元素。"
ZZZsnippetList_1ju6i1g: "开启 <code>autoWrap</code> 选项后，只需标记 JSX 文本或 HTML 标签的属性：翻译调用由插件自动加上，无需 <code>&lt;Translate&gt;</code>，也无需 <code>ts()</code>。它不覆盖的情况见边界情况页面。"
ZZZsnippetList_1l71q7g: "标记内部可以使用一小套 HTML 方言（<code>&lt;b&gt;</code>、<code>&lt;i&gt;</code>、<code>&lt;code&gt;</code>、<code>&lt;br&gt;</code>…），在构建时编译：浏览器中没有解析器，任何属性都不会被放行。参数可以是 React 节点，比如一个链接：React 会像渲染其他子节点一样渲染它，绝不当作 HTML。"
ZZZsnippetList_1ployd4: "useTranslateLanguage() hook 一次性暴露当前语言（id）、在 localeDir 中找到的 BCP 47 标签（不加载，只列出）、debug 标志以及 proposeNewLanguage，用于在运行时请求延迟加载另一种语言，并提供 onStart/onDone/onError 回调以跟踪其结果。"
ZZZsnippetList_1s73ur1: "<code>&lt;Translate&gt;</code> 组件包裹用 %s 标记的静态文本，在构建时替换为翻译 id 及其回退值。"
ZZZsnippetList_1vw64t6: "标记与 React 节点"
ZZZsnippetList_51ffe2: "占位符与属性"
ZZZsnippetList_6qxhzk: "<code>select</code> 按键选择分支；具名参数（<code>&#123;name}</code>）通过对象传入，<code>a=&#123;&#123; name, gender }}</code>。译者可以按自己语言的语法随意调整它们的位置，但名称在每种语言中都保持不变。"
ZZZsnippetList_7dt5dq: "同一套 HTML 方言，用于不经过翻译表的文本，例如服务器响应：允许的标签变成 React 节点，其余的被拆解或丢弃。无需 <code>dangerouslySetInnerHTML</code>，图片的 <code>onerror</code> 也永远不会触发。"
ZZZsnippetList_9kh3ay: "数字、货币、日期和时间都按当前语言的格式显示，无需任何库：切换语言，看分隔符和星期名称的变化。时区可通过 <code>TranslateContainer</code> 的 <code>timeZone</code> 属性设置，或用插件的 <code>icu.timeZone</code> 选项。"
