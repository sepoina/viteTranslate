ZZZsnippetList_1cpi6bi: "autoWrap: markers without a component"
ZZZsnippetList_1f899uf: "With ICU the language decides the plural: <code>&#123;0, plural, …}</code> picks the right branch for each number, and <code>#</code> is the number itself, already formatted. Every language has its own categories: Italian ordinals tell “l’8º” from “il 7º”, English wants four (1st, 2nd, 3rd, 4th)."
ZZZsnippetList_1itbzsw: "<code>&lt;Translate&gt;</code> returns React nodes: it cannot be used in HTML attributes that require a plain string, such as <code>placeholder</code>, <code>aria-label</code> or <code>title</code>. In these cases you need the <code>useTranslateToString()</code> hook, which resolves the same translation but returns a primitive string. These attributes are not visible as on-screen text: to see them translated, inspect the element with F12."
ZZZsnippetList_1ju6i1g: "With the <code>autoWrap</code> option on, marking the JSX text or the attribute of an HTML tag is enough: the plugin adds the translation call, no <code>&lt;Translate&gt;</code> and no <code>ts()</code>. What it doesn’t cover is on the edge cases page."
ZZZsnippetList_1l71q7g: "Inside the marker a small HTML dialect applies (<code>&lt;b&gt;</code>, <code>&lt;i&gt;</code>, <code>&lt;code&gt;</code>, <code>&lt;br&gt;</code>…), compiled at build time: no parser in the browser, no attribute gets through. An argument can be a React node, a link for instance: React renders it like any other child, never as HTML."
ZZZsnippetList_1ployd4: "The useTranslateLanguage() hook exposes in one go the current language (id), the BCP 47 tags found in localeDir (no loading, just the list), the debug flag and proposeNewLanguage to request lazy loading of another language at runtime, with onStart/onDone/onError callbacks to track the outcome."
ZZZsnippetList_1s73ur1: "The <code>&lt;Translate&gt;</code> component wraps static text marked with %s, replaced at build time with the translation id and its fallback."
ZZZsnippetList_1vw64t6: "Markup and React nodes"
ZZZsnippetList_51ffe2: "Placeholders and attributes"
ZZZsnippetList_6qxhzk: "<code>select</code> picks a branch by key; named arguments (<code>&#123;name}</code>) arrive in an object, <code>a=&#123;&#123; name, gender }}</code>. Translators can move them wherever their grammar wants, but the name stays the same in every language."
ZZZsnippetList_7dt5dq: "The same HTML dialect, for a text that doesn’t go through a table, like a server response: allowed tags become React nodes, the rest is unwrapped or dropped. No <code>dangerouslySetInnerHTML</code>, and the image’s <code>onerror</code> never fires."
ZZZsnippetList_9kh3ay: "Numbers, currencies, dates and times in the current language’s format, with no library: switch language and watch the separators and day names. The time zone is set with the <code>timeZone</code> prop of <code>TranslateContainer</code>, or with the plugin’s <code>icu.timeZone</code> option."
