StrengthsSection_146suvo: "<strong>Text marked directly in the source.</strong> No keys to create or manage by hand."
StrengthsSection_15r2z3b: "<strong>New languages detected automatically.</strong> Just add a .yml file in the languages folder, with no need to register it anywhere else in the code."
StrengthsSection_18ktc1p: "<strong>Translation with an LLM, from the CLI.</strong> One command fills the missing keys with the model you pick: it estimates the cost first and rejects anything that would break at runtime."
StrengthsSection_1dj4mdv: "<strong>ICU MessageFormat, compiled at build time.</strong> Plurals, select, numbers and dates with no parser in the browser: the helpers ship only if a table uses them."
StrengthsSection_1ecmosj: "<strong>The tables are data, not JS modules.</strong> A language file carries no executable code: it is compiled at build time, never served as it is."
StrengthsSection_1hve07m: "<strong>%s gzip in the final bundle.</strong> The runtime that actually reaches the browser (<code>&#60;Translate&#62;</code>, <code>TranslateContainer</code>, <code>useTranslateLanguage</code>) weighs %s gzip, measured by comparing a production build with and without the library. The translation payload scales with your content, not with the library."
StrengthsSection_1r3j0je: "<strong>Automatic fallback in development.</strong> Until a translation is ready, the original text stays visible, never an empty string or an error."
StrengthsSection_1rplbik: "<strong>Lazy language loading.</strong> Switching language at runtime downloads only the required chunk, without bloating the initial bundle with unused languages."
StrengthsSection_1uxxl2f: "Strengths"
StrengthsSection_1y1sghw: "<strong>No runtime dependencies.</strong> Babel, Vite and React are peer dependencies: they work on your machine and never enter the bundle."
StrengthsSection_7t8nu9: "<strong>Translations survive renames.</strong> If the same text only changes id, the sync inherits the translation already done instead of starting it over from scratch."
StrengthsSection_qebam7: "<strong>Vite 5 to Vite 8, same code.</strong> Rollup and esbuild up to Vite 7, Rolldown and Oxc on Vite 8: no different configuration."
StrengthsSection_wv4ype: "<strong>Automatic table sync.</strong> A single command updates all languages and flags what remains to be translated."
