App_8faavq: "Vite plugin to extract strings from source code (%s marker and <Translate> component) and generate/synchronize translation tables. Language files are data files (.yml), not JS modules, stored in their own folder specified by localeDir, and lazily loaded one at a time: switching languages at runtime downloads only the necessary chunk, without bloating the initial bundle with unused languages."
