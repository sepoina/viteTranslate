InstallSection_10dmb4o: ". It's the same file the plugin creates by itself on first run, described in Dev run."
InstallSection_132q22t: "You don’t even have to copy the block to translate yourself: the <code>llm</code> option points the command at a model with an OpenAI-compatible API (Gemini, OpenAI, OpenRouter, Groq, Ollama…). The config holds the name of the environment variable with the key, never the key itself."
InstallSection_157cj31: "Since 4.2 there's nothing to prepare before the first run: the plugin syncs the tables by itself, inside Vite's config hook, before the server even exists. The first npm run dev creates the default language file automatically (see Language build), ready for TranslateContainer to read."
InstallSection_19xkq7a: "Whether it runs by itself or by hand, the result is the same: even on a brand new project with no other language files, it generates the first language table, the one for the language set as default in"
InstallSection_1agwhaj: "Since 4.2 the sync happens by itself: a quick check at every dev server start, a full scan before every production build. No script to write, no command to remember."
InstallSection_1fktekt: "Costs, spending limits, the key in the system keychain and every option:"
InstallSection_1rl7c67: "Each language is a .yml file inside localeDir, with the same name as its tag"
InstallSection_1w2c6tx: "The same keys appear, at the same time, in the default language file too: never as null there, but grouped below the same separator line as long as they remain untranslated in at least one other language. That's a handy opportunity: you can copy that block (real text, not null) and paste it into an LLM to have it translated, then paste the answer back in place of the nulls in the destination language file."
InstallSection_3809a4: ". The default language file is created and kept up to date automatically by the sync command: it should not be written by hand, only translated if needed."
InstallSection_89ggya: "Here's how the project looks once the plugin is configured: locale is a folder next to src, pointed to by localeDir, containing one .yml file per language."
InstallSection_b1j9f6: "Installation"
InstallSection_dhlwwk: "Wrap the app in TranslateContainer, specifying the initial language to load: it exposes the context used by Translate and the other hooks to read the current translation table. In development the fallback stays embedded in the compiled code, so the app already shows the translated text without having to run other commands."
InstallSection_eqg418: "Register the viteTranslate plugin in vite.config.js: you need to point it to the language files folder and the default language. The plugin handles both extracting the strings to translate via Babel and generating the virtual module that lists the available languages."
InstallSection_fc81ky: "Install the package in your Vite + React project: React and Vite are peer dependencies, so they must already be present."
InstallSection_fhcky6: "Right after the command, the file already contains all the keys found in the source, but untranslated (null value): below the separator line you'll find the exact list of what's missing."
InstallSection_kxaz28: "Then one command: it estimates the cost and asks before spending anything, and every translation goes through a validator that rejects a lost <code>%s</code> or a mangled tag. It runs only from the CLI, never inside <code>vite dev</code>."
InstallSection_sn8wj: "To add a new language, use the sync command's --add flag: it creates the file for the chosen tag right away, already filled with every key found in the source (as null), and finishes with a summary of how many are left to translate. Just replace those nulls with the translated text."
InstallSection_t5nanj: "By replacing every null with the translated text (keeping any %s unchanged), the file is complete, ready to be used as an available language."
InstallSection_ten73a: "The command is still there, to run by hand or from a CI pipeline:"
InstallSection_uq5uv6: "Every .yml file found in localeDir automatically becomes available: useTranslateLanguage() lists it and TranslateContainer lazy-loads it on demand, with no need to register it anywhere else."
InstallSection_ye4k9g: "For a CI check that writes nothing there’s <code>--status</code>: it reports the state of every table and exits with 1 only when it finds errors."
