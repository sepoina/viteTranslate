App_nutn8e: "Every example runs on this page: switch language at the top and watch it translate. Next to each one, the code that produces it."
App_vwloc: "This page is written in Italian, the source language; it starts in English, or in the last language you picked on the site. The switcher at the top changes the language of everything, examples included."
