<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0f0d" />
    <!-- Favicon from site/cli/favicon.mjs: the PNG goes first with its size, so browsers that read SVG pick the SVG -->
    <link rel="icon" href="/src/theme/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/src/theme/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/src/theme/apple-touch-icon.png" />
    <!-- Font: li carica src/theme/theme.css (Alfa Slab One, Schibsted Grotesk, IBM Plex Mono). Qui i preconnect
         e Inter, il carattere del solo manuale (docs.css, --d-font): un link e non un @import, che nel CSS
         unito finirebbe dopo altre regole e il browser lo ignorerebbe. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" />
    <title>viteTranslate docs</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
