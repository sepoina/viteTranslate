faq_bdpbo0: "Les chaînes sont toujours {0} pour la langue en cours de remplissage, chacune avec le nom du composant d'où elle vient, et un bref résumé du projet que vous pouvez lire et modifier. Pas vos fichiers source, et pas votre clé API. Voir <1>Le contexte abstrait</1>."
