translationfiles_1377m6b: "Fichiers de traduction"
translationfiles_1fjnly4: "Un commentaire d'en-tête (nom de la langue, tag, nombre de clés manquantes, horodatage de la dernière synchronisation, version du format) se trouve en haut, régénéré à chaque synchronisation — ne jamais l'éditer à la main. Tout ce qui suit est du texte : le reste du fichier ne contient rien d'autre."
translationfiles_1ldtag2: "<b>Remplacement atomique.</b> Une table est écrite dans un fichier temporaire ({0}) puis renommée par-dessus l'ancienne, ainsi <em>un plantage ne laisse jamais une table à moitié écrite</em>. Si un plantage laisse l'un de ces fichiers temporaires derrière lui, supprimez-le."
translationfiles_1npo7k0: "La synchronisation est la seule chose qui écrit vos tables, donc elle est prudente :"
translationfiles_1p3j85i: "Format de fichier"
translationfiles_1u4t3tb: "Les valeurs sont toujours entre guillemets doubles, une entrée par ligne, sans indentation. C'est un <b>sous-ensemble strict de YAML</b> : tout ce que ce format accepte, un vrai parseur YAML le lit de la même façon, donc votre éditeur le colore et n'importe quel outil YAML peut le lire. Le sous-ensemble est volontairement étroit — les scalaires YAML non quotés abîment exactement le texte que les traducteurs écrivent ({0} est une erreur de syntaxe, {1} est tronqué en {2}, {3} devient le nombre {4}). Tout ce qui sort du sous-ensemble est une erreur indiquant le <b>numéro de ligne</b>, <em>pas une valeur fausse plausible</em>."
translationfiles_2p6vq7: "Chaque langue est un fichier {0} dans {1}, nommé d'après son tag BCP 47 ({2}, {3}, …), contenant la table de traduction sous forme de map plate. Le fichier de la <b>langue source</b> est entièrement autogénéré à partir des marqueurs trouvés dans votre source — <em>vous ne l'écrivez jamais à la main</em>. Pour ajouter une langue, voir <4>Ajouter une langue</4>."
translationfiles_ag80ux: "Vous venez de la 3.x ? Les fichiers de langue étaient des modules JS : voir <0>migration depuis la 3.x</0>."
translationfiles_fth1yh: "Les fichiers .yml de langues : leur format, et ce qui les protège pendant que la synchronisation les réécrit."
translationfiles_gsf4r5: "🧪 À quoi ressemble ce texte à l'écran — accents, emoji, CJK, guillemets, barres obliques inversées, sauts de ligne : <0>textes réels, en direct</0>."
translationfiles_h4afs3: "<b>Pas d'écrasement.</b> Un fichier que vous avez sauvegardé pendant que la synchronisation était en cours n'est pas écrasé : la synchronisation s'arrête avec un message et vous la relancez."
translationfiles_ov9sxt: "<b>Sauvegardes.</b> Avant de régénérer une table car elle était corrompue ({0}), ou avant une suppression massive suspecte ({1}, une par langue), le fichier est copié octet par octet — quelle que soit son encodage. Si une sauvegarde ne peut pas être écrite, rien n'est écrasé."
translationfiles_t5lj77: "Ce qui protège vos fichiers"
translationfiles_vt6wmr: "<b>Tout ou rien, avant la première écriture.</b> Chaque fichier est lu, planifié et sauvegardé avant qu'une table ne soit remplacée. Un seul fichier illisible, y compris un lien symbolique de langue cassé ou inaccessible, <em>arrête toute la synchronisation sans rien modifier</em>."
translationfiles_y304mw: "Elle est prudente, pas magique : la vérification est faite juste avant chaque tentative de renommage, y compris les nouvelles tentatives sous Windows (une petite fenêtre subsiste), il n'y a pas de verrou entre processus, et plusieurs tables sont remplacées l'une après l'autre, pas comme une seule transaction — voir <0>limitations</0>. Les messages et les actions à suivre sont dans <1>la référence CLI</1>."
