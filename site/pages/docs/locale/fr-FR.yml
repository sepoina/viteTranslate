panel_17s3fuk: "<b>La barre de commandes</b> : <b>Sync</b> lance le {0} du projet dans un terminal, et <b>LLM</b> échange <b>Résultats</b> contre la <1>page LLM</1>. À droite : GitHub, ⚙ <2>Paramètres</2>, ↻ actualiser."
