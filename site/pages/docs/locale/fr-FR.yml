running_jdx2hv: "<b>Si une table ne peut pas être enregistrée</b>, l'exécution conserve les résultats payants, réessaie aux points de contrôle suivants et à la fin, puis enregistre les candidats restants sous {0} (ignoré par la synchronisation), avertit, et se termine avec le code {1}. Quand la table est lisible, la récupération exclut les clés supprimées, les valeurs déjà enregistrées et les traductions humaines ; {2} autorise toujours les remplacements. Si la table ne peut pas être lue, le fichier est étiqueté <b>archive de candidats</b> : son contenu n'a pas été vérifié par rapport à vos dernières modifications. Comparez l'un ou l'autre fichier de récupération avec la table actuelle avant de fusionner, en préservant les modifications humaines plus récentes et les clés supprimées. Lancez ensuite la synchronisation et supprimez le fichier de récupération une fois que vous avez récupéré ce dont vous avez besoin."
