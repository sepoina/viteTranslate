cli_1ipkplr: "C'est le flag que le plugin lui-même utilise en interne au démarrage du serveur de dev (voir {0} dans <1>options du plugin</1>), donc la plupart des projets n'ont jamais besoin de le taper à la main. Il a tout de même son utilité seul : une tâche CI qui veut vérifier la fraîcheur sans payer le scan complet, ou un projet qui a désactivé {2} et veut une vérification économique dans un script {3}. Il n'est <i>pas</i> fait pour {4}/{5} : avant un build de production, payer le scan complet pour la certitude de tables reconstruites à neuf est le bon compromis."
