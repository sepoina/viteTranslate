diagnostics_h4c9cc: "<b>Les messages du plugin pendant {0} suivent leur propre règle : un avertissement par catégorie, les autres sur demande.</b> Le premier message dans une catégorie donnée (un fichier de langue invalide, un fichier vide, un marqueur mal formé, etc.) s'affiche en entier ; les autres de cette catégorie ne sont comptés que, avec une conclusion en {1}. Le bloc apparaît un quart de seconde après le dernier avertissement du lot, donc une page chargée est un bloc et non cinq. Recharger une page avec exactement les mêmes problèmes que précédemment n'affiche rien une seconde fois — mais seulement dans le même processus {2} : le redémarrer affiche toujours la vue complète au moins une fois, et si le comptage est inchangé par rapport à l'exécution précédente, la ligne de conclusion dit simplement « identique à la session précédente »."
