cli_17dfc71: "Signale chaque table de traduction et quitte <b>sans rien écrire</b> : clés, traductions manquantes, tables désynchronisées par rapport au code source, et erreurs — un fichier de langue illisible, une langue source manquante, des fichiers encore au format 3.x. La référence est le code source tel qu'il est maintenant, pas le fichier de langue source, il répond donc aussi à « dois-je relancer la synchronisation ? »."
