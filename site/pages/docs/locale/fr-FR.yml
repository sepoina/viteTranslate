languageswitcher_axfsca: "{0} est la langue écrite dans sa propre langue, région incluse : avec {1}, {2} et {3}, les boutons affichent <i>American English</i>, <i>Deutsch (Deutschland)</i> et <i>français (France)</i>."
languageswitcher_i2w702: "Le tableau {0} est figé et partagé par toute l'application. Pour le trier ou le filtrer, copiez-le d'abord : {1}."
