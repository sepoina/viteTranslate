cli_cff2vp: "Lit la config {0} depuis {1} dans le répertoire de travail courant, scanne {2} à la recherche des chaînes marquées ({3} par défaut, ou vos propres <4>délimiteurs</4>) et des appels {5} (ou des templates taggés {6}), et synchronise chaque fichier de langue dans {7} : ajoute les nouvelles clés, supprime les obsolètes — en reportant la traduction quand une clé a seulement été renommée, et quand le renommage a aussi changé l'écriture des placeholders ({8} vers {9}, conversion d'un marqueur vers le préprocesseur) : les {10}s ou {11}s de l'ancienne traduction sont réécrits dans les nouveaux, dans l'ordre, et conservés uniquement si le nombre correspond — <em>sinon la nouvelle clé est laissée {12} plutôt que de risquer d'afficher le mauvais argument</em> — et signale ce qui reste non traduit. Le plugin exécute cela pour vous, au démarrage du serveur de dev et avant chaque build (voir <13>options du plugin</13>) ; cette commande est ce vers quoi vous vous tournez quand vous la voulez exprès — {14}, {15}, {16}, ou une vérification en CI."
