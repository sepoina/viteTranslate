overview_1kiadux: "Découvrez viteTranslate, une visite vidéo, les quatre étapes d’une phrase en JSX jusqu’à la livraison d’une langue, et les prochaines étapes."
overview_1kljp5l: "<b>Des outils à votre disposition, si vous en avez besoin.</b> Une <0>CLI</0> pour la synchronisation, les vérifications CI et la traduction par LLM, avec une limite de dépenses ; une <1>extension VS Code</1> qui affiche chaque chaîne et son état."
