installation_nh39v5: "{0} <i>(uniquement pour {1}, voir <2>configuration LLM</2>)</i>"
installation_ny5sda: "{0} <i>(pour le point d'entrée {1})</i>"
installation_puvrk7: "<code>%s</code> est facultatif, et le reste"
installation_q0urhf: "<b>non</b>"
installation_qnbuwa: "Babel s'exécute sur votre machine pendant {0} et {1}, et rien de lui n'entre dans le bundle que vous livrez. Cela vaut quelle que soit la façon dont vous placez le paquet dans votre {2}, et c'est vérifié plutôt que supposé : la suite de tests affirme que le runtime navigateur n'importe rien d'autre que React et le module virtuel, et qu'aucune trace de Babel n'y subsiste."
installation_tfq7wk: "Le plugin l'utilise pour analyser vos sources et trouver les marqueurs. Sans lui, rien n'est extrait, les marqueurs atteignent le navigateur sous leur forme source, et l'application affiche chaque chaîne non traduite tout en ayant l'air de fonctionner. C'est pourquoi son absence arrête le serveur de dev et fait échouer la build, plutôt que de produire un avertissement que personne ne lit."
installation_v05z5e: "Installez-les si votre projet ne les a pas déjà. Les sources {0}/{1}/{2}/{3} sont toutes analysées. Les déclarations TypeScript sont fournies avec le paquet."
installation_v3fxaf: "Cette asymétrie a un prix, et c'est le prix de rendre le peer obligatoire : dans ces deux cas, votre installation de production récupère Babel et toute son arborescence, pour quelque chose qui ne s'y exécute jamais. {0} ne l'abandonnera pas, car ce n'est pas une dépendance de dev dans cette configuration. Si le poids compte plus pour vous que l'installation automatique, déclarez {1} comme facultatif dans votre propre {2} : les vérifications ci-dessus portent sur l'<i>utilisation</i> du plugin, pas sur la manière dont il a été installé, et elles continuent de fonctionner dans les deux cas."
installation_vjbi13: "Étant un peer obligatoire, npm et pnpm l'installent d'eux-mêmes. Yarn ne fait qu'avertir, et il ne vient pas non plus en réflexion depuis {0}, qui depuis la version 6 ne dépend plus de Babel. Si votre gestionnaire de paquets l'a omis, installez-le vous-même :"
installation_vv9lcf: "Facultatif"
languages_10s3t77: "Le tag doit être au format {0} et désigner une langue et une région réelles (<1>liste prise en charge</1>) — {2} est refusé avant toute écriture sur le disque. Une langue déjà présente reste intacte."
languages_12o3096: "Une valeur comme {0} vient d'avoir écrit du JSX dans {1} (<2>Translate</2>) : {3} ici n'a pas d'attributs, donc c'est du texte — déplacez-le où la phrase le demande, comme n'importe quelle autre balise. Un {4} est différent : c'est un <b>emplacement</b>, qui représente un lien ou un composant fourni par le code source — un {5}, un {6}. Conservez chaque balise numérotée, d'ouverture et de fermeture, avec son numéro, autour des mots qui lui appartiennent ; vous pouvez déplacer une balise avec ses mots, mais jamais la renommer, en supprimer une, ni en transformer une en une balise différente — le numéro est la façon dont le tableau compilé retrouve le bon élément, pas un choix de style."
languages_1bsazhq: "🎮 <0>Les mêmes étapes, en direct</0> — {1}, les {2}, le fichier terminé."
languages_1c7vi19: "Ajouter une langue"
languages_1e726fy: "Remplacez chaque {0} par le texte traduit, en conservant les emplacements {1} et les balises numérotées ({2}) intacts, puis synchronisez à nouveau pour que le fichier prenne sa forme définitive :"
languages_1jsc9lo: "Aucune autre inscription nécessaire : chaque fichier {0} dans {1} est automatiquement disponible — {2} le liste et {3} le charge paresseusement à la demande."
languages_1m6gd4x: "<b>Méthodologie de construction :</b> Cette liste a été compilée en développant un ensemble de base de tags de langue BCP 47 courants par recoupement avec les capacités d'internationalisation natives de Google Chrome (via le moteur V8 et la bibliothèque ICU). Pour maintenir une cohérence structurelle stricte dans l'ensemble de données, une règle de filtrage a été appliquée afin de ne conserver que les formats {0} (xx-XX) standard. Les codes de langue autonomes (par ex. {1}, {2}) et les tags de macro-région (par ex. {3}) ont été volontairement exclus du tableau final, bien qu'ils soient pris en charge nativement par les API {4} du navigateur."
languages_1xyv0cm: "Les tags acceptés par {0} : {1}, une langue réelle dans une région réelle (<2>CLI</2>). 🎮 <3>Ajouter une langue</3> et <4>basculer entre elles</4>, en direct."
languages_2a4xjr: "<b>Sources de données :</b> Les sources autoritaires principales utilisées pour valider et développer cette liste incluent la documentation officielle de l'API Google Chrome Extensions pour les locales prises en charge par {0}, le registre de codes de langue de l'API Google Workspace Admin Directory, et les correspondances du Common Locale Data Repository (CLDR) qui régissent l'implémentation ICU (International Components for Unicode) sous-jacente de Chromium."
languages_61o2yb: "Notes méthodologiques"
languages_632opc: "Tags de langue pris en charge"
languages_cq382p: "{0} fait la suite pour vous — il remplit les {1} via un LLM que vous configurez, avec un validateur qui refuse tout ce qui casserait à l'exécution. Voir <2>Configuration du LLM</2>. La méthode manuelle fonctionne aussi, et fonctionnera toujours : copiez ce bloc dans un LLM à la main, puis collez la réponse par-dessus les {3} :"
languages_h0h1rx: "Les mêmes clés apparaissent aussi dans le fichier de la langue source, regroupées sous le même séparateur — jamais en tant que {0} là-bas, mais en vrai texte, tant qu'elles manquent dans au moins une autre langue."
