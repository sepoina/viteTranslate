running_423ml4: "La même règle « uniquement quand nécessaire » s'applique aux balises numérotées : une langue dont le lot contient au moins un {0} obtient la règle supplémentaire de conserver chacune, avec son numéro, autour des bons mots — déplacer une balise avec ses mots est autorisé, la renuméroter ou la imbriquer différemment ne l'est pas. Certains éléments ont aussi un champ {1}, un indice sur ce que représente un espace réservé dans le code — {2} — là pour aider à choisir les bons mots, et jamais écrit dans le tableau {3} : il est recalculé à partir de la source à chaque exécution, pas partie de la traduction."
