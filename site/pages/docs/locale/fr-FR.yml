panel_pw36i1: "<b>vite.config</b> s'exécute comme {0} le fait : dans un processus séparé, jamais via Vite. Aucun hook de plugin ne s'exécute, rien n'est synchronisé, rien n'est écrit. Une config qui bloque est abandonnée après 15 secondes, et ce qu'elle affiche se retrouve dans le canal de sortie <b>viteTranslate</b>. En <b>Mode Restreint</b> rien ne s'exécute : vous obtenez {1} seulement, pas de <b>Résultats</b> ni de <b>Sync</b>. Faites confiance à l'espace de travail pour voir le reste."
