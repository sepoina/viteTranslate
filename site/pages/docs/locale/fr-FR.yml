price_v10mgk: "Certains modèles réfléchissent avant de répondre, et facturent cette réflexion comme jetons de sortie sous le même {0} que la réponse. Dans la démo restaurant, {1} a passé 78 % de ses jetons de sortie à réfléchir, et chaque troncature provenait de là. L'exécution mesure cela séparément — à partir de {2}, là où le fournisseur le signale — par clé et par langue, dimensionne les lots en conséquence, et affiche sa part sur la dernière ligne :"
price_ydn5di: "Une réponse qui revient <b>tronquée</b> n'est jamais renvoyée telle quelle : la même question sous la même limite serait de nouveau tronquée, et chaque tentative est facturée. Ce qui est revenu complet est conservé ; les autres clés repartent vers le modèle <b>dans la même exécution</b>, par lots d'au plus la moitié de la taille, sur trois tours au maximum (100 → 50 → 25 → 12). Les clés encore coupées après cela restent {0}, et une note sous le panneau le signale. La réponse tronquée calibre aussi l'exécution suivante : les clés qu'elle a rapportées mesurent la réponse, et sa réflexion, répartie sur tout le lot, constitue un plancher — même lorsque le modèle a brûlé tout le {1} à réfléchir sans jamais atteindre la réponse."
price_yrfndr: "L'estimation convertit les caractères en jetons avec un ratio fixe lors de la première exécution : 4 caractères par jeton, 1,5 lorsque la langue <b>source</b> est chinoise, japonaise ou coréenne. Ensuite, elle se fie à ce que {0} du fournisseur a signalé — par modèle, et pour la sortie par langue cible, divisée en deux : la réponse elle-même, et la phase de réflexion d'un <1>modèle raisonnant</1>, par clé. Seuls les ~300 dernières clés de chaque langue comptent, donc un modèle qui change de comportement apparaît dans une exécution."
price_zburfc: "Estimation en dessous de {0}"
