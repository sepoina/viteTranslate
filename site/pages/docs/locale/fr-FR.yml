panel_tiq9jm: "Sous <b>VERSION</b>, qui est qui : cette extension, la bibliothèque installée dans le projet, la plus ancienne bibliothèque acceptée par l'extension, et l'API IDE (comment <b>Résultats</b> parle à la bibliothèque), présente / demandée. Jaune signifie manquante ou trop ancienne ; survolez pour savoir pourquoi."
