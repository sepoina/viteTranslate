installation_12okzxg: "Dépendance de pair"
installation_13yxl2y: "Une asymétrie à connaître. Avec le rendu côté serveur, le runtime est exécuté par Node en production, donc <em>là le paquet appartient aux {0}</em>, et Babel est classé comme dépendance de production avec lui. Il en va de même si vous republiez une bibliothèque qui réexporte ces composants."
installation_14c3hli: "Les deux majeures fonctionnent, et les deux produisent une extraction identique. Babel 8 exige Node {0}, ce qui est plus strict que tout ce que ce plugin demande. Notez que npm ne fait qu'avertir à propos de {1}, donc il installera volontiers Babel 8 sur un Node plus ancien, où il ne peut pas du tout être chargé. Si cela se produit, on vous le dit, et on vous dit de changer de Node ou de rester sur Babel 7 — pas de réinstaller ce que vous avez déjà."
installation_1742npj: "Le plugin analyse vos sources avec lui pour trouver les marqueurs. Sans lui, rien n'est extrait, les marqueurs atteignent le navigateur sous leur forme source, et l'app s'affiche non traduite dans chaque chaîne tout en ayant l'air de fonctionner. Donc <em>son absence arrête le serveur de dev et fait échouer le build</em>, plutôt que de produire un avertissement que personne ne lit."
