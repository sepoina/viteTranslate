translate_1ua6eyw: "Un nombre et un élément disent ce qu'ils sont. Une <b>chaîne</b> ne le dit pas : non marqué peut signifier <i>marqueur oublié</i>, ou <i>une valeur qui n'en aura jamais</i> — un numéro de téléphone, une URI, un nom de champ depuis un panneau d'administration, un message serveur. Seul le site d'appel le sait :"
