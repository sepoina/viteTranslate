languageswitcher_10xq0pu: "Cliquez quatre fois et la page passe de <i>American English → Deutsch (Deutschland)</i>, à <i>Deutsch (Deutschland) → français (France)</i>, puis <i>français (France) → American English</i>, et ainsi de suite."
languageswitcher_12qxvkk: "{0} fonctionne aussi au-dessus du conteneur, si bien qu'un en-tête hors de l'arbre traduit peut lister les langues. Là {1} vaut {2} et le changement n'a aucun effet."
languageswitcher_14io5dg: "Un sélecteur a besoin de trois choses : quelle langue est à l'écran, quelles langues existent, et un moyen d'en demander une autre. Un hook unique vous les fournit toutes. Ce tutoriel suppose un projet avec au moins deux langues, comme celui de <0>Votre première application traduite</0>."
languageswitcher_17xi8xd: "Après avoir choisi l'allemand et rechargé, la page affiche <i>Willkommen zurück, Ada !</i>. {0} reçoit le résultat réel, donc un chargement échoué n'est pas mémorisé."
languageswitcher_1k6znb6: "{0} contient tous les fichiers trouvés dans {1}, la langue source en premier."
languageswitcher_1mtokb4: "Un rechargement revient à la langue de {0}. Pour conserver le choix, enregistrez-le quand un changement réussit, et relisez-le au démarrage :"
languageswitcher_1qo1q7t: "Cliquez sur <i>Deutsch (Deutschland)</i> et la phrase affiche <i>Willkommen zurück, Ada !</i> ; cliquez sur <i>français (France)</i> et elle affiche <i>Bon retour, Ada !</i>. La langue que vous quittez reste à l'écran jusqu'à ce que la nouvelle soit chargée, il n'y a donc pas d'écran vide entre les deux (<0>comment cela fonctionne</0>)."
languageswitcher_1vftbx2: "{0} est lu une seule fois, au montage. Démarrer sur une langue non préchargée fonctionne, mais coûte un aller-retour avant le premier rendu, et le conteneur le signale une fois dans la console. Si la plupart des visiteurs commencent dans la même langue, voir <1>Préchargement</1>."
languageswitcher_1we86rm: "Lister les langues"
languageswitcher_37esvz: "Un chargement échoué revient à la langue eager, et {0} vous indique laquelle est réellement à l'écran. Voir <1>useTranslateLanguage</1> pour le motif de nouvelle tentative et les rappels {2} et {3}."
