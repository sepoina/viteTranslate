faq_hofm0m: "Non. La phrase que vous écrivez est la source : sa clé est générée à partir du texte et du fichier où elle se trouve, il n'y a donc rien à inventer. <em>Quand une phrase se déplace, la synchronisation transporte sa traduction</em>, et changer les délimiteurs ne change jamais une clé. Voir <0>Marqueurs et clés</0>."
faq_lhmelk: "Non. La synchronisation, l'état et la traduction par IA générative s'exécutent toutes depuis le CLI. L'extension est la même bibliothèque vue depuis l'éditeur : chaque chaîne avec son état, et une synchronisation en un clic. Voir <0>Installation</0>."
