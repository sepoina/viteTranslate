panel_csde8k: "‼️"
panel_e15qk4: "Ces pages s'accaparent le panneau : <b>Sélecteur</b>, <b>Résultats</b> et <b>Projet</b> s'effacent (rien à choisir pendant que vous êtes ici) et le fond prend une teinte de l'accent de votre thème. La barre de commandes reste, même look : <b>← Retour</b> à gauche, plus les commandes propres à la page s'il y en a ; à droite, l'icône de la page. Retour remet tout en place (le ← dans le titre de section aussi)."
