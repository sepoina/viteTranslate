translate_1glnpy5: "<b>Nommage :</b> un identifiant devient {0} ; toute autre expression, ou un élément sans contenu, devient un {1} positionnel — les espaces réservés et les balises numérotées partagent un même compteur, dans l'ordre d'apparition."
