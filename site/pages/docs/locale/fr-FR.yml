installation_1kev8u7: "Installation"
installation_1s094ob: "Seulement {0} — et la chaîne de résolution de la clé API pour {1}, en dernier recours — touche jamais cela. Sans cela installé, ou sans un Service Secret pour parler à (Docker, WSL, une session SSH distante), cette étape de la chaîne est ignorée en silence et le reste du plugin fonctionne exactement de la même manière : une variable d'environnement ou une entrée {2} couvre le même besoin sans cela. Installez-le uniquement si vous voulez que la clé vive dans le trousseau du système d'exploitation au lieu de cela."
installation_1ukc6fu: "Installez et enregistrez le plugin"
installation_1yi6vzl: "Vite"
installation_25m9yq: "Il n'atteint jamais votre bundle"
installation_29tt4v: "Une asymétrie à connaître. Avec le rendu côté serveur, le runtime est exécuté par Node en production, donc là le package appartient à {0}, et Babel est classé comme une dépendance de production avec lui. La même chose s'applique si vous republiez une bibliothèque qui réexporte ces composants."
installation_92tbzo: "Installez le paquet, enregistrez le plugin, et sachez quelles dépendances de pair il nécessite."
installation_f16rwi: "Suivant : <0>écrivez votre premier texte traduit</0>."
