price_tzmgvy: "Deux plafonds durs l'arrêtent plus tôt : le nombre attendu de jetons de sortie et le nombre de clés. Des lots plus petits signifient moins d'hallucinations, d'où le plus petit lot qui maintient les coûts bas."
