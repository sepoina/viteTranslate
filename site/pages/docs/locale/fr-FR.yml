panel_10ci3g7: "Survolez une entrée pour les détails : quelles langues manquent, ce que l'extraction a dit."
panel_10l9zpg: "<i>non synchronisé</i> : pas encore dans les fichiers de langue. Lancez la synchronisation (celle-ci est celle du panneau)"
panel_11e8lt1: "<b>Traductions</b> : les fichiers de langue dans {0}, un par ligne : le code de langue et son nom dans cette langue, la source en premier. Cliquez-en un pour l'ouvrir. Une entrée sélectionnée dans <b>Résultats</b> ? Elle s'ouvre directement sur cette clé, curseur sur la traduction : corrigez-la là. Un ♥ à côté du titre l'indique (survolez pour la clé) ; choisissez un fichier ou un dossier, ou masquez Résultats, et il disparaît. L'icône vous dit comment va le fichier : vert pour la source, jaune quand des traductions manquent (le badge dit combien), rouge quand il ne peut pas être lu, neutre quand il est complet. Pas encore de fichiers ? Une ligne explique pourquoi."
panel_12tbiw: "<b>Config Vite</b> : {0}, ouvert directement sur les options {1}."
panel_13ep6m5: "<b>Ping</b> : le modèle répond-il ? Une minuscule requête, en arrière-plan, une fois par projet. Pas de clé, pas de frappe."
