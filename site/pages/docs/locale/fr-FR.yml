diagnostics_rjnl8w: "Parfois il n'y a vraiment rien à récupérer : une fonction, un symbole, un élément React dans le premier emplacement du tuple, un tuple vide. « Toujours afficher quelque chose » ne peut pas s'appliquer — il n'y a rien — et la seule chose utile restante à dire est <b>ce</b> qui était là au lieu du texte. C'est {0}, et contrairement aux trois autres ce n'est pas un préfixe devant un texte : c'est tout le rendu."
