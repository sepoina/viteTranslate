translatecontainer_13pag2d: "{0}, {1}, {2} et {3} sont {4}, {5}, {6} et {7} sous un nom plus court : <b>la même fonction</b>, pas une copie ({8}), donc React DevTools affiche le nom complet. Les deux continuent de fonctionner pour de bon, et le préprocesseur lit les deux (aussi sous un alias {9}). <em>Une clé ne dépend jamais du nom ni des délimiteurs</em> : renommer {10} en {11} conserve toutes les traductions. La seule exception est un texte qui contient le mot {12} lui-même — un site sur cette bibliothèque — qui est un nouveau message. Le reste de l'API ({13}, {14}, {15}, {16}) n'a pas de nom court."
