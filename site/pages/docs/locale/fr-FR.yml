faq_63pu6s: "Le plugin est un plugin Vite, l'application doit donc être construite avec Vite. Si vous faites du rendu côté serveur, <em>définissez explicitement le fuseau horaire</em> (la prop {0} ou l'option du plugin), sinon les dates peuvent différer entre le serveur et le navigateur. Voir <1>Dates et fuseaux horaires</1> et, pour savoir où va le paquet dans {2}, <3>Il n'atteint jamais votre bundle</3>."
