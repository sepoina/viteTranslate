languages_1m6gd4x: "<b>Méthodologie de construction :</b> Cette liste a été compilée en développant un ensemble de base de tags de langue BCP 47 courants par recoupement avec les capacités d'internationalisation natives de Google Chrome (via le moteur V8 et la bibliothèque ICU). Pour maintenir une cohérence structurelle stricte dans l'ensemble de données, une règle de filtrage a été appliquée afin de ne conserver que les formats {0} (xx-XX) standard. Les codes de langue autonomes (par ex. {1}, {2}) et les tags de macro-région (par ex. {3}) ont été volontairement exclus du tableau final, bien qu'ils soient pris en charge nativement par les API {4} du navigateur."
languages_1xyv0cm: "Les tags acceptés par {0} : {1}, une langue réelle dans une région réelle (<2>CLI</2>). 🎮 <3>Ajouter une langue</3> et <4>basculer entre elles</4>, en direct."
languages_2a4xjr: "<b>Sources de données :</b> Les sources autoritaires principales utilisées pour valider et développer cette liste incluent la documentation officielle de l'API Google Chrome Extensions pour les locales prises en charge par {0}, le registre de codes de langue de l'API Google Workspace Admin Directory, et les correspondances du Common Locale Data Repository (CLDR) qui régissent l'implémentation ICU (International Components for Unicode) sous-jacente de Chromium."
