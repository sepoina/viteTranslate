panel_gcfv5n: "🔹"
panel_h8rh4y: "<b>Résultats</b> a besoin de {0} 4.6.4 ou plus récent dans le projet. Pas de bibliothèque du tout, ou une plus ancienne ? <b>Résultats</b> et <b>Projet</b> s'effacent pour une page qui dit ce qui ne va pas et le {1} qui corrige (<b>Sélecteur</b> reste seulement s'il y a un autre projet vers lequel basculer). Elle part toute seule une fois la bibliothèque là, ou frappez <b>Vérifier à nouveau</b>."
panel_hc0sxu: "Celui surligné dans <b>Config</b>, et il vous suit : basculez sur un fichier et son projet prend le surlignage, pendant que <b>Résultats</b> saute sur ce fichier avec ses entrées ouvertes. Même projet ? Rien ne se redessine. En avez-vous choisi un autre dans <b>Config</b> ? Il reste jusqu'à ce que vous changiez d'éditeur, et à travers les redémarrages. Jusqu'à ce qu'il y en ait un, <b>Résultats</b> et <b>Projet</b> vous attendent."
panel_hj95t4: "<b>Filtre</b> : ce que <b>Résultats</b> affiche. <b>Tout</b>, <b>Malformé</b> (‼️, fichiers illisibles aussi), <b>Non synchronisé</b> (🔄) ou <b>Non traduit</b> (🔸 🔹), chacun avec son compte. Seuls ceux qui ont quelque chose dedans apparaissent, et quand tout va bien le filtre s'efface."
