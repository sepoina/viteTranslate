overview_d20bmx: "<b>Conçu pour de vraies interfaces.</b> Pluriels, sélections, nombres et dates <0>ICU</0> ; un chunk chargé à la demande par langue ; le texte source comme solution de repli tant que la traduction n’est pas disponible ; un sous-ensemble sûr de balises HTML."
overview_e2sltb: "Le flux en quatre étapes"
overview_f3j8ca: "Vous écrivez l’interface avec vos propres mots, directement dans le JSX. viteTranslate repère chaque phrase, maintient une table {0} par langue à jour avec votre code et compile les traductions dans votre build Vite. <em>Aucune clé à inventer, aucune étape d’extraction à retenir, aucune dépendance runtime à embarquer.</em>"
overview_izzg4z: "<b>Synchroniser</b> : lancez {0} ou faites un build. Les nouvelles phrases sont ajoutées à {1}, les anciennes en sont retirées, et vous n’avez jamais à modifier ce fichier. <2>La table se remplit toute seule</2>"
