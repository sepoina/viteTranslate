panel_6wydkk: "<b>État des fichiers locaux</b> : ce que disent les fichiers du projet sélectionné."
panel_7xwr8h: "<b>Paramètres</b> : quel modèle, à quel hôte, et si les prix sont définis (sans eux, les coûts et budgets comptent des tokens, pas de l'argent)."
panel_7zqmxk: "écrit comme"
panel_85xbom: "Ça marche dans l'autre sens aussi : mettez le curseur sur une ligne avec une chaîne marquée et <b>Résultats</b> sélectionne cette entrée (avec <i>Filtre</i> sur <i>Tout</i>, <i>Recherche</i> vide, et le fichier sauvegardé). Votre curseur reste en place."
panel_8o2gtb: "✳️"
panel_8q2aqb: "❇️"
panel_98m59d: "Soulignement fin"
panel_bphmgh: "Gardez <b>Projet</b> au moins aussi haut que sa barre de commandes : réduisez-le à rien et la barre part aussi."
panel_civ59p: "Puce avec bordure"
panel_csde8k: "‼️"
panel_e15qk4: "Ces pages s'accaparent le panneau : <b>Sélecteur</b>, <b>Résultats</b> et <b>Projet</b> s'effacent (rien à choisir pendant que vous êtes ici) et le fond prend une teinte de l'accent de votre thème. La barre de commandes reste, même look : <b>← Retour</b> à gauche, plus les commandes propres à la page s'il y en a ; à droite, l'icône de la page. Retour remet tout en place (le ← dans le titre de section aussi)."
panel_g2g9go: "🔸"
panel_gcfv5n: "🔹"
panel_h8rh4y: "<b>Résultats</b> a besoin de {0} 4.6.4 ou plus récent dans le projet. Pas de bibliothèque du tout, ou une plus ancienne ? <b>Résultats</b> et <b>Projet</b> s'effacent pour une page qui dit ce qui ne va pas et le {1} qui corrige (<b>Sélecteur</b> reste seulement s'il y a un autre projet vers lequel basculer). Elle part toute seule une fois la bibliothèque là, ou frappez <b>Vérifier à nouveau</b>."
panel_hc0sxu: "Celui surligné dans <b>Config</b>, et il vous suit : basculez sur un fichier et son projet prend le surlignage, pendant que <b>Résultats</b> saute sur ce fichier avec ses entrées ouvertes. Même projet ? Rien ne se redessine. En avez-vous choisi un autre dans <b>Config</b> ? Il reste jusqu'à ce que vous changiez d'éditeur, et à travers les redémarrages. Jusqu'à ce qu'il y en ait un, <b>Résultats</b> et <b>Projet</b> vous attendent."
panel_hi4i3j: "Un glyphe devant chaque entrée indique comment elle se porte. <em>Les problèmes portent les mêmes glyphes que ceux affichés par votre application</em> : votre {0} (<1>diagnostics</1>), ou les valeurs par défaut."
panel_hj95t4: "<b>Filtre</b> : ce que <b>Résultats</b> affiche. <b>Tout</b>, <b>Malformé</b> (‼️, fichiers illisibles aussi), <b>Non synchronisé</b> (🔄) ou <b>Non traduit</b> (🔸 🔹), chacun avec son compte. Seuls ceux qui ont quelque chose dedans apparaissent, et quand tout va bien le filtre s'efface."
panel_i64xb7: "Pendant qu'il se met à jour, <em>le panneau ne fait jamais passer de vieilles nouvelles pour des fraîches</em> : un projet encore en chargement affiche <i>Chargement…</i>, un fichier que vous venez d'enregistrer affiche ⏳, un fichier avec des modifications non enregistrées affiche ✎, et leurs entrées cessent de sauter (les lignes ont pu bouger) jusqu'à ce que la nouvelle analyse arrive."
panel_nrc4c7: "Style d'extrait"
panel_o6kg5s: "Fond incrusté"
panel_ogeqzl: "{0} (par défaut)"
panel_pw36i1: "<b>vite.config</b> est exécuté de la manière dont {0} l'exécute : dans un processus séparé, jamais via Vite. Aucun hook de plugin ne s'exécute, rien n'est synchronisé, rien n'est écrit. Une configuration qui se bloque est abandonnée après 15 secondes, et tout ce qu'elle affiche se retrouve dans le canal de sortie <b>viteTranslate</b>. En <b>Mode restreint</b>, rien ne s'exécute : vous obtenez uniquement {1}, pas de <b>Résultats</b> ni de <b>Synchroniser</b>. Approuvez l'espace de travail pour voir le reste."
panel_q9qics: "Pages qui prennent le relais : Paramètres, LLM, Aide"
panel_qvinrj: "Ce que vous regardez, et quoi en faire. De haut en bas :"
panel_rivipb: "Quel projet"
panel_rolex: "<i>malformé</i> : l'extraction a signalé l'erreur à cet endroit (délimiteurs {0} imbriqués ou non appariés, une macro rejetée)"
panel_rpv5dy: "🟢"
panel_rtb8e2: "Ci-dessous, les actions {0}, chacune expliquée : traduire, estimer le coût, retraduire, régénérer le contexte, statut, ping, définir / vérifier / effacer la clé API. Cliquez-en une et elle s'exécute dans un terminal, comme Sync. <i>Revérifier</i>, dans la barre, refait les trois lignes ; si l'une a échoué, le <b>?</b> à côté ouvre le guide de configuration. Plus sur les drapeaux : <1>Exécution et débogage</1>."
