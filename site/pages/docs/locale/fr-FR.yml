cli_1vs6gyo: "Combinaisons rejetées, dans le même style que {0} + {1} ci-dessus : {2} avec n'importe quel flag {3} ; n'importe quel {4} avec {5}, {6} ou {7} ; {8} avec {9} ; {10} sans tags ; {11}/{12} avec un flag translate/retranslate/context/dry-run/auto/noask ; {13}, {14}, {15} ou {16} sans une commande qu'ils modifient ; plus d'un {17}, ou un combiné avec autre chose. Un flag {18} non reconnu est aussi une erreur — le préfixe est l'espace de noms, une faute de frappe à l'intérieur ne retombe pas sur une sync silencieuse. Tous sont lus sans tenir compte de la casse, comme {19} et {20}."
