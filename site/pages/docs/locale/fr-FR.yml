cli_1a1xo6z: "Ignore la synchronisation complète si rien de pertinent n'a changé depuis la dernière : il compare les horodatages des fichiers source avec un petit enregistrement laissé par la dernière exécution et, si rien n'a bougé, affiche une ligne et quitte — <b>sans charger {0} et sans rien écrire</b>, pas même cet enregistrement. Le moment où il trouve quelque chose qui mérite un second regard (un fichier modifié, {1} lui-même, les tables dans {2}), il revient à la synchronisation complète exactement la même que l'exécution de la commande sans options, plus une ligne expliquant pourquoi :"
cli_1ad7mv5: "CLI"
cli_1b2fqp4: "Le code de sortie est {0} uniquement en cas d'erreur, il fonctionne donc comme un contrôle CI. Une table incomplète n'est pas une erreur — c'est l'état normal d'un projet en cours de traduction."
cli_1cmxse9: "Traduction automatique par LLM"
cli_1ff0suz: "Corrigez le(s) fichier(s) mentionné(s) dans le message, puis relancez. Un fichier utilisant une syntaxe que l'analyseur n'active pas — par exemple des décorateurs — est ignoré de la même manière, et bloque le CLI et {0} tant qu'il n'analyse pas."
cli_1ft7932: "La même note apparaît sur la ligne source d'un message qui ne s'analyse pas ({0}), et comme {1} lorsqu'une traduction est valide mais ne couvre pas toutes les catégories requises par les règles de pluriel de cette langue."
cli_1ho6dk7: "Les langues qui n'ont plus rien à faire partagent une ligne — c'est la même nouvelle pour toutes — tandis que chaque langue qui a encore du travail à faire a la sienne, car le travail est différent pour chacune. Seul le nombre de manquants est coloré : dans un bloc sinon uniforme, « il y a encore du travail ici » est la seule chose à trouver sans lire."
cli_1ieyl21: "Un fichier marqué n'a pas pu être lu ou analysé, donc certaines clés manquent lors du scan et la synchronisation les effacerait de chaque langue."
cli_1ipkplr: "C'est l'option que le plugin utilise lui-même en interne au démarrage du serveur de développement (voir {0} dans <1>options du plugin</1>), donc la plupart des projets n'ont jamais besoin de la taper manuellement. Elle a tout de même une utilisation propre : un travail CI qui veut vérifier la fraîcheur sans payer le scan complet, ou un projet qui a désactivé {2} et veut un contrôle peu coûteux dans un script {3}. Ce n'est <i>pas</i> pour {4}/{5} : avant une build de production, payer le scan complet pour la certitude de tables reconstituées fraîchement est le bon compromis."
cli_1kdmc70: "Une copie {0} n'a pas pu être écrite, donc la synchronisation refuse d'écraser le fichier qu'elle protégeait."
cli_1lxkq5d: "Voyez la raison dans le message, corrigez-la, relancez."
cli_1pkav2a: "🎮 <0>Visite guidée en direct</0> — la synchronisation et {1}, puis <2>{3}</2> et <4>{5}</4>, chacun avec les fichiers qu'il écrit."
cli_1r3wlso: "{0} et {1} réécrivent les délimiteurs dans votre source après les avoir modifiés dans {2} : voir <3>Réécriture des marqueurs</3>."
