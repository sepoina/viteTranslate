cli_1tx7n9o: "Message"
cli_1unqjtm: "Douze options, chacune commençant par {0}, conservées sur leurs propres pages car les mélanger avec les options de synchronisation ci-dessus rendrait les deux difficiles à lire : la référence complète, y compris l'option de plugin {1} dont elles dépendent, commence à <2>Configuration LLM</2>, et le tableau des options est dans <3>Exécution et débogage</3>."
cli_1vs6gyo: "Combinaisons rejetées, même style que {0} + {1} ci-dessus : {2} avec n'importe quelle option {3} ; n'importe quelle option {4} avec {5}, {6} ou {7} ; {8} avec {9} ; {10} sans balises ; {11}/{12} avec une option translate/retranslate/context/dry-run/auto/noask ; {13}, {14}, {15} ou {16} sans une commande qu'ils modifient ; plus d'une {17}, ou une combinée avec autre chose. Une option {18} non reconnue est aussi une erreur — le préfixe est l'espace de noms, une faute de frappe à l'intérieur ne revient pas à une synchronisation silencieuse. Tout cela est lu insensible à la casse, comme {19} et {20}."
cli_1wnylk0: "Lit la configuration {0} depuis {1} dans le répertoire de travail, scanne {2} pour les chaînes marquées ({3} par défaut, ou vos <4>délimiteurs</4>) et {5} appels (ou {6} modèles étiquetés), et synchronise chaque fichier de langue dans {7} : ajoute de nouvelles clés, supprime les obsolètes — en reportant la traduction lorsqu'une clé a simplement été renommée, et lorsque le renommage a aussi changé la façon dont les espaces réservés sont écrits ({8} vers {9}, convertissant un marqueur en préprocesseur) : les {10}s ou {11}s de la traduction ancienne sont réécrits dans les nouveaux, dans l'ordre, et conservés uniquement si le compte correspond — sinon la nouvelle clé reste {12} plutôt que de risquer d'afficher l'argument incorrect — et signale ce qui reste à traduire. Le plugin exécute cela pour vous, au démarrage du serveur de développement et avant chaque build (voir <13>options du plugin</13>) ; cette commande est celle à utiliser si vous voulez le faire exprès — {14}, {15}, {16}, ou un contrôle dans CI."
cli_1x7kpj4: "Sous {0}, un scan incomplet n'est qu'un avertissement : les tables restent telles quelles et le serveur démarre ; le prochain démarrage synchronise à nouveau. {1} échoue, comme le CLI."
cli_4t7pnh: "La synchronisation préfère s'arrêter que deviner. Tout cela se termine par un message clair et un code de sortie {0}, et <b>aucun ne laisse une table à moitié écrite</b> :"
cli_4upscn: "L'exécution de la commande simple (sans options) ne regarde jamais cet enregistrement — il re-scanne et le réécrit toujours — c'est donc aussi le moyen de sortir de tout doute sur le fait que le chemin rapide pourrait cacher quelque chose."
cli_4v1pz6: "<b>Installé une fois globalement</b> ({0}), c'est juste {1} — pas de {2}, même commande — dans chaque projet à partir de là : voir le <3>lanceur</3> pour savoir comment il trouve la bonne copie. Chaque exemple ci-dessous fonctionne dans les deux cas ; supprimez {4} si vous êtes en global."
cli_4xaa1c: "Un projet tout neuf n'en a pas besoin pour la langue source : le premier {0} crée cette table lui-même. Avec la synchronisation automatique désactivée ({1}, ou {2} défini), personne ne la crée, donc sans un fichier {3} lisible dans {4}, le serveur de développement affiche ce qui manque et s'arrête, au lieu de démarrer quand même et d'échouer au premier chargement de page. {5} est exactement la commande vers laquelle il vous dirige."
cli_8qu7ts: "Lorsque la synchronisation s'arrête"
cli_9e2a2o: "Un <0>message ICU</0> cassé, ou dont les arguments ne correspondent pas à la source, ajoute une note d'avertissement à la ligne — jamais une erreur, donc elle ne déclenche jamais le contrôle CI de son propre chef :"
cli_el6tkh: "Sortie brute, sans colonne d'étiquette, sans règles — mêmes couleurs, simplement des lignes plus courtes. Utile dans un journal CI ou un terminal étroit. Même chose que l'option {0} du plugin (<1>options du plugin</1>) ; quand les deux sont définis, cette option l'emporte."
cli_g18r9n: "La cellule {0} est colorée selon ce dont la langue a besoin : verte quand il n'y a rien à faire, orange quand il y en a (traductions manquantes, désynchronisées), rouge quand le fichier ne peut pas être lu."
cli_jmw1m3: "{0} ({1})"
cli_s4949n: "Avant 4.1, la commande s'appelait {0}. Ce nom est toujours enregistré et fonctionne toujours, donc un script {1} que vous avez déjà écrit ne casse pas — mais {2} (ce que {3} exécute sous le capot) est celui à utiliser, et le seul mentionné dans les messages."
cli_t1j2c3: "La commande de synchronisation et ses options : ajouter des langues, vérifier les tables, réécrire les marqueurs, et que faire lorsque la synchronisation s'arrête."
cli_xjjggl: "Ajoute une ou plusieurs langues, synchronise comme d'habitude — donc les nouveaux fichiers sont déjà remplis avec chaque clé à traduire ({0}) — et se termine avec le rapport {1}, où les langues nouvellement ajoutées apparaissent avec leurs comptes de manquants. Les balises doivent être sous la forme {2} et nommer une langue et une région réelles (<3>liste des langues prises en charge</3>) ; chaque balise est validée avant toute écriture, et une langue déjà présente reste inchangée."
cli_xwhstk: "Lorsqu'une table échoue après que d'autres ont déjà été remplacées, le message indique lesquelles (« mise à jour partielle »). Il n'y a pas de retour en arrière — il pourrait écraser quelque chose de plus récent — donc relancez simplement la synchronisation : il reprend là où il s'est arrêté."
