faq_8o78lh: "Les chaînes {0} toujours pour la langue en cours de remplissage, chacune avec le nom du composant dont elle provient, et un court résumé du projet que vous pouvez lire et modifier. <em>Ni vos fichiers sources, ni votre clé API.</em> Voir <1>Le résumé du contexte</1>."
