overview_fvljmk: "Le runtime navigateur pèse 5 ko gzip, React lui-même non compris. Les helpers ICU font partie de ce chiffre mais ne sont livrés que lorsqu'une table utilise ICU. Rien d'autre n'entre dans votre bundle : Babel et Vite s'exécutent sur votre machine au moment de {0} et {1} (<2>pourquoi</2>)."
