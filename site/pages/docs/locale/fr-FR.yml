diagnostics_1g4ytdj: "Beaucoup de texte n'est pas traduisible et ne le sera jamais : un numéro de téléphone, un nom de champ configuré dans un panneau d'administration, un message d'exception, une description venant du serveur. Le marqueur est donc le discriminant et le composant l'applique : <em>le texte marqué est traduit, le texte non marqué est rendu tel quel</em>. Un composant feuille peut accepter ce que lui donne son appelant, sans qu'un wrapper décide à l'avance :"
