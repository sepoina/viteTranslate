usetranslatenode_pkhgur: "🎮 Ce que {0} en fait : <1>en direct</1> · 🧪 <2>dix cas limites</2>."
usetranslatenode_r4kvo0: "La forme hook de {0} : même recherche, sans élément. C'est ce que l'option {1} injecte (<2>options du plugin</2>), donc la plupart des projets ne l'écrivent jamais à la main."
usetranslatenode_xn3vn3: "Étant donné quoi que ce soit qui n'est pas un marqueur compilé, il n'a pas de clé à rechercher et renvoie le texte lui-même, délimiteurs supprimés — le même fallback que {0} et {1} utilisent pour ce que le compilateur n'a jamais vu."
usetranslatetostring_14ib4aa: "Pour les endroits nécessitant une chaîne simple au lieu de JSX — {0}, {1}, {2} :"
usetranslatetostring_18lclyq: "La forme template-tag — {0} appelé sur un template literal, comme ci-dessus — ne fonctionne que lorsque {1} provient de {2} (ou {3}) <b>dans le même fichier</b> : le préprocesseur cherche l'appel, pas le nom. Passé en prop, ou encapsulé dans un autre hook, il atteint le runtime non compilé et est traité comme un template simple non marqué."
usetranslatetostring_1g72l3g: "useTranslateToString"
usetranslatetostring_47vgdt: "{0} accepte aussi les mêmes formes d'appel que les <2>autres formes</2> de {1}, avec les mêmes <3>préfixes de diagnostic</3> et la même <4>règle {5}</4> pour un {6} manquant :"
usetranslatetostring_bsrje4: "Chaînes simples traduites pour placeholder, aria-label, title et tout ce qui n'est pas JSX."
usetranslatetostring_k80zyw: "🎮 En direct : <0>placeholders et attributs</0>."
usetranslatetostring_vt05bq: "Il doit retourner une chaîne primitive, donc un <b>élément React</b> est la seule forme qu'il n'accepte pas : une erreur réelle, avec son propre message. D'autres valeurs non textuelles (fonction, symbole, élément dans le tuple) retournent {0} avec un avertissement dans la console en développement, comme dans {1}."
