languageswitcher_10xq0pu: "Cliquez quatre fois et la page passe de <i>American English → Deutsch (Deutschland)</i>, à <i>Deutsch (Deutschland) → français (France)</i>, puis <i>français (France) → American English</i>, et ainsi de suite."
languageswitcher_12qxvkk: "{0} fonctionne aussi au-dessus du conteneur, si bien qu'un en-tête hors de l'arbre traduit peut lister les langues. Là {1} vaut {2} et le changement n'a aucun effet."
languageswitcher_14io5dg: "Un sélecteur a besoin de trois choses : quelle langue est à l'écran, quelles langues existent, et un moyen d'en demander une autre. Un hook unique vous les fournit toutes. Ce tutoriel suppose un projet avec au moins deux langues, comme celui de <0>Votre première application traduite</0>."
languageswitcher_1h9hzgt: "🎮 <0>Un sélecteur, en direct</0> — la liste, le changement, et les callbacks {1}/{2} qui montrent le chargement."
languageswitcher_1k6znb6: "{0} contient tous les fichiers trouvés dans {1}, la langue source en premier."
languageswitcher_1mtokb4: "Un rechargement revient à la langue de {0}. Pour conserver le choix, enregistrez-le quand un changement réussit, et relisez-le au démarrage :"
languageswitcher_1vftbx2: "{0} est lu une seule fois, au montage. Démarrer sur une langue non préchargée fonctionne, mais coûte un aller-retour avant le premier rendu, et le conteneur le signale une fois dans la console. Si la plupart des visiteurs commencent dans la même langue, voir <1>Préchargement</1>."
languageswitcher_1we86rm: "Lister les langues"
languageswitcher_37esvz: "Un chargement échoué revient à la langue eager, et {0} vous indique laquelle est réellement à l'écran. Voir <1>useTranslateLanguage</1> pour le motif de nouvelle tentative et les rappels {2} et {3}."
languageswitcher_7wiulw: "Un sélecteur de langue"
languageswitcher_ad9kym: "{0} est le tag à l'écran, donc le bouton de la langue actuelle est désactivé."
languageswitcher_axfsca: "{0} est la langue écrite dans sa propre langue, région incluse : avec {1}, {2} et {3}, les boutons affichent <i>American English</i>, <i>Deutsch (Deutschland)</i> et <i>français (France)</i>."
languageswitcher_g04w2k: "Cliquez sur <i>Deutsch (Deutschland)</i> et la phrase affiche <i>Willkommen zurück, Ada!</i> ; cliquez sur <i>français (France)</i> et elle affiche <i>Bon retour, Ada !</i>. <em>La langue que vous quittez reste à l'écran jusqu'à ce que la nouvelle soit chargée</em>, donc il n'y a pas d'image vide entre les deux (<0>comment ça marche</0>)."
languageswitcher_jg6lrz: "Un seul bouton qui tourne"
languageswitcher_kqhdu5: "Se souvenir du choix"
languageswitcher_mvp6xf: "Lister les langues, basculer en un clic, mémoriser le choix, ou les parcourir toutes avec un seul bouton."
languageswitcher_qqy6sw: "Placez-le n'importe où sous {0} :"
languageswitcher_rxmdj8: "Après avoir choisi l'allemand et rechargé, la page affiche <i>Willkommen zurück, Ada!</i>. <em>{0} reçoit le résultat réel, donc un échec de chargement n'est pas mémorisé.</em>"
languageswitcher_s3uwla: "Pour une démo, ou une page avec trois langues et pas de place pour un menu : un seul bouton qui nomme la langue actuelle et la suivante. C'est ce que fait <0>{1}</0>."
languageswitcher_y03617: "Bon à savoir"
languageswitcher_yaa389: "<em>Le tableau {0} est gelé et partagé par toute l'app.</em> Pour le trier ou le filtrer, copiez-le d'abord : {1}."
limitations_11yq3wi: "<b>Un repli intégré au dev peut afficher une entité non décodée sous SSR, jusqu'à la première synchronisation.</b> {0} décode les entités à l'aide du DOM ; sans lui (rendu côté serveur), il renvoie le texte de repli tel quel. Disparaît dès que la clé est synchronisée dans le tableau de langue — le tableau compilé ne porte jamais cela."
limitations_13zltxi: "Marqueurs et extraction"
limitations_1414qcb: "<b>{0} conserve l'avertissement propre à React même une fois que {1} le traduit.</b> React rejette les enfants sur {2} quelle que soit leur nature ; le texte traduit s'affiche bien, mais le correctif de l'avertissement est {3}, pas {4}."
limitations_160mu0r: "Messages et ICU"
limitations_169odn7: "Le préprocesseur"
limitations_1aggsm6: "<b>Une entité et le caractère qu'elle représente sont deux textes différents pour l'extracteur, partout.</b> {0} et {1} reçoivent deux identifiants différents, tout comme {2} et {3} en ont toujours — écrire l'entité est un choix, pas une faute de frappe à normaliser. 🧪 <4>Entités, en direct</4>."
limitations_1bu5rtx: "Runtime et outils"
limitations_1byqpbk: "<b>Un littéral de gabarit marqué a besoin d'une cible qui le reçoit.</b> Celui qui contient {0} ne se compile que là où le {1} qu'il produit a du sens : {2}, {3} / {4}, ou — avec {5} — un attribut ou un enfant d'hôte à l'intérieur d'un composant reconnu. Ailleurs, c'est un avertissement {6} à la build, et le gabarit est laissé tel quel."
limitations_1cj1hxr: "<b>Un fichier marqué que le parseur ne peut pas lire bloque la synchronisation.</b> La CLI et {0} s'arrêtent avec {1} <em>plutôt que d'effacer ses clés de vos tables</em> ; {2} avertit seulement et démarre. Le parseur n'active que {3} et {4}, donc un fichier utilisant des décorateurs, par exemple, est toujours dans ce cas jusqu'à ce qu'il soit modifié. Voir <5>Quand la synchronisation s'arrête</5>."
limitations_1djl4vm: "<b>L'auto-traduction LLM ne s'exécute que depuis la CLI, jamais depuis {0}.</b> <em>L'intégrer au plugin signifierait un appel réseau — et une facture — à chaque démarrage du serveur de dev.</em> Lancez {1} dans un second terminal à la place ; le watcher du serveur de dev détecte le {2} réécrit et recharge."
limitations_1fd3lnf: "<b>{0} ne peut pas être réordonné.</b> {1} le substitue dans l'ordre avec {2} ; une langue qui a besoin d'un ordre différent ne peut pas l'exprimer avec {3} — <em>écrivez {4}/{5} à la place</em>, ce qu'une traduction LLM <b>peut</b> réordonner (voir <6>messages ICU</6>). Laissé en {7}, le prompt demande au modèle de conserver l'ordre source et de formuler autour, et le validateur ne vérifie que le <i>nombre</i>. 🧪 <8>{9} dans n'importe quel ordre, en direct</8>."
limitations_1hc1e59: "<b>{0} a besoin du DOM</b> s'il est appelé directement. {1} pas."
limitations_1nagd96: "<b>Une balise de balisage ne peut pas s'ouvrir hors d'une branche plural/select et se fermer à l'intérieur, ni l'inverse.</b> Chaque branche se compile comme son propre petit arbre ; une balise doit y être entière — la même limite s'applique à une balise numérotée (un emplacement)."
limitations_1o6rsgh: "<b>Pas d'échappement par apostrophe comme en ICU.</b> Une apostrophe est toujours du texte (voir <0>ICU messages</0>) : les messages importés depuis un catalogue ICU standard qui utilisent {1} ou {2} doivent être convertis : {3} pour une accolade littérale, un seul {4} pour une apostrophe. 🧪 <5>En direct</5>."
limitations_1tvr0mt: "<b>{0} ne réécrit qu'un attribut — ou un texte JSX — à l'intérieur d'un composant qu'il peut reconnaître comme tel.</b> Le contrôle se fait fichier par fichier et volontairement de façon conservative (voir <1>les notes sur l'architecture</1>) : une fonction exportée comme composant, ou qui appelle déjà un hook, qualifie ; une fonction simplement <i>invoquée</i> ailleurs dans le même fichier comme fonction ordinaire ne qualifie jamais, car y injecter un hook constituerait un appel de hook invalide. Non reconnu, le texte ou l'attribut marqué reste exactement tel qu'écrit, avec un avertissement {2} nommant le fichier — {3} fonctionne quand même. 🧪 Ceci et la limite autoWrap suivante, en direct : <4>edge/#autowrap</4>."
limitations_1vg36e: "<b>{0} ne peut pas apparaître dans le texte du message.</b> À l'intérieur de {1} ou d'un template marqué, écrivez la valeur sous la forme {2} — un {3} littéral à cet endroit est une erreur de build ({4}), <em>pas un passage silencieux</em>."
limitations_86x8k8: "<b>{0} n'est pas reconnu.</b> Le préprocesseur cherche un identifiant simple importé depuis {1} ({2}, ou {3}) ; un import avec espace de noms ({4}, puis {5}) est une forme AST différente qu'il ne correspond pas — idem pour {6} réexporté depuis un fichier à vous."
limitations_96t8ip: "<b>La CLI charge votre config Vite avec Node lui-même</b>, pas Vite — une config TypeScript nécessite un Node qui supprime les types (23.6+)."
limitations_anogcb: "Ce que viteTranslate ne fait pas, regroupé par endroit où vous le rencontrerez."
limitations_bbok07: "🧪 La plupart tournent en direct, une ligne par cas, sur la <0>page des cas limites</0> : voir la limite est plus rapide que la lire."
limitations_c6d6op: "Limitations connues"
limitations_cktal4: "<b>Un emplacement se numérote à partir de {0}, pas {1}, une fois que le message a un argument nommé.</b> Les positions et les emplacements partagent un même compteur (voir <2>Translate</2>) ; {3} compile le lien comme {4}, pas {5}."
limitations_kcmpi3: "<b>Les ids sont un hachage 32 bits</b> sur le chemin du fichier et le texte. Une collision entre deux chaînes est improbable mais possible, et signalée comme avertissement de build nommant les deux."
limitations_n2r7v: "<b>Les délimiteurs ne peuvent pas contenir d'espaces, de caractères de contrôle, {0} {1} {2} {3} {4} {5} un accent grave, une barre oblique inverse, {6} ou {7}, et un caractère unique courant lève de nombreux avertissements.</b> <8>{9}/{10}</8> sont vérifiés au démarrage du plugin. Un délimiteur facile à trouver dans du texte ordinaire (un {11} isolé, par exemple) transforme chaque chaîne qui le contient, sans être enveloppée par lui, en un avertissement {12} : choisissez deux caractères ou plus, ou un symbole qui n'apparaît jamais dans du vrai texte ({13})."
limitations_nci5d5: "<b>Les marqueurs doivent être des chaînes entières.</b> Un marqueur intégré dans une chaîne plus longue, ou un littéral de modèle avec {0} à l'intérieur, n'est pas extrait — utilisez plutôt un placeholder {1}. 🧪 <2>En direct</2>."
limitations_o1ugcp: "<b>Les enfants en spread ne sont pas pris en charge.</b> {0} reçoit un avertissement {1} et reste intact ; écrivez les valeurs explicitement, ou construisez la phrase avec {2}."
limitations_p90zrt: "<b>Les pluriels ne peuvent pas être écrits en JSX.</b> Une valeur simple peut l'être — {0} — mais {1} est de la syntaxe ICU, pas une expression JSX : écrivez {2} ou {3} à la place."
limitations_qqyckm: "autoWrap"
limitations_y2my8s: "<b>La sécurité des fichiers est au mieux une effort, pas un verrou.</b> Les tableaux sont remplacés atomiquement un par un, après une vérification que personne ne les a modifiés — mais une courte fenêtre de course subsiste entre la vérification et le renommage, il n'y a pas de verrou entre processus, plusieurs tableaux ne forment pas une transaction (un échec à mi-parcours est signalé, puis corrigé en relançant), et un renommage ne conserve pas le propriétaire d'un fichier appartenant à un autre utilisateur."
limitations_z0qqlr: "<b>Un modèle littéral étiqueté {0} n'est reconnu que lorsque {1} provient de {2} (ou {3}) dans le même fichier.</b> Passé en prop, déstructuré depuis un hook enveloppant, ou importé depuis un autre module, le modèle littéral étiqueté atteint le runtime non compilé et est traité comme un modèle ordinaire, non marqué — avec un avertissement console en développement."
