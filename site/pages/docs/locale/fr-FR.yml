translatecontainer_ez7ayu: "{0}, {1}, {2} et {3} sont {4}, {5}, {6} et {7} sous un nom plus court : <b>la même fonction</b>, pas une copie ({8}), donc React DevTools affiche le nom complet. Les deux continuent de fonctionner, et le préprocesseur lit les deux (aussi sous un alias {9}). Une clé ne dépend jamais du nom ou des délimiteurs : renommer {10} en {11} conserve chaque traduction. L'unique exception est un texte contenant le mot {12} lui-même — un site sur cette bibliothèque — qui devient un nouveau message. Le reste de l'API ({13}, {14}, {15}, {16}) n'a pas de nom court."
