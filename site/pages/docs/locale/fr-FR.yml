customendpoint_1b9pkt5: "Le client intégré lit Chat Completions tel qu'OpenAI l'envoie (<0>points de terminaison testés</0>). Pour tout le reste — une requête différente, une passerelle qui encapsule la réponse, une bibliothèque cliente — écrivez un <b>pilote LLM personnalisé</b> : une fonction dans {1} qui envoie la requête et renvoie la réponse du modèle. <em>Tout ce qui l'entoure reste à la bibliothèque</em> : lots, prompts, validation, tentatives, plafonds budgétaires, panneau en direct."
