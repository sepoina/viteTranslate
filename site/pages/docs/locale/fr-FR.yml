panel_102bbjq: "Boîte et cadre"
panel_10ci3g7: "Survolez une entrée pour les détails : quelles langues manquent, ce que l'extraction a dit."
panel_10l9zpg: "<i>non synchronisé</i> : pas encore dans les fichiers de langue. Lancez la synchronisation (celle-ci est celle du panneau)"
panel_11e8lt1: "<b>Traductions</b> : les fichiers de langue dans {0}, un par ligne : le code de langue et son nom dans cette langue, la source en premier. Cliquez-en un pour l'ouvrir. Une entrée sélectionnée dans <b>Résultats</b> ? Elle s'ouvre directement sur cette clé, curseur sur la traduction : corrigez-la là. Un ♥ à côté du titre l'indique (survolez pour la clé) ; choisissez un fichier ou un dossier, ou masquez Résultats, et il disparaît. L'icône vous dit comment va le fichier : vert pour la source, jaune quand des traductions manquent (le badge dit combien), rouge quand il ne peut pas être lu, neutre quand il est complet. Pas encore de fichiers ? Une ligne explique pourquoi."
panel_11z1xyd: "<b>Clé API</b> : <i>où</i> elle est (une variable d'environnement, {0}, {1}, le trousseau système), jamais ce qu'elle est. Introuvable ? Il dit où il a cherché."
panel_12tbiw: "<b>Config Vite</b> : {0}, ouvert directement sur les options {1}."
panel_13ep6m5: "<b>Ping</b> : le modèle répond-il ? Une minuscule requête, en arrière-plan, une fois par projet. Pas de clé, pas de frappe."
panel_14pkfag: "✅"
panel_14yx631: "Pas de bloc {0} dans les options du plugin ? Le bouton affiche <b>LLM ?</b> et ouvre <b>Aide</b> à la place : comment en ajouter un, et un bouton qui ouvre les options dans {1}."
panel_1506gkm: "Projet"
panel_15a7396: "Accent du mot-clé"
panel_164zfge: "Bibliothèque manquante ou trop ancienne"
panel_179kdki: "Cliquez sur <b>LLM ›</b> dans <b>Projet</b>. En haut, trois lignes qui répondent à \"puis-je y aller ?\" :"
panel_17s3fuk: "<b>La barre de commandes</b> : <b>Sync</b> lance le {0} du projet dans un terminal, et <b>LLM</b> échange <b>Résultats</b> contre la <1>page LLM</1>. À droite : GitHub, ⚙ <2>Paramètres</2>, ↻ actualiser."
panel_182hcr8: "Cliquez sur ⚙ dans <b>Projet</b>. En haut, le logo. Ensuite, sous <b>CONFIG</b>, une ligne par réglage :"
panel_18pyui: "{0}, ou une phrase marquée avec balises et valeurs ({1})"
panel_19he3o6: "Ressemble à"
panel_19kz63g: "Comme la sélection"
panel_1akrn1: "Résultats"
panel_1atvrdq: "Style"
panel_1ay9h4c: "Effet du marqueur"
panel_1b25j40: "Pendant qu'il rattrape son retard, le panneau ne fait jamais passer de vieilles nouvelles pour fraîches : un projet encore en chargement dit <i>Chargement…</i>, un fichier que vous venez de sauvegarder affiche ⏳, un fichier avec des modifications non sauvegardées affiche ✎, et leurs entrées cessent de sauter (les lignes ont pu bouger) jusqu'à l'arrivée du nouveau scan."
panel_1b4dxvq: "Le panneau VS Code pièce par pièce : chaque section, glyphe et bouton, les styles de surbrillance, et ce qui se passe sous le capot."
panel_1bscuvw: "<i>pas entièrement traduit</i> : encore {0} quelque part"
panel_1cqjubr: "Comme les indices en ligne"
panel_1dg9ni2: "Le panneau"
panel_1djiaxf: "Barre d'accent à gauche"
panel_1ecy5fr: "Quinze styles, tous dans les couleurs de votre thème. Choisissez-en un dans <0>Paramètres</0>, chacun avec un exemple. Ou lancez <b>viteTranslate : Choisir le style de surbrillance…</b>, qui essaie chacun sur votre code pendant que vous parcourez la liste : {1} le garde, {2} ne change rien. Ou définissez {3}, {4} inclus."
panel_1eywx9z: "<b>Résultats</b> interroge <i>votre</i> {0} installé (et son {1}), dans un processus séparé : les mêmes entrées que {2} trouverait, pas de Babel embarqué dans l'extension. C'est rapide car chaque synchronisation laisse un index des entrées dans {3}, et le panneau ne re-parse que ce qui a changé depuis. Après une sauvegarde Babel reste chaud deux minutes, puis le processus disparaît."
panel_1fja3d5: "Cliquez sur l'icône % dans la barre d'activité. Au démarrage, une seule page <b>Chargement</b> affiche le logo et ce qu'il lit ; <b>Sélecteur</b>, <b>Résultats</b> et <b>Projet</b> prennent le relais une fois qu'ils ont quelque chose de vrai à dire. Ouvrez et fermez-les comme n'importe quelle section de la barre latérale."
panel_1fq1ev1: "<b>Style de surbrillance</b> : chaque style avec un exemple ; cliquez-en un, les éditeurs basculent instantanément."
panel_1g78vuz: "Étiquette remplie"
panel_1gtyi8x: "<b>Quel runtime ils utilisent</b> : celui de l'éditeur. Sauf sur Windows, où ce runtime devient muet dans un terminal : là, ils utilisent le {0} dans votre PATH, celui sur lequel Vite tourne. Pas de Node dans PATH ? Ils tournent quand même et vous voyez la sortie, mais ils ne peuvent rien vous demander (la confirmation de <i>Traduire</i>, la clé API), et le terminal attend une touche comme d'habitude. Un avertissement le dit, une fois."
panel_1gy72ul: "signifie"
panel_1it82lz: "Le projet sélectionné, et quoi en faire. Les langues défilent ; la barre de commandes reste fixée en bas."
panel_1ji84ms: "Sous le capot"
panel_1jm3a9h: "Puce sur le contenu"
panel_1lmrijn: "Lien pointillé"
panel_1lpabch: "Italique seulement"
panel_1mfsq4h: "<b>Recherche</b> : restreint <b>Résultats</b> aux entrées dont le texte ou le chemin de fichier contient ce que vous tapez. Pas de casse, pas d'accents : {0} trouve <i>Città</i>. Elle apparaît dès qu'il y a quelque chose à chercher, et reste pendant que vous tapez, même quand rien ne correspond. {1}, ou le × à sa droite, l'efface."
panel_1muexbu: "<i>non traduit</i> : {0} dans chaque langue cible"
panel_1n0xe4: "🔄"
panel_1n9o8iz: "un {0} template tagué, ou un template marqué avec {1}"
panel_1nev4ow: "Paramètres"
panel_1pdqmt1: "Chaînes surlignées dans l'éditeur"
panel_1posgx: "<b>vitetranslate</b> : les options du plugin telles que résolues : langue source, dossier des locales, langues préchargées, auto-sync, {0}, {1} (vos délimiteurs, {2} par défaut), fuseau horaire ICU, le bloc {3} (modèle, endpoint, budget, le <i>nom</i> de la variable de clé, jamais la clé). Non défini : {4}."
panel_1q75ovc: "Un glyphe devant chaque entrée dit comment elle va. Les ennuis portent les mêmes glyphes que votre appli affiche à l'écran : vos {0} (<1>diagnostics</1>), ou les défauts."
panel_1qixau6: "<b>Config</b> : chaque projet Vite dans l'espace de travail, une ligne chacun : son nom {0} et son dossier. Cliquez-en un et c'est <i>le</i> projet, pour <b>Résultats</b> et <b>Projet</b>. Un seul projet ? Rien à choisir, donc pas de liste."
panel_1qlrv1z: "<b>vite.config</b> : plugins dans l'ordre de chargement, port et hôte du serveur. Cliquez pour ouvrir."
panel_1ukdv8o: "Les chaînes marquées se distinguent au fur et à mesure de la saisie, dans {0}, {1}, {2} et {3} : {4} (ou le <5>{6}/{7}</5> de votre projet, lu à partir de son {8}), {9}, {10} modèles de chaînes annotées (et leurs noms longs). Mêmes règles que pour l'extraction : ce qui s'allume est traduit. Jusqu'à ce que {11} ait été lu — ou dans une bibliothèque antérieure à la version 4.7.0, ou en mode Restreint, où il n'est jamais exécuté — le {12} par défaut est utilisé. L'exemple dans Paramètres reste sur {13} : il prévisualise le style, pas votre projet. Les commentaires et les exemples de code dans les chaînes restent simples. Aucun panneau nécessaire."
panel_1uswey1: "Surlignage"
panel_1va1utk: "Chaque chaîne que le projet marque pour traduction, fichier par fichier : les dossiers de {0}, seulement les fichiers qui ont quelque chose de marqué, et sous chaque fichier ses entrées dans l'ordre source. Cliquez sur une entrée et le curseur atterrit dessus. Sauvegardez un fichier (ou un fichier de langue) et la liste suit."
panel_1x87voy: "Puce et règle"
panel_3kqode: "La page LLM"
panel_48xd1p: "L'ouverture d'un fichier JS ou TS réveille l'extension pour le surlignage seulement : {0} est lu, et le projet scanné, quand vous ouvrez le panneau."
panel_4ju318: "<b>Sync</b> et les actions LLM tournent dans un terminal qui nettoie après lui : quand le CLI a fini, appuyez sur {0} dans les 10 secondes pour le garder, n'importe quelle autre touche pour le fermer maintenant, ou regardez ailleurs. Si quelque chose a échoué, il reste jusqu'à ce que vous appuyiez sur une touche : l'erreur est la partie qui vaut la peine d'être lue."
panel_4rwsck: "texte JSX marqué ou attribut"
panel_52ly6o: "LLM"
panel_5bi27o: "Sélecteur"
panel_6wydkk: "<b>État des fichiers locaux</b> : ce que disent les fichiers du projet sélectionné."
