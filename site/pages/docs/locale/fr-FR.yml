overview_1yszoc0: "Chercher quelque chose"
overview_275qvn: "<b>Prêt pour de vraies interfaces.</b> <0>ICU</0> : pluriels, select, nombres et dates ; un chunk paresseux par langue ; le texte source comme repli tant qu'une traduction n'existe pas ; un sous-ensemble sûr de balises HTML."
overview_3bbkzl: "Ce que c'est"
overview_48nlby: "<b>Des outils là où il en faut.</b> Une <0>CLI</0> pour la synchronisation, les vérifications CI et la traduction LLM protégée ; une <1>extension VS Code</1> montrant chaque chaîne et son statut."
overview_4mlj3q: "L'installer dans un projet existant"
overview_61l2zr: "<b>Moins de travail manuel.</b> L'extraction et la synchronisation s'exécutent dans Vite, pas comme une commande séparée à retenir."
overview_6deyc0: "<0>Options du plugin</0> · <1>CLI</1> · <2>Types TypeScript</2>"
overview_7wamw2: "<0>Pluriels et dates</0>"
overview_8bfhqh: "Laisser les utilisateurs choisir une langue"
overview_8uz3dt: "<b>Un runtime léger.</b> Le côté navigateur pèse 5 ko gzip, helpers ICU inclus, et n'analyse aucun message : les tables sont compilées à la construction."
overview_9d885r: "Trouver une réponse rapide"
