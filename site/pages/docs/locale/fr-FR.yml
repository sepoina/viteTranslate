running_qnpmx5: "Un lot renvoyé après une troncature est tracé comme {0}, une réparation comme {1}. Le {2} d'une réponse couvre toute la réponse, corps inclus : certains fournisseurs envoient les en-têtes immédiatement et la réponse quand elle est prête."
running_r9dti5: "Contrairement à {0}, une traduction ICU <b>peut</b> réordonner ses arguments ({1} pour une source {2}) — le prompt ne le dit au modèle que pour les langues dont le lot contient réellement une chaîne ICU, ce qui garde les règles supplémentaires hors du décompte de tokens de tous les autres prompts. Les apostrophes n'ont besoin d'aucune règle : elles sont du texte brut pour le compilateur ICU, donc un modèle qui transforme {3} en {4} ou {5} change la ponctuation, jamais les arguments."
