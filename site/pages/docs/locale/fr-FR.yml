install_ibez6k: "<0>viteTranslate</0> est un plugin Vite : vous écrivez des phrases directement dans votre JSX, il les extrait et maintient une table {1} par langue synchronisée. Cette extension est sa vue depuis l'éditeur, et elle ne fonctionne pas sans elle."
install_mz4bmq: "<b>Cliquez sur l'icône %</b> dans la barre d'activité. Le surlignage ne nécessite rien : ouvrez un fichier {0} et c'est activé."
install_n29mk9: "Le panneau viteTranslate à côté de l'éditeur"
install_pzf02v: "Il ne réimplmente rien : <b>Résultats</b> interroge la bibliothèque installée dans <i>votre</i> projet, donc le panneau et {0} ne sont jamais en désaccord."
install_x93zm3: "<b>Conditions requises</b> : VS Code 1.90+, un <0>espace de travail de confiance</0> pour tout au-delà de {1}, et sur Windows un {2} dans votre PATH, afin que l'interface en ligne de commande puisse vous demander des choses (confirmations, la clé API)."
install_ymak0a: "Ce qu'est l'extension VS Code, comment elle se rapporte à la bibliothèque, et comment la faire fonctionner."
installation_12okzxg: "Dépendance de pair"
installation_14c3hli: "L'une des deux versions majeures fonctionne, et les deux produisent une extraction identique. Babel 8 nécessite Node {0}, ce qui est plus strict que ce que demande ce plugin. Notez que npm n'avertit que de {1}, donc il installera joyeusement Babel 8 sur un Node plus ancien, où il ne peut pas être chargé du tout. Si cela arrive, on vous le dit, et on vous dit de passer à Node ou de rester sur Babel 7 — pas de réinstallation de ce que vous avez déjà."
installation_17md6b: "Pourquoi <code>%s</code> est requis"
installation_1bdat4y: "Sous Vitest, aucun des deux contrôles ne se déclenche. Le lanceur de tests exécute les crochets du plugin, et votre suite ne doit pas mourir à cause d'une dépendance que vos tests n'atteignent jamais."
