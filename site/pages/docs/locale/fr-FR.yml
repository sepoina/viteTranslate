migratingfrom3_pdmdyp: "Les fichiers de langue sont désormais des données ({0}) au lieu de modules JS. <b>Rien ne change dans votre code ni dans votre bundle</b> — le même chunk paresseux par langue, la même API — seuls les fichiers sur le disque et leur extension changent."
migratingfrom3_smaizi: "Les originaux sont renommés en {0}, <em>jamais supprimés</em> : vérifiez le résultat, puis supprimez-les. Un fichier que le convertisseur ne peut pas lire seul (un module de langue avec des imports ou des valeurs calculées) est laissé en place et signalé, pour que rien ne soit converti à moitié. Si vous démarrez Vite avec les anciens fichiers encore en place, le plugin s'arrête et affiche exactement ceci au lieu de signaler une langue source manquante."
