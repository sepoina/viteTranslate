markers_1goa7mk: "Les arguments sont les délimiteurs <b>actuellement dans votre source</b> : aucun signifie {0}, un signifie le même aux deux extrémités, deux signifient début et fin. La cible est toujours celle des délimiteurs de {1}. Seul {2} est modifié, à travers l'arbre syntaxique : les commentaires et les imports restent tels quels, et seuls les délimiteurs changent, jamais le texte à l'intérieur."
markers_1kvyv87: "<b>Conseil :</b> au moins deux caractères, ou un symbole Unicode qui n'apparaît jamais dans un vrai texte ({0}, {1}). Toute chaîne qui contient un délimiteur sans être entourée par lui lève un <2>avertissement</2>, donc un caractère courant en lèvera beaucoup."
markers_1l9hdhu: "Un shell peut exiger des guillemets : {0}. Dans {1}, un {2} peut être lu comme une variable. Ne peut pas être combiné avec {3}, {4}, {5}, {6} ni aucun indicateur {7}."
markers_1lzhhjk: "Ce qui se passe"
markers_1mi3zlh: "rien à réécrire (exit 1)"
markers_1of295a: "{0} → {1} : retour au défaut"
markers_1ogjgch: "{0} est le délimiteur par défaut d'un texte marqué. Choisissez le vôtre avec {1} (un délimiteur, les deux extrémités) ou {2} / {3} ; le plus spécifique l'emporte :"
markers_1s5xn9b: "<b>La clé ne change jamais.</b> Elle vient du texte à l'intérieur, pas des délimiteurs (ni du nom du composant) : changer de délimiteurs, ou réécrire {0} en {1}, conserve toutes les traductions. <2>{3}</2> fait la réécriture pour vous, et refuse d'écrire si une seule clé changerait."
markers_1uvu5oq: "La décision vient uniquement de la configuration et des arguments, avant toute lecture de fichier : la commande ne devine jamais à partir de votre code."
markers_1wpz33o: "{0} exécute toute la vérification sans rien écrire ; elle affiche l'état des traductions avec les délimiteurs actuels et avec les nouveaux. {1} exécute <b>la même vérification sur chaque fichier</b> et n'écrit qu'ensuite : tout ou rien. Si une seule clé devait changer (une macro dont le texte contient le nouveau délimiteur, par exemple), ou si un fichier contenant d'anciens délimiteurs ne peut pas être analysé, rien n'est écrit, les coupables sont listés et la commande sort avec {2}. Si une écriture échoue à mi-parcours (droits, fichier verrouillé par un autre programme), elle s'arrête et liste ce qui a été réécrit ou non ; les clés sont identiques dans les deux cas, donc relancer la même commande termine le travail. Aucune synchronisation ne s'exécute ensuite : les tables et les caches se rattrapent à votre prochaine exécution."
markers_2cvl9i: "<b>Interdits :</b> espaces, caractères de contrôle, {0} {1} {2} {3} {4} {5} un backtick, une barre oblique inverse et {6} (chacun signifie déjà quelque chose en JSX, dans les chaînes ou les messages), {7}, et deux délimiteurs différents dont l'un contient l'autre. Une valeur invalide arrête le plugin au démarrage, en nommant l'option."
markers_36seix: "personnalisé ({0})"
markers_3ot51v: "{0} → {1} : le premier changement"
markers_flavrl: "Vous avez changé vos délimiteurs dans {0} ? Ces deux commandes réécrivent la source des anciens vers les nouveaux :"
markers_frf1zx: "<b>Anciens délimiteurs :</b> avec des délimiteurs personnalisés, un {0} restant dans la source lève l'avertissement {1} et n'extrait rien. Une <2>macro</2> ({3}) n'a besoin d'aucun délimiteur."
markers_k7q455: "{0} → {1} : d'une paire personnalisée à une autre"
