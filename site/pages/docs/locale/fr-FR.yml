languages_13m8b5t: "Une valeur comme {0} provient de l'écriture de JSX dans {1} (<2>Translate</2>) : {3} ici n'a pas d'attributs, c'est donc du texte — déplacez-le là où la phrase en a besoin, comme n'importe quelle autre balise se déplace. Un {4} est différent : c'est un <b>emplacement</b>, qui représente un lien ou un composant fourni par le code source — un {5}, un {6}. Gardez chaque balise numérotée, ouvrante et fermante, avec son numéro, autour des mots qui lui appartiennent ; vous pouvez déplacer une balise avec ses mots, mais <em>ne renumérotez jamais une balise, n'en supprimez jamais une, et ne la transformez jamais en une autre balise</em> — le numéro est la façon dont la table compilée trouve le bon élément, pas un choix stylistique."
languages_1ar9jvo: "La balise doit être sous la forme {0} et nommer une langue et une région réelles (<1>liste prise en charge</1>) — <em>{2} est refusé avant que quoi que ce soit ne soit écrit sur le disque</em>. Une langue déjà présente est laissée intacte."
