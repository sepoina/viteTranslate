installation_v3fxaf: "Cette asymétrie a un prix, et c'est le prix de rendre le peer obligatoire : dans ces deux cas, votre installation de production récupère Babel et toute son arborescence, pour quelque chose qui ne s'y exécute jamais. {0} ne l'abandonnera pas, car ce n'est pas une dépendance de dev dans cette configuration. Si le poids compte plus pour vous que l'installation automatique, déclarez {1} comme facultatif dans votre propre {2} : les vérifications ci-dessus portent sur l'<i>utilisation</i> du plugin, pas sur la manière dont il a été installé, et elles continuent de fonctionner dans les deux cas."
