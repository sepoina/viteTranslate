migratingfrom3_1wtzsev: "Les fichiers d'origine sont renommés en {0}, jamais supprimés : vérifiez le résultat, puis supprimez-les. Un fichier que le convertisseur ne peut pas lire seul (un module de langue avec des imports ou des valeurs calculées) reste à sa place et est signalé, pour qu'aucune conversion ne soit à moitié faite. Si vous démarrez Vite avec les anciens fichiers toujours en place, le plugin s'arrête et affiche exactement cela au lieu de signaler une langue source manquante."
migratingfrom3_9utgzi: "Convertissez les modules de langue 3.x en fichiers de données avec une seule commande, sans toucher à votre code ni à votre bundle."
migratingfrom3_i3y5yr: "La commande elle-même est décrite dans la <0>référence CLI</0>."
migratingfrom3_pdmdyp: "Les fichiers de langue sont désormais des données ({0}) au lieu de modules JS. <b>Rien ne change dans votre code ni dans votre bundle</b> — le même chunk paresseux par langue, la même API — seuls les fichiers sur le disque et leur extension changent."
