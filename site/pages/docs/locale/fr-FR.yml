overview_1hoq7vb: "<b>Synchronisation</b> : à chaque démarrage de {0} et avant chaque build, les nouvelles phrases vont dans {1}, les périmées en sortent. <2>La table s'écrit toute seule</2>"
overview_1lp9e8j: "Un plugin Vite et un petit runtime React, installés en un seul paquet. Le plugin lit votre source, le runtime affiche la bonne phrase pour la langue courante."
