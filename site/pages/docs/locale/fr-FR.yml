overview_z197qr: "Écrivez du texte naturellement en JSX. viteTranslate extrait les chaînes, maintient un tableau {0} par langue synchronisé, et compile les traductions dans votre flux de travail Vite. Pas de clés écrites à la main, pas d'étape d'extraction séparée, pas de dépendances d'exécution supplémentaires."
