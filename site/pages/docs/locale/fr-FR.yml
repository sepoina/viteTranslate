running_cnobtz: "{0} compte les clés encore {1} dans cette langue après cette réponse, {2} signifie qu'il n'en reste aucune ; viennent ensuite les clés rejetées ou manquantes, ou pour une erreur la raison. La dernière ligne est le coût réel du run, additionné à partir du {3} du fournisseur — au coût que le fournisseur indique lorsqu'il le fait (<4>OpenRouter</4>), à vos prix sinon — plus la part de <5>raisonnement</5>, le cas échéant. À partir de la moitié de la sortie ou plus, un avertissement suit avec le lien pour le désactiver. Avec {6}, le dossier de traces est affiché à la fin ; la répartition par langue s'y trouve, dans {7}."
