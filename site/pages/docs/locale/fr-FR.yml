panel_rtb8e2: "Ci-dessous, les actions {0}, chacune expliquée : traduire, estimer le coût, retraduire, régénérer le contexte, statut, ping, définir / vérifier / effacer la clé API. Cliquez-en une et elle s'exécute dans un terminal, comme Sync. <i>Revérifier</i>, dans la barre, refait les trois lignes ; si l'une a échoué, le <b>?</b> à côté ouvre le guide de configuration. Plus sur les drapeaux : <1>Exécution et débogage</1>."
