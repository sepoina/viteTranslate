pluginoptions_1hjpzkx: "Solo {0} disattiva {1} / {2} — qualsiasi altro valore vale come attivo. Impostare {3} (a qualsiasi valore non vuoto) disattiva entrambi senza toccare {4}, che è l'unico modo per raggiungere questo risultato da un checkout in sola lettura. Nessuno dei due viene mai eseguito sotto Vitest o {5}: un'esecuzione di test non dovrebbe riscrivere le tue tabelle, e un'anteprima non ha modifiche al sorgente da recuperare."
