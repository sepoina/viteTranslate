markers_1goa7mk: "Gli argomenti sono i marker <b>ora nel tuo sorgente</b>: nessuno significa {0}, uno significa lo stesso a entrambe le estremità, due significano inizio e fine. Il target sono sempre i marker di {1}. Viene toccato solo {2}, tramite l'albero sintattico: commenti e import restano come sono, e cambiano solo i delimitatori, mai il testo all'interno."
markers_1kvyv87: "<b>Consiglio:</b> almeno due caratteri, oppure un simbolo Unicode che non compare mai nei testi reali ({0}, {1}). Qualsiasi stringa che contenga un delimitatore senza esserne racchiusa genera un <2>avviso</2>, quindi un carattere singolo comune ne genererà molti."
markers_1l9hdhu: "Una shell può richiedere le virgolette: {0}. In {1}, un {2} può essere letto come variabile. Non può essere combinato con {3}, {4}, {5}, {6} o qualsiasi flag {7}."
markers_1lzhhjk: "Cosa succede"
markers_1mi3zlh: "niente da riscrivere (uscita 1)"
markers_1of295a: "{0} → {1}: ritorno al predefinito"
markers_1ogjgch: "{0} è il delimitatore predefinito di una stringa marcata. Scegli il tuo con {1} (un delimitatore, entrambe le estremità) oppure {2} / {3}; quello specifico ha la precedenza:"
markers_1s5xn9b: "<b>La chiave non cambia mai.</b> Deriva dal testo all'interno, non dai delimitatori (né dal nome del componente): cambiare delimitatori, o riscrivere {0} in {1}, conserva ogni traduzione. <2>{3}</2> fa la riscrittura per te, e si rifiuta di scrivere se anche una sola chiave cambierebbe."
markers_1uvu5oq: "La decisione deriva solo dalla configurazione e dagli argomenti, prima che qualsiasi file venga letto: il comando non fa mai supposizioni dal tuo codice."
markers_1wpz33o: "{0} esegue l'intero controllo e non scrive nulla; stampa lo stato delle traduzioni con i marker attuali e con quelli riscritti. {1} esegue <b>lo stesso controllo su ogni file</b> e solo dopo scrive: tutto o niente. Se anche una sola chiave cambierebbe (una macro il cui testo contiene il nuovo delimitatore, per esempio), o un file che contiene i vecchi marker non può essere analizzato, non scrive nulla, elenca i responsabili ed esce con {2}. Se una scrittura fallisce a metà (permessi, un file bloccato da un altro programma) si ferma ed elenca ciò che è stato e ciò che non è stato riscritto; le chiavi sono comunque le stesse, quindi rieseguire lo stesso comando completa il lavoro. Non viene eseguita alcuna sincronizzazione in seguito: tabelle e cache si aggiornano alla prossima."
markers_2cvl9i: "<b>Non consentiti:</b> spazi, caratteri di controllo, {0} {1} {2} {3} {4} {5} un backtick, un backslash e {6} (ognuno significa già qualcosa in JSX, nelle stringhe o nei messaggi), {7}, e due delimitatori diversi in cui uno contiene l'altro. Un valore non valido arresta il plugin all'avvio, indicando l'opzione."
markers_36seix: "personalizzato ({0})"
markers_3ot51v: "{0} → {1}: il primo cambio"
markers_flavrl: "Hai cambiato i delimitatori in {0}? Questi due riscrivono il sorgente dai vecchi ai nuovi:"
markers_frf1zx: "<b>Vecchi marker:</b> con delimitatori personalizzati, un {0} rimasto nel sorgente genera l'avviso {1} e non estrae nulla. Una <2>macro</2> ({3}) non richiede alcun delimitatore."
markers_k7q455: "{0} → {1}: da una coppia personalizzata a un'altra"
markers_ontib5: "Marker e chiavi"
markers_rbt5pa: "Riscrivere i marker"
markers_s0jnjx: "La demo <0>{1}</0> lo mostra in funzione, e la <2>estensione VS Code</2> evidenzia i tuoi delimitatori (li legge da {3})."
markers_sfpp0t: "nessuno"
markers_xmp9z5: "Argomenti"
markers_y4q8vv: "Come si marca una stringa, come scegliere i tuoi delimitatori e perché la chiave di una traduzione non cambia mai."
migratingfrom3_1wtzsev: "Gli originali vengono rinominati in {0}, mai eliminati: controlla il risultato, poi rimuovili. Un file che il convertitore non riesce a leggere da solo (un modulo di lingua con import o valori calcolati) viene lasciato dov'è e segnalato, così nulla viene convertito a metà. Se avvii Vite con i vecchi file ancora presenti, il plugin si ferma e dice esattamente questo invece di segnalare una lingua di origine mancante."
migratingfrom3_9utgzi: "Converti i moduli di lingua 3.x in file di dati con un solo comando, senza toccare il codice né il bundle."
migratingfrom3_i3y5yr: "Il comando stesso è descritto nella <0>documentazione della CLI</0>."
migratingfrom3_pdmdyp: "I file di lingua ora sono dati ({0}) invece di moduli JS. <b>Nulla cambia nel tuo codice o nel tuo bundle</b> — lo stesso chunk lazy per lingua, la stessa API — solo i file su disco e la loro estensione."
