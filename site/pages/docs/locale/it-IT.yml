limitations_kcmpi3: "<b>Gli id sono un hash a 32 bit</b> sul percorso del file e sul testo. Una collisione tra due stringhe è improbabile ma possibile, e viene segnalata come avviso di build che le nomina entrambe."
limitations_n2r7v: "<b>I delimitatori non possono contenere spazi, caratteri di controllo, {0} {1} {2} {3} {4} {5} un backtick, un backslash, {6} o {7}, e un singolo carattere comune genera molti avvisi.</b> <8>{9}/{10}</8> vengono controllati all'avvio del plugin. Un delimitatore facile da trovare nel testo normale (un {11} isolato, per esempio) trasforma ogni stringa che lo contiene, senza esserne racchiusa, in un avviso {12}: scegli due o più caratteri, o un simbolo che non compare mai nel testo reale ({13})."
limitations_nci5d5: "<b>I marker devono essere stringhe intere.</b> Uno incorporato in una stringa più lunga, o un template literal con {0} all'interno, non viene estratto — usa invece un segnaposto {1}. 🧪 <2>Dal vivo</2>."
limitations_o1ugcp: "<b>I children con spread non sono supportati.</b> {0} riceve un avviso {1} e viene lasciato intatto; scrivi i valori per esteso, oppure costruisci la frase con {2}."
limitations_p90zrt: "<b>I plurali non possono essere scritti come JSX.</b> Un valore semplice sì — {0} — ma {1} è sintassi ICU, non un'espressione JSX: scrivi invece {2} o {3}."
limitations_qqyckm: "autoWrap"
limitations_y2my8s: "<b>La sicurezza dei file è un tentativo ragionevole, non un lock.</b> Le tabelle vengono sostituite atomicamente una per una, dopo un controllo che nessuno le abbia modificate — ma resta una breve finestra di race tra il controllo e la rinomina, non c'è alcun lock tra i processi, più tabelle non sono un'unica transazione (un fallimento a metà viene segnalato, poi risolto rieseguendo), e una rinomina non conserva il proprietario di un file appartenente a un altro utente."
limitations_yqgloe: "<b>{0} non può essere riordinato.</b> {1} lo sostituisce in ordine con {2}; una lingua che richiede un ordine diverso non può esprimerlo con {3} — scrivi invece {4}/{5}, che una traduzione LLM <b>può</b> riordinare (vedi <6>messaggi ICU</6>). Lasciato come {7}, il prompt dice al modello di mantenere l'ordine di origine e di formulare attorno ad esso, e il validatore controlla solo il <i>conteggio</i>. 🧪 <8>{9} in qualsiasi ordine, dal vivo</8>."
limitations_z0qqlr: "<b>Un template taggato {0} viene riconosciuto solo quando {1} proviene da {2} (o {3}) nello stesso file.</b> Passato come prop, destrutturato da un hook wrapper, o importato da un altro modulo, il template taggato raggiunge il runtime non compilato e viene trattato come un template ordinario, non marcato — con un avviso in console in sviluppo."
limitations_zb73cb: "<b>La traduzione automatica LLM viene eseguita solo dalla CLI, mai da {0}.</b> Collegarla al plugin significherebbe una chiamata di rete — e un costo — a ogni avvio del dev server. Esegui invece {1} in un secondo terminale; il watcher del dev server rileva il {2} riscritto e ricarica."
