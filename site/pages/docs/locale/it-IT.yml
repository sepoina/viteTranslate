translate_1o0bs66: "Una stringa non marcata non è un errore: è il modo in cui un componente accetta sia testo traducibile sia dati di dominio senza che un wrapper decida al suo posto — il {0} mostra solo che nessuno la tradurrà. Un numero non può mai venire dal source, e un elemento non può essere un marker dimenticato, quindi nessuno dei due ha bisogno di una diagnostica. Nella tupla, però, il primo slot <b>è</b> il testo: un elemento lì è un errore (gli elementi tra gli <i>argomenti</i> vanno bene)."
