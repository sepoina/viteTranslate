translationfiles_10bqtgu: "Ogni lingua è un file {0} in {1}, chiamato come il suo tag BCP 47 ({2}, {3}, …), che contiene la tabella di traduzione come mappa piatta. Il file della <b>lingua di origine</b> è completamente autogenerato dai marker trovati nel tuo codice — non lo scrivi mai a mano. Per aggiungere una lingua, vedi <4>Aggiungere una lingua</4>."
translationfiles_1377m6b: "File di traduzione"
translationfiles_1fjnly4: "Un commento di intestazione (nome della lingua, tag, numero di chiavi ancora mancanti, timestamp dell'ultima sincronizzazione, versione del formato) si trova in cima, rigenerato a ogni sincronizzazione — non modificarlo mai a mano. Tutto ciò che sta sotto è testo: il resto del file non contiene altro."
translationfiles_1iv5cc3: "<b>Sostituzione atomica.</b> Una tabella viene scritta in un file temporaneo ({0}) e rinominata sopra quella vecchia, quindi un crash non lascia mai mezza tabella. Se un crash lascia dietro uno di questi file temporanei, eliminalo."
translationfiles_1npo7k0: "La sincronizzazione è l'unica cosa che scrive le tue tabelle, quindi è prudente:"
translationfiles_1p3j85i: "Formato del file"
translationfiles_1u5wh1u: "<b>Tutto o niente, prima della prima scrittura.</b> Ogni file viene letto, pianificato e salvato in backup prima che qualsiasi tabella venga sostituita. Un file illeggibile, incluso un symlink di lingua rotto o inaccessibile, ferma l'intera sincronizzazione senza cambiare nulla."
translationfiles_ag80ux: "Vieni dalla 3.x? I file di lingua erano moduli JS: vedi <0>migrare dalla 3.x</0>."
translationfiles_e80by6: "I valori sono sempre tra virgolette doppie, una voce per riga, senza indentazione. È un <b>sottoinsieme rigoroso di YAML</b>: qualunque cosa accetti questo formato, un vero parser YAML la legge allo stesso modo, quindi il tuo editor la colora e qualsiasi strumento YAML può leggerla. Il sottoinsieme è ristretto di proposito — gli scalari YAML senza virgolette rovinano esattamente il testo che scrivono i traduttori ({0} è un errore di sintassi, {1} si tronca a {2}, {3} diventa il numero {4}). Qualunque cosa fuori dal sottoinsieme è un errore che indica il <b>numero di riga</b>, non un plausibile valore sbagliato."
translationfiles_fth1yh: "I file di lingua .yml: il loro formato, e cosa li protegge mentre la sincronizzazione li riscrive."
translationfiles_gsf4r5: "🧪 Come appare quel testo sullo schermo — accenti, emoji, CJK, virgolette, backslash, nuove righe: <0>testi reali, dal vivo</0>."
translationfiles_h4afs3: "<b>Nessuna sovrascrittura.</b> Un file che hai salvato mentre la sincronizzazione era in corso non viene sovrascritto: la sincronizzazione si ferma con un messaggio e la esegui di nuovo."
translationfiles_ov9sxt: "<b>Backup.</b> Prima che una tabella venga rigenerata perché era corrotta ({0}), o prima di una sospetta cancellazione di massa ({1}, uno per lingua), il file viene copiato byte per byte — qualunque sia la sua codifica. Se un backup non può essere scritto, nulla viene sovrascritto."
translationfiles_t5lj77: "Cosa protegge i tuoi file"
translationfiles_y304mw: "È prudente, non magico: il controllo viene fatto appena prima di ogni tentativo di rinomina, inclusi i retry di Windows (rimane una piccola finestra), non c'è un lock tra processi, e diverse tabelle vengono sostituite una dopo l'altra, non come un'unica transazione — vedi <0>limitazioni</0>. I messaggi e cosa fare sono nella <1>riferimento della CLI</1>."
