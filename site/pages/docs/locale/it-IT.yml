panel_102bbjq: "Riquadro e cornice"
panel_10ci3g7: "Passa il mouse su una voce per i dettagli: quali lingue mancano, cosa ha detto l'estrazione."
panel_10l9zpg: "<i>non sincronizzato</i>: non ancora nei file di lingua. Esegui la sincronizzazione (questo è quello del pannello stesso)"
panel_11e8lt1: "<b>Traduzioni</b>: i file di lingua in {0}, una riga ciascuno: il codice della lingua e il suo nome in quella lingua, prima la lingua di origine. Cliccane uno per aprirlo. Una voce selezionata in <b>Risultati</b>? Si apre proprio su quella chiave, cursore sulla traduzione: correggila lì. Un ♥ accanto al titolo lo indica (passa il mouse per la chiave); scegli un file o una cartella, oppure nascondi Risultati, e sparisce. L'icona ti dice come sta andando il file: verde per la lingua di origine, giallo quando mancano traduzioni (il badge dice quante), rosso quando non può essere letto, semplice quando è completo. Nessun file ancora? Una riga ne spiega il motivo."
panel_11z1xyd: "<b>Chiave API</b>: <i>dove</i> si trova (una variabile d'ambiente, {0}, {1}, il portachiavi di sistema), mai cosa è. Non trovata? Dice dove ha cercato."
panel_12tbiw: "<b>Configurazione Vite</b>: {0}, aperto proprio sulle opzioni {1}."
panel_13ep6m5: "<b>Ping</b>: il modello risponde? Una piccola richiesta, in background, una volta per progetto. Nessuna chiave, nessun disturbo."
panel_14pkfag: "✅"
panel_14yx631: "Nessun blocco {0} nelle opzioni del plugin? Il pulsante mostra <b>LLM ?</b> e apre <b>Help</b>: come aggiungerne uno, e un pulsante che apre le opzioni in {1}."
panel_1506gkm: "Progetto"
panel_15a7396: "Accento parola chiave"
panel_164zfge: "Libreria mancante o troppo vecchia"
panel_179kdki: "Clicca <b>LLM ›</b> in <b>Project</b>. In alto, tre righe che rispondono a \"posso procedere?\":"
panel_17s3fuk: "<b>La barra dei comandi</b>: <b>Sync</b> esegue il {0} del progetto stesso in un terminale, e <b>LLM</b> sostituisce <b>Results</b> con la <1>pagina LLM</1>. A destra: GitHub, ⚙ <2>Settings</2>, ↻ aggiorna."
panel_182hcr8: "Clicca ⚙ in <b>Project</b>. In alto, il logo. Poi, sotto <b>CONFIG</b>, una riga per impostazione:"
panel_18pyui: "{0}, o una frase marcata con tag e valori ({1})"
panel_19he3o6: "Aspetto"
panel_19kz63g: "Come la selezione"
panel_1akrn1: "Results"
panel_1atvrdq: "Stile"
panel_1ay9h4c: "Effetto marcatore"
panel_1b25j40: "Mentre si aggiorna, il pannello non spaccia mai vecchie notizie per fresche: un progetto ancora in caricamento dice <i>Loading…</i>, un file appena salvato mostra ⏳, uno con modifiche non salvate mostra ✎, e le sue voci smettono di saltare (le righe potrebbero essersi spostate) finché non arriva la nuova scansione."
panel_1b4dxvq: "Il pannello di VS Code pezzo per pezzo: ogni sezione, glifo e pulsante, gli stili di evidenziazione e cosa succede sotto il cofano."
panel_1bscuvw: "<i>non completamente tradotto</i>: ancora {0} da qualche parte"
panel_1cqjubr: "Come gli inlay hint"
panel_1dg9ni2: "Il pannello"
panel_1djiaxf: "Barra di accento a sinistra"
panel_1ecy5fr: "Quindici stili, tutti nei colori del tuo tema. Scegline uno in <0>Settings</0>, ognuno con un esempio. Oppure esegui <b>viteTranslate: Choose highlight style…</b>, che li prova sul tuo codice mentre scorri la lista: {1} lo mantiene, {2} non cambia nulla. Oppure imposta {3}, {4} incluso."
panel_1eywx9z: "<b>Results</b> interroga il {0} <i>tuo</i> installato (e il suo {1}), in un processo separato: le stesse voci che troverebbe {2}, senza Babel incluso nell'estensione. È veloce perché ogni sync lascia un indice delle voci in {3}, e il pannello ri-analizza solo ciò che è cambiato da allora. Dopo un salvataggio Babel resta caldo per due minuti, poi il processo termina."
panel_1fja3d5: "Clicca l'icona % nella Activity Bar. All'avvio una singola pagina <b>Loading</b> mostra il logo e cosa sta leggendo; <b>Selector</b>, <b>Results</b> e <b>Project</b> subentrano quando hanno qualcosa di vero da dire. Aprili e chiudili come qualsiasi sezione della barra laterale."
panel_1fq1ev1: "<b>Highlight style</b>: ogni stile con un esempio; cliccane uno, gli editor cambiano subito."
panel_1g78vuz: "Etichetta piena"
panel_1gtyi8x: "<b>Quale runtime usano</b>: quello dell'editor stesso. Tranne su Windows, dove quel runtime tace in un terminale: lì usano il {0} nel tuo PATH, quello su cui gira Vite. Nessun Node nel PATH? Eseguono comunque e vedi l'output, ma non possono chiederti nulla (la conferma di <i>Translate</i>, la chiave API), e il terminale attende una chiave nel modo usuale. Un avviso lo segnala, una volta."
panel_1gy72ul: "significa"
panel_1it82lz: "Il progetto selezionato, e cosa farne. Le lingue scorrono; la barra dei comandi resta fissa in basso."
panel_1ji84ms: "Sotto il cofano"
panel_1jm3a9h: "Chip su contenuto"
panel_1lmrijn: "Link puntinato"
panel_1lpabch: "Solo corsivo"
panel_1mfsq4h: "<b>Search</b>: restringe <b>Results</b> alle voci il cui testo, o percorso file, contiene ciò che digiti. Niente maiuscole, niente accenti: {0} trova <i>Città</i>. Compare quando c'è qualcosa da cercare, e resta mentre digiti, anche quando nulla corrisponde. {1}, o la × alla sua destra, lo cancella."
panel_1muexbu: "<i>non tradotto</i>: {0} in ogni lingua di destinazione"
panel_1n0xe4: "🔄"
panel_1n9o8iz: "un template taggato {0}, o un template marcato con {1}"
panel_1nev4ow: "Settings"
panel_1pdqmt1: "Stringhe evidenziate nell'editor"
panel_1posgx: "<b>vitetranslate</b>: le opzioni del plugin come risolte: lingua di origine, cartella locale, lingue precaricate, auto-sync, {0}, {1} (i tuoi delimitatori, {2} quando predefiniti), fuso orario ICU, il blocco {3} (modello, endpoint, budget, il <i>nome</i> della variabile della chiave, mai la chiave). Non impostato: {4}."
panel_1q75ovc: "Un glifo davanti a ogni voce dice come sta andando. I problemi indossano gli stessi glifi che la tua app mostra sullo schermo: il tuo {0} (<1>diagnostics</1>), o quelli predefiniti."
panel_1qixau6: "<b>Config</b>: ogni progetto Vite nel workspace, una riga ciascuno: il suo nome {0} e la sua cartella. Cliccane uno ed è <i>il</i> progetto, per <b>Results</b> e <b>Project</b>. Un solo progetto? Niente da scegliere, quindi nessuna lista."
panel_1qlrv1z: "<b>vite.config</b>: plugin in ordine di caricamento, porta e host del server. Clicca per aprire."
panel_1ukdv8o: "Le stringhe marcate risaltano mentre digiti, in {0}, {1}, {2} e {3}: {4} (o i <5>{6}/{7}</5> del tuo progetto, letti dal suo {8}), {9}, template taggati {10} (e i loro nomi lunghi). Stesse regole dell'estrazione: ciò che si illumina viene tradotto. Finché {11} non è stato letto — o in una libreria precedente alla 4.7.0, o in Restricted Mode, dove non viene mai eseguito — si usa il {12} predefinito. L'esempio in Settings resta su {13}: mostra in anteprima lo stile, non il tuo progetto. I commenti, e gli esempi di codice dentro le stringhe, restano semplici. Nessun pannello necessario."
panel_1uswey1: "Evidenziazione"
panel_1va1utk: "Ogni stringa che il progetto marca per la traduzione, file per file: le cartelle di {0}, solo i file che hanno qualcosa di marcato, e sotto ogni file le sue voci in ordine di origine. Clicca una voce e il cursore vi si posiziona. Salva un file (o un file di lingua) e la lista si aggiorna."
panel_1x87voy: "Chip e righello"
panel_3kqode: "La pagina LLM"
panel_48xd1p: "Aprire un file JS o TS risveglia l'estensione solo per l'evidenziazione: {0} viene letto, e il progetto scansionato, quando apri il pannello."
panel_4ju318: "<b>Sync</b> e le azioni LLM girano in un terminale che si ripulisce da solo: quando la CLI ha finito, premi {0} entro 10 secondi per tenerlo, qualsiasi altro tasto per chiuderlo subito, oppure distogli lo sguardo. Se qualcosa è fallito resta finché non premi un tasto: l'errore è la parte che vale la pena leggere."
panel_4rwsck: "testo o attributo JSX marcato"
panel_52ly6o: "LLM"
panel_5bi27o: "Selector"
panel_6wydkk: "<b>Stato dei file locali</b>: cosa dicono i file del progetto selezionato."
panel_7xwr8h: "<b>Settings</b>: quale modello, su quale host, e se i prezzi sono impostati (senza di essi, costi e budget contano token, non denaro)."
panel_7zqmxk: "scritto come"
panel_85xbom: "Funziona anche al contrario: metti il cursore su una riga con una stringa marcata e <b>Results</b> seleziona quella voce (con <i>Filter</i> su <i>All</i>, <i>Search</i> vuoto e il file salvato). Il cursore resta dov'è."
panel_8o2gtb: "✳️"
panel_8q2aqb: "❇️"
panel_98m59d: "Sottolineatura sottile"
panel_bphmgh: "Mantieni <b>Project</b> almeno alto quanto la sua barra dei comandi: trascinalo a zero e sparisce anche la barra."
panel_civ59p: "Chip con bordo"
panel_csde8k: "‼️"
panel_e15qk4: "Queste si prendono il pannello per sé: <b>Selector</b>, <b>Results</b> e <b>Project</b> si fanno da parte (niente da scegliere mentre sei qui) e lo sfondo prende una tinta dell'accento del tuo tema. La barra dei comandi resta, stesso aspetto: <b>← Back</b> a sinistra, più i comandi propri della pagina se ne ha; a destra, l'icona della pagina. Back rimette tutto dov'era (così fa anche la ← nel titolo della sezione)."
panel_g2g9go: "🔸"
panel_gcfv5n: "🔹"
panel_h8rh4y: "<b>Results</b> richiede {0} 4.6.4 o successivo nel progetto. Nessuna libreria, o una più vecchia? <b>Results</b> e <b>Project</b> si fanno da parte per una pagina che dice cosa non va e il {1} che lo risolve (<b>Selector</b> resta solo se c'è un altro progetto su cui passare). Se ne va da sola una volta che la libreria c'è, oppure premi <b>Check again</b>."
panel_hc0sxu: "Quello evidenziato in <b>Config</b>, e ti segue ovunque: passa a un file e il suo progetto prende l'evidenziazione, mentre <b>Results</b> salta a quel file con le sue voci aperte. Stesso progetto? Niente si ridisegna. Ne hai scelto un altro in <b>Config</b>? Resta finché non cambi editor, e tra un riavvio e l'altro. Finché non ce n'è uno, <b>Results</b> e <b>Project</b> ti aspettano."
panel_hj95t4: "<b>Filter</b>: cosa mostra <b>Results</b>. <b>All</b>, <b>Malformed</b> (‼️, anche i file illeggibili), <b>Not synced</b> (🔄) o <b>Untranslated</b> (🔸 🔹), ognuno con il suo conteggio. Compaiono solo quelli con qualcosa dentro, e quando tutto va bene il filtro si fa da parte."
panel_nrc4c7: "Stile snippet"
panel_o6kg5s: "Sfondo incassato"
panel_ogeqzl: "{0} (predefinito)"
panel_pw36i1: "<b>vite.config</b> viene eseguito come lo esegue {0}: in un processo separato, mai tramite Vite. Nessun hook del plugin viene eseguito, nulla viene sincronizzato, nulla viene scritto. Una config che si blocca viene scartata dopo 15 secondi, e tutto ciò che stampa finisce nel canale di output <b>viteTranslate</b>. In <b>Restricted Mode</b> non viene eseguito nulla: ottieni solo {1}, niente <b>Results</b> e niente <b>Sync</b>. Considera attendibile il workspace per vedere il resto."
panel_q9qics: "Pagine che prendono il sopravvento: Settings, LLM, Help"
panel_qvinrj: "Ciò che guardi, e cosa farne. Dall'alto verso il basso:"
panel_rivipb: "Quale progetto"
panel_rolex: "<i>malformato</i>: l'estrazione ha segnalato un problema proprio lì ({0} annidato o non accoppiato, una macro rifiutata)"
panel_rpv5dy: "🟢"
panel_rtb8e2: "Sotto, le azioni {0}, ognuna spiegata: translate, stima il costo, retranslate, rigenera il contesto, status, ping, imposta / verifica / cancella la chiave API. Cliccane una e viene eseguita in un terminale, come Sync. <i>Check again</i>, nella barra, rifà le tre righe; se una è andata storta, il <b>?</b> accanto apre la guida alla configurazione. Altro sui flag: <1>Running and debugging</1>."
panel_ry3ncz: "Results, con il suo filtro"
panel_tiq9jm: "Sotto <b>VERSION</b>, chi è chi: questa estensione, la libreria installata nel progetto, la libreria più vecchia che l'estensione accetta, e l'API dell'IDE (come <b>Results</b> parla alla libreria), presente / richiesta. Giallo significa mancante o troppo vecchio; passa il mouse per il perché."
panel_udj5qm: "<b>Detailed config</b>: le impostazioni proprie dell'estensione in VS Code (<0>commands and settings</0>)."
panel_vcs5e6: "Il pannello viteTranslate"
panel_vjul00: "Tutto a posto è verde, e la tonalità ti dice come è scritto:"
panel_w4id7z: "Tutto si aggiorna da solo quando cambia un {0} o un {1} (e, per <b>Results</b>, un file sorgente o di lingua). ↻ lo fa su richiesta."
panel_y2t4gn: "<b>package.json</b>: le dipendenze che contano ({0}, {1}, …) come <i>dichiarate → installate</i>, più gli script. Clicca per aprire."
