translate_1ua6eyw: "Un numero e un elemento dicono cosa sono. Una <b>stringa</b> no: non marcata può significare <i>marker dimenticato</i>, oppure <i>un valore che non ne avrà mai uno</i> — un numero di telefono, un URI, il nome di un campo da un pannello di amministrazione, un messaggio del server. Solo il punto di chiamata sa quale:"
