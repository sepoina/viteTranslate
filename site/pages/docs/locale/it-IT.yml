overview_1h59luc: "<b>Niente da eseguire manualmente.</b> Estrazione e sincronizzazione avvengono all'interno di Vite, ogni volta che si avvia il server di sviluppo e prima di ogni build."
overview_1i56zwx: "Esegui l'upgrade dalla versione 3"
overview_1kiadux: "Cos'è viteTranslate, un video introduttivo, i quattro passaggi da una frase in JSX a una lingua distribuita e dove andare dopo."
overview_1kljp5l: "<b>Strumenti quando ti servono.</b> Una <0>CLI</0> per sincronizzazione, controlli CI e traduzione con LLM con un limite di spesa; un'<1>estensione VS Code</1> che mostra ogni stringa e il suo stato."
overview_1qt0pv0: "Guardalo in azione prima di installare qualsiasi cosa"
overview_1r4zy8l: "Gli utenti scaricano 5 kB gzip di runtime, escluso React. Le utility ICU sono incluse in quel numero e vengono distribuite solo quando una tabella usa ICU. <em>Tutto il resto resta sul tuo computer</em>: Babel e Vite fanno il loro lavoro in fase di {0} e {1} e non finiscono mai nel bundle (<2>perché</2>)."
