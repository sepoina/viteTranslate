pluginoptions_hf5i4: "<code>%s</code>"
pluginoptions_ioye08: "Sincronizza le tabelle all'avvio del dev server, usando la verifica rapida: non succede nulla, non viene stampato nulla, se nulla è cambiato dall'ultima sincronizzazione. Rende {0} non necessario"
pluginoptions_k2nt1z: "Configurazione per {0} — vedi sotto. Validata alla costruzione del plugin, come {1}; assente significa che la funzionalità resta disattivata"
pluginoptions_mby9g9: "<b>obbligatorio</b>"
pluginoptions_n4iyjl: "{0} è il caso speculare: solo {1} o un {2} lo attivano, qualsiasi altro valore (compreso uno veritiero con un refuso) lo lascia disattivato — un errore qui dovrebbe ricadere sul comportamento predefinito, non attivarlo per sbaglio. È accettato anche un {3} con il flag {4} o {5} — quei flag vengono rimossi internamente, dato che un {6} con stato risponderebbe altrimenti in modo diverso per il secondo tag che controlla nello stesso file."
