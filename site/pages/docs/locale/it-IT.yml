installation_tfq7wk: "Il plugin analizza le tue sorgenti con esso per trovare i marker. Senza di esso non viene estratto nulla, i marker raggiungono il browser nella loro forma originale e l'app viene renderizzata non tradotta in ogni stringa pur sembrando funzionante. Quindi la sua assenza blocca il dev server e fa fallire la build, anziché produrre un avviso che nessuno legge."
