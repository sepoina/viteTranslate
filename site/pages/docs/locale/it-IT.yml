preloading_1nerzca: "{0} se ne hai dichiarata qualcuna, altrimenti {1}"
preloading_1ok0fks: "{0} <b>più</b> {1} — la lingua in cui stai scrivendo, così i ricaricamenti non sospendono mai"
preloading_1tx38zf: "{0} è un'<b>ottimizzazione</b>, non ciò che impedisce il lampeggio — Suspense lo fa già. Trasforma il breve frame di caricamento in una prima pittura istantanea, al costo di mettere quelle lingue nel bundle iniziale. Limitati alle poche lingue che mostri effettivamente per prime:"
preloading_1vf1i9w: "<b>build</b>"
preloading_25uzal: "Ogni lingua è un chunk separato caricato su richiesta, quindi potrebbe non essere pronta al <b>primo</b> render. {0} ha un boundary {1} integrato, e nessuno dei due percorsi mostra mai la lingua sbagliata:"
preloading_3a8sdr: "<b>incluso in anticipo</b>"
preloading_4km16l: "Precaricamento e Suspense"
preloading_avrvu3: "Quali lingue sono in anticipo:"
preloading_cy9iba: "Una build di produzione non spedisce la lingua di origine solo come fallback: ogni tabella compilata è <b>autosufficiente</b>, ogni chiave non tradotta contiene già il testo di origine. Un'app che parte in {0} con {1} spedisce una tabella, non due."
preloading_k0xrc7: "<b>dev</b>"
preloading_pkkqow: "Senza {0}, il container parte dalla prima lingua in anticipo ({1}) — lo stesso in dev e in build, di proposito. Partire da una lingua che non è in anticipo funziona comunque, ma costa un round trip prima del primo paint; viene segnalato una volta in console, anche in produzione (in dev la lingua di origine è sempre in anticipo, quindi il controllo non scatterebbe mai lì)."
