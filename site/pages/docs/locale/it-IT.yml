panel_1pdqmt1: "Stringhe evidenziate nell'editor"
panel_1posgx: "<b>vitetranslate</b>: le opzioni del plugin come risolte: lingua di origine, cartella locale, lingue precaricate, auto-sync, {0}, {1} (i tuoi delimitatori, {2} quando predefiniti), fuso orario ICU, il blocco {3} (modello, endpoint, budget, il <i>nome</i> della variabile della chiave, mai la chiave). Non impostato: {4}."
panel_1qixau6: "<b>Config</b>: ogni progetto Vite nel workspace, una riga ciascuno: il suo nome {0} e la sua cartella. Cliccane uno ed è <i>il</i> progetto, per <b>Results</b> e <b>Project</b>. Un solo progetto? Niente da scegliere, quindi nessuna lista."
panel_1qlrv1z: "<b>vite.config</b>: plugin in ordine di caricamento, porta e host del server. Clicca per aprire."
panel_1ub2fod: "Le stringhe marcate risaltano mentre digiti, in {0}, {1}, {2} e {3}: {4} (o il <5>{6}/{7}</5> del tuo progetto, letto dal suo {8}), {9}, {10} template taggati (e i loro nomi lunghi). <em>Stesse regole dell'estrazione: ciò che si illumina viene tradotto.</em> Finché {11} non è stato letto — o in una libreria precedente alla 4.7.0, o in Modalità limitata, dove non viene mai eseguito — si usa il valore predefinito {12}. L'esempio nelle Impostazioni resta su {13}: mostra in anteprima lo stile, non il tuo progetto. I commenti e gli esempi di codice dentro le stringhe restano semplici. Nessun pannello necessario."
panel_1uswey1: "Evidenziazione"
panel_1va1utk: "Ogni stringa che il progetto marca per la traduzione, file per file: le cartelle di {0}, solo i file che hanno qualcosa di marcato, e sotto ogni file le sue voci in ordine di origine. Clicca una voce e il cursore vi si posiziona. Salva un file (o un file di lingua) e la lista si aggiorna."
panel_1x87voy: "Chip e righello"
panel_3kqode: "La pagina LLM"
panel_48xd1p: "Aprire un file JS o TS risveglia l'estensione solo per l'evidenziazione: {0} viene letto, e il progetto scansionato, quando apri il pannello."
panel_4ju318: "<b>Sync</b> e le azioni LLM girano in un terminale che si ripulisce da solo: quando la CLI ha finito, premi {0} entro 10 secondi per tenerlo, qualsiasi altro tasto per chiuderlo subito, oppure distogli lo sguardo. Se qualcosa è fallito resta finché non premi un tasto: l'errore è la parte che vale la pena leggere."
