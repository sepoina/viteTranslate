languages_1jsc9lo: "Nessuna ulteriore registrazione necessaria: ogni file {0} in {1} è automaticamente disponibile — {2} lo elenca e {3} lo carica in modo lazy su richiesta."
languages_1m6gd4x: "<b>Metodologia di costruzione:</b> Questo elenco è stato compilato espandendo un insieme di base di tag di lingua BCP 47 comuni attraverso un confronto incrociato con le capacità di internazionalizzazione native di Google Chrome (tramite il motore V8 e la libreria ICU). Per mantenere una rigorosa coerenza strutturale in tutto il dataset, è stata applicata una regola di filtraggio per conservare solo i formati standard {0} (xx-XX). I codici di lingua autonomi (ad es. {1}, {2}) e i tag di macro-regione (ad es. {3}) sono stati deliberatamente esclusi dalla tabella finale, anche se sono supportati nativamente dalle API {4} del browser."
languages_1xyv0cm: "I tag accettati da {0}: {1}, una lingua reale in una regione reale (<2>CLI</2>). 🎮 <3>Aggiungerne una</3> e <4>passare dall'una all'altra</4>, dal vivo."
languages_2a4xjr: "<b>Fonti dei dati:</b> Le principali fonti autorevoli utilizzate per convalidare ed espandere questo elenco includono la documentazione ufficiale dell'API Google Chrome Extensions per le locale supportate da {0}, il registro dei codici di lingua della Google Workspace Admin Directory API e le mappature del Common Locale Data Repository (CLDR) che determinano l'implementazione sottostante di ICU (International Components for Unicode) di Chromium."
