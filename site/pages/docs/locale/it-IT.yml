limitations_1bu5rtx: "Runtime e strumenti"
limitations_1byqpbk: "<b>Un template literal marcato ha bisogno di qualcosa che lo riceva.</b> Uno con {0} all'interno viene compilato solo dove il {1} che produce ha senso: {2}, {3} / {4}, oppure — con {5} — un attributo host o un child dentro un componente riconosciuto. Ovunque altro è un avviso {6} in fase di build, e il template viene lasciato com'era."
