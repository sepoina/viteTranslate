languageswitcher_12qxvkk: "{0} funziona anche sopra il container, così un'intestazione esterna all'albero tradotto può elencare le lingue. Lì {1} è {2} e cambiare non fa nulla."
languageswitcher_14io5dg: "Un selettore ha bisogno di tre cose: quale lingua è sullo schermo, quali esistono e un modo per chiederne un'altra. Un solo hook te le fornisce tutte. Questo tutorial presuppone un progetto con almeno due lingue, come quello in <0>La tua prima app tradotta</0>."
languageswitcher_1h9hzgt: "🎮 <0>Uno switcher, dal vivo</0> — la lista, il cambio e i callback {1}/{2} che mostrano il caricamento."
languageswitcher_1k6znb6: "{0} contiene ogni file trovato in {1}, con la lingua di origine per prima."
languageswitcher_1mtokb4: "Una ricarica torna alla lingua in {0}. Per conservare la scelta, salvala quando un cambio riesce, e rileggila all'avvio:"
languageswitcher_1vftbx2: "{0} viene letto una volta, al mount. Partire da una lingua non precaricata funziona, ma costa un round trip prima del primo paint, e il container lo segnala una volta nella console. Se la maggior parte dei visitatori parte dalla stessa lingua, vedi <1>Precaricamento</1>."
languageswitcher_1we86rm: "Elenca le lingue"
languageswitcher_37esvz: "Un caricamento fallito ripiega sulla lingua eager, e {0} ti dice quale è davvero sullo schermo. Vedi <1>useTranslateLanguage</1> per il pattern di retry e i callback {2} e {3}."
languageswitcher_7wiulw: "Un selettore di lingua"
languageswitcher_ad9kym: "{0} è il tag sullo schermo, quindi il pulsante della lingua corrente è disabilitato."
languageswitcher_axfsca: "{0} è la lingua scritta in sé stessa, regione inclusa: con {1}, {2} e {3} i pulsanti mostrano <i>American English</i>, <i>Deutsch (Deutschland)</i> e <i>français (France)</i>."
languageswitcher_g04w2k: "Clicca <i>Deutsch (Deutschland)</i> e la frase recita <i>Willkommen zurück, Ada!</i>; clicca <i>français (France)</i> e recita <i>Bon retour, Ada !</i>. <em>La lingua che lasci resta sullo schermo finché la nuova non è stata caricata</em>, quindi non c'è un fotogramma vuoto nel mezzo (<0>come funziona</0>)."
languageswitcher_jg6lrz: "Un pulsante che ruota"
languageswitcher_kqhdu5: "Ricorda la scelta"
languageswitcher_mvp6xf: "Elenca le lingue, cambia con un clic, ricorda la scelta o ruota tra esse con un solo pulsante."
languageswitcher_qqy6sw: "Mettilo ovunque sotto {0}:"
languageswitcher_rxmdj8: "Dopo aver scelto il tedesco e ricaricato, la pagina recita <i>Willkommen zurück, Ada!</i>. <em>{0} riceve l'esito reale, quindi un caricamento fallito non viene ricordato.</em>"
languageswitcher_s3uwla: "Per una demo, o una pagina con tre lingue e nessuno spazio per un menu: un solo pulsante che indica la lingua corrente e quella successiva. È quello che fa <0>{1}</0>."
languageswitcher_y03617: "Buono a sapersi"
languageswitcher_yaa389: "<em>L'array {0} è congelato e condiviso da tutta l'app.</em> Per ordinarlo o filtrarlo, copialo prima: {1}."
limitations_11yq3wi: "<b>Un fallback incorporato in dev può mostrare un'entità non decodificata sotto SSR, fino alla prima sincronizzazione.</b> {0} decodifica le entità usando il DOM; senza di esso (server-side rendering) restituisce il testo di fallback così com'è. Sparisce non appena la chiave viene sincronizzata nella tabella della lingua — la tabella compilata non lo porta mai."
limitations_13zltxi: "Marker ed estrazione"
limitations_1414qcb: "<b>{0} mantiene l'avviso di React anche quando {1} lo traduce.</b> React rifiuta i children su {2} indipendentemente da cosa siano; il testo tradotto viene comunque mostrato, ma la soluzione per l'avviso è {3}, non {4}."
limitations_160mu0r: "Messaggi e ICU"
limitations_169odn7: "Il preprocessore"
limitations_1aggsm6: "<b>Un'entità e il carattere che rappresenta sono due testi diversi per l'estrattore, ovunque.</b> {0} e {1} ottengono due id diversi, esattamente come {2} e {3} li hanno sempre — scrivere l'entità è una scelta, non un refuso da normalizzare. 🧪 <4>Entità, dal vivo</4>."
limitations_1bu5rtx: "Runtime e strumenti"
limitations_1byqpbk: "<b>Un template literal marcato ha bisogno di qualcosa che lo riceva.</b> Uno con {0} all'interno viene compilato solo dove il {1} che produce ha senso: {2}, {3} / {4}, oppure — con {5} — un attributo host o un child dentro un componente riconosciuto. Ovunque altro è un avviso {6} in fase di build, e il template viene lasciato com'era."
limitations_1cj1hxr: "<b>Un file marcato che il parser non riesce a leggere blocca la sincronizzazione.</b> La CLI e {0} si fermano con {1} <em>anziché cancellare le sue chiavi dalle tue tabelle</em>; {2} avvisa soltanto e si avvia. Il parser abilita solo {3} e {4}, quindi un file che usa i decoratori, per esempio, è sempre in questo caso finché non viene modificato. Vedi <5>Quando la sincronizzazione si ferma</5>."
limitations_1djl4vm: "<b>La traduzione automatica LLM viene eseguita solo dalla CLI, mai da {0}.</b> <em>Integrarla nel plugin significherebbe una chiamata di rete — e una bolletta — a ogni avvio del dev server.</em> Esegui invece {1} in un secondo terminale; il watcher del dev server rileva il {2} riscritto e ricarica."
limitations_1fd3lnf: "<b>{0} non può essere riordinato.</b> {1} lo sostituisce in ordine con {2}; una lingua che necessita di un ordine diverso non può esprimerlo con {3} — <em>scrivi invece {4}/{5}</em>, che una traduzione LLM <b>può</b> riordinare (vedi <6>messaggi ICU</6>). Lasciato come {7}, il prompt dice al modello di mantenere l'ordine di origine e di formulare attorno ad esso, e il validatore controlla solo il <i>conteggio</i>. 🧪 <8>{9} in qualsiasi ordine, dal vivo</8>."
limitations_1hc1e59: "<b>{0} ha bisogno del DOM</b> se chiamato direttamente. {1} no."
limitations_1nagd96: "<b>Un tag di markup non può aprirsi fuori da un ramo plural/select e chiudersi dentro di esso, o viceversa.</b> Ogni ramo viene compilato come un proprio piccolo albero; un tag deve essere intero al suo interno — lo stesso limite vale per un tag numerato (uno slot)."
limitations_1o6rsgh: "<b>Nessuna quotatura con apostrofo ICU.</b> Un apostrofo è sempre testo (vedi <0>Messaggi ICU</0>), quindi i messaggi importati da un catalogo ICU standard che usano {1} o {2} devono essere convertiti: {3} per una graffa letterale, un singolo {4} per un apostrofo. 🧪 <5>Dal vivo</5>."
limitations_1tvr0mt: "<b>{0} riscrive solo un attributo — o un testo JSX — all'interno di un componente che riesce a riconoscere come tale.</b> Il controllo è per file e volutamente conservativo (vedi <1>le note sull'architettura</1>): una funzione esportata come componente, o che chiama già un hook, è idonea; una semplicemente <i>invocata</i> altrove nello stesso file come funzione semplice non lo è mai, perché iniettare un hook al suo interno sarebbe una chiamata a un hook non valida. Se non viene riconosciuto, il testo o l'attributo marcato viene lasciato esattamente com'è scritto, con un avviso {2} che indica il file — {3} funziona comunque lì. 🧪 Questo e il prossimo limite di autoWrap, dal vivo: <4>edge/#autowrap</4>."
limitations_1vg36e: "<b>{0} non può apparire nel testo del messaggio.</b> Dentro {1} o un template marcato, scrivi il valore come {2} — un {3} letterale lì è un errore di build ({4}), <em>non un passaggio silenzioso</em>."
limitations_86x8k8: "<b>{0} non viene riconosciuto.</b> Il preprocessore cerca un identificatore semplice importato da {1} ({2}, o {3}); un import di namespace ({4}, poi {5}) è una forma AST diversa che non corrisponde — lo stesso vale per {6} riesportato da un file tuo."
limitations_96t8ip: "<b>La CLI carica la tua configurazione Vite con Node stesso</b>, non con Vite — una configurazione TypeScript richiede un Node che rimuova i tipi (23.6+)."
limitations_anogcb: "Cosa non fa viteTranslate, raggruppato per dove lo incontrerai."
limitations_bbok07: "🧪 La maggior parte di essi gira dal vivo, una riga per caso, sulla <0>pagina dei casi limite</0>: vedere il limite è più veloce che leggerlo."
limitations_c6d6op: "Limiti noti"
limitations_cktal4: "<b>Uno slot si numera da {0}, non da {1}, quando il messaggio ha un argomento con nome.</b> Posizioni e slot condividono un unico contatore (vedi <2>Translate</2>); {3} compila il link come {4}, non {5}."
limitations_kcmpi3: "<b>Gli id sono un hash a 32 bit</b> sul percorso del file e sul testo. Una collisione tra due stringhe è improbabile ma possibile, e viene segnalata come avviso di build che le nomina entrambe."
limitations_n2r7v: "<b>I delimitatori non possono contenere spazi, caratteri di controllo, {0} {1} {2} {3} {4} {5} un backtick, un backslash, {6} o {7}, e un singolo carattere comune genera molti avvisi.</b> <8>{9}/{10}</8> vengono controllati all'avvio del plugin. Un delimitatore facile da trovare nel testo normale (un {11} isolato, per esempio) trasforma ogni stringa che lo contiene, senza esserne racchiusa, in un avviso {12}: scegli due o più caratteri, o un simbolo che non compare mai nel testo reale ({13})."
limitations_nci5d5: "<b>I marker devono essere stringhe intere.</b> Uno incorporato in una stringa più lunga, o un template literal con {0} all'interno, non viene estratto — usa invece un segnaposto {1}. 🧪 <2>Dal vivo</2>."
limitations_o1ugcp: "<b>I children con spread non sono supportati.</b> {0} riceve un avviso {1} e viene lasciato intatto; scrivi i valori per esteso, oppure costruisci la frase con {2}."
limitations_p90zrt: "<b>I plurali non possono essere scritti come JSX.</b> Un valore semplice sì — {0} — ma {1} è sintassi ICU, non un'espressione JSX: scrivi invece {2} o {3}."
limitations_qqyckm: "autoWrap"
limitations_y2my8s: "<b>La sicurezza dei file è un tentativo ragionevole, non un lock.</b> Le tabelle vengono sostituite atomicamente una per una, dopo un controllo che nessuno le abbia modificate — ma resta una breve finestra di race tra il controllo e la rinomina, non c'è alcun lock tra i processi, più tabelle non sono un'unica transazione (un fallimento a metà viene segnalato, poi risolto rieseguendo), e una rinomina non conserva il proprietario di un file appartenente a un altro utente."
limitations_z0qqlr: "<b>Un template taggato {0} viene riconosciuto solo quando {1} proviene da {2} (o {3}) nello stesso file.</b> Passato come prop, destrutturato da un hook wrapper, o importato da un altro modulo, il template taggato raggiunge il runtime non compilato e viene trattato come un template ordinario, non marcato — con un avviso in console in sviluppo."
