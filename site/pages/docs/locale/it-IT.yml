pluginoptions_9ly8vv: "Mai usato dal plugin stesso — l'LLM viene eseguito solo da {0}, mai dentro un hook di Vite. Il plugin valida il blocco solo al momento della costruzione, quindi un errore qui si manifesta all'avvio del dev server, non alla prima chiamata a pagamento, e passa il risultato normalizzato alla CLI tramite {1} (lo stesso meccanismo che usano {2}/{3}, vedi <4>le note sull'architettura</4>)."
