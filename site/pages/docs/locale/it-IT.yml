overview_d20bmx: "<b>Progettato per interfacce reali.</b> Plurali <0>ICU</0>, select, numeri e date; un chunk caricato pigramente per lingua; il testo sorgente come fallback finché non arriva la traduzione; un sottoinsieme sicuro di tag HTML."
overview_e2sltb: "Il flusso in quattro passaggi"
overview_f3j8ca: "Scrivi l'interfaccia con le tue parole, direttamente nel JSX. viteTranslate trova ogni frase, mantiene sincronizzata con il codice una tabella {0} per ogni lingua e compila le traduzioni nella build Vite. <em>Nessuna chiave da inventare, nessuna fase di estrazione da ricordare, nessuna dipendenza runtime da includere.</em>"
overview_izzg4z: "<b>Sincronizza</b>: avvia {0} oppure esegui la build. Le nuove frasi vengono aggiunte a {1}, quelle obsolete rimosse e tu non modifichi mai quel file. <2>La tabella si aggiorna da sola</2>"
