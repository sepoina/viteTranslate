overview_z197qr: "Scrivi il testo in modo naturale in JSX. viteTranslate estrae le stringhe, mantiene sincronizzata una tabella {0} per lingua e compila le traduzioni come parte del tuo flusso di lavoro Vite. Nessuna chiave scritta a mano, nessun passaggio di estrazione separato, nessuna dipendenza runtime aggiuntiva."
