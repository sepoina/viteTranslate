pluginoptions_1l43aau: "Opzione"
pluginoptions_1lsh08m: "Fuso orario predefinito in fase di build per i messaggi ICU {0}/{1} — vedi sotto e <2>Messaggi ICU</2>"
pluginoptions_1ofi82e: "Fa sì che il testo e gli attributi JSX contrassegnati vengano renderizzati davvero invece di mostrare il marcatore compilato, riscrivendoli in una chiamata a {0}/hook. Attiva anche le due forme di preprocessore che hanno bisogno di un punto in cui renderizzare: una frase {1} divisa tra elementi JSX adiacenti ({2}), e la stessa forma hook {3} in cui compila dentro un componente riconosciuto. {4} copre ogni tag host tranne {5}, {6}, {7} e {8} (solo testo, gestiti diversamente); un {9} si restringe ulteriormente ai tag che corrispondono. Vedi <10>limitazioni</10> per ciò che non copre"
pluginoptions_1pxlmum: "Sostituisce un argomento senza valore — un {0}, un {1} o un {2} mancante dall'oggetto. Anche un oggetto semplice usato come <i>valore</i> stesso conta come mancante (è il contenitore degli argomenti, mai qualcosa da renderizzare). Rendering ordinario, non una diagnostica: si applica in dev <b>e</b> in una build, e {3} non lo tocca"
