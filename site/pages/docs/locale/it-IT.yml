usetranslatenode_1akw6ha: "Accetta un marker <b>compilato</b> — la stringa che {0} riceve già — non un {1} che scrivi tu."
usetranslatenode_1jo3lz7: "Un secondo argomento riempie il {0}, come {1}."
usetranslatenode_97o4d1: "La forma hook di Translate: la lookup senza un elemento, ovvero ciò che inietta autoWrap."
usetranslatenode_hcg7oz: "useTranslateNode"
usetranslatenode_pkhgur: "🎮 Cosa ne fa {0}: <1>live</1> · 🧪 <2>dieci casi limite</2>."
usetranslatenode_r4kvo0: "La forma hook di {0}: stessa lookup, senza un elemento. È ciò che inietta l'opzione {1} (<2>opzioni del plugin</2>), quindi quasi nessun progetto la scrive a mano."
usetranslatenode_xn3vn3: "Dato qualcosa che non è un marker compilato, non ha alcuna chiave da cercare e restituisce il testo stesso, con i delimitatori rimossi — lo stesso fallback che {0} e {1} usano per ciò che il compilatore non ha mai visto."
usetranslatetostring_14ib4aa: "Per i punti che richiedono una stringa semplice invece di JSX — {0}, {1}, {2}:"
usetranslatetostring_18lclyq: "La forma con tagged template — {0} chiamato su un template literal, come sopra — funziona solo quando {1} proviene da {2} (o {3}) <b>nello stesso file</b>: il preprocessore cerca la chiamata, non il nome. Passato come prop, o racchiuso in un altro hook, arriva al runtime non compilato ed è trattato come un template semplice e non marcato."
usetranslatetostring_1g72l3g: "useTranslateToString"
usetranslatetostring_47vgdt: "{0} accetta anche le stesse forme di chiamata delle <2>altre forme</2> di {1}, con gli stessi <3>prefissi di diagnostica</3> e la stessa <4>regola {5}</4> per un {6} mancante:"
usetranslatetostring_bsrje4: "Stringhe semplici tradotte per placeholder, aria-label, title e qualsiasi altra cosa che non sia JSX."
usetranslatetostring_k80zyw: "🎮 Live: <0>placeholder e attributi</0>."
usetranslatetostring_vt05bq: "Deve restituire una stringa primitiva, quindi un <b>elemento React</b> è l'unica forma che non accetta: un vero errore, con un messaggio tutto suo. Altri valori non testuali (una funzione, un symbol, un elemento dentro la tupla) restituiscono {0} con un avviso in console in sviluppo, come in {1}."
