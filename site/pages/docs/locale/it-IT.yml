panel_6wydkk: "<b>Stato dei file locali</b>: cosa dicono i file del progetto selezionato."
panel_7xwr8h: "<b>Settings</b>: quale modello, su quale host, e se i prezzi sono impostati (senza di essi, costi e budget contano token, non denaro)."
panel_7zqmxk: "scritto come"
panel_85xbom: "Funziona anche al contrario: metti il cursore su una riga con una stringa marcata e <b>Results</b> seleziona quella voce (con <i>Filter</i> su <i>All</i>, <i>Search</i> vuoto e il file salvato). Il cursore resta dov'è."
