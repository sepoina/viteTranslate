installation_vjbi13: "Essendo un peer obbligatorio, npm e pnpm lo installano da soli. Yarn si limita ad avvisare, e non arriva per riflesso nemmeno da {0}, che dalla versione 6 non dipende da Babel. Se il tuo package manager lo ha omesso, installalo tu stesso:"
