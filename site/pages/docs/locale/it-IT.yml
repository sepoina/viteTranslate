panel_1ecy5fr: "Quindici stili, tutti nei colori del tuo tema. Scegline uno in <0>Settings</0>, ognuno con un esempio. Oppure esegui <b>viteTranslate: Choose highlight style…</b>, che li prova sul tuo codice mentre scorri la lista: {1} lo mantiene, {2} non cambia nulla. Oppure imposta {3}, {4} incluso."
panel_1eywx9z: "<b>Results</b> interroga il {0} <i>tuo</i> installato (e il suo {1}), in un processo separato: le stesse voci che troverebbe {2}, senza Babel incluso nell'estensione. È veloce perché ogni sync lascia un indice delle voci in {3}, e il pannello ri-analizza solo ciò che è cambiato da allora. Dopo un salvataggio Babel resta caldo per due minuti, poi il processo termina."
panel_1fja3d5: "Clicca l'icona % nella Activity Bar. All'avvio una singola pagina <b>Loading</b> mostra il logo e cosa sta leggendo; <b>Selector</b>, <b>Results</b> e <b>Project</b> subentrano quando hanno qualcosa di vero da dire. Aprili e chiudili come qualsiasi sezione della barra laterale."
panel_1fq1ev1: "<b>Highlight style</b>: ogni stile con un esempio; cliccane uno, gli editor cambiano subito."
panel_1g78vuz: "Etichetta piena"
panel_1gtyi8x: "<b>Quale runtime usano</b>: quello dell'editor stesso. Tranne su Windows, dove quel runtime tace in un terminale: lì usano il {0} nel tuo PATH, quello su cui gira Vite. Nessun Node nel PATH? Eseguono comunque e vedi l'output, ma non possono chiederti nulla (la conferma di <i>Translate</i>, la chiave API), e il terminale attende una chiave nel modo usuale. Un avviso lo segnala, una volta."
panel_1gy72ul: "significa"
panel_1it82lz: "Il progetto selezionato, e cosa farne. Le lingue scorrono; la barra dei comandi resta fissa in basso."
