overview_1fx06w6: "Funziona con Vite 5 fino a 8 e React 18 o 19. Dove si colloca rispetto a Lingui, FormatJS e i18next è nel <0>confronto</0>."
overview_1gorazl: "<b>Scrivi</b> la frase dove appartiene: {0}. Nessuna chiave da inventare. <1>Uso</1>"
overview_1hoq7vb: "<b>Sincronizza</b>: a ogni avvio di {0} e prima di ogni build, le nuove frasi entrano in {1}, quelle obsolete escono. <2>La tabella si scrive da sola</2>"
overview_1lp9e8j: "Un plugin Vite e un piccolo runtime React, installati come un unico pacchetto. Il plugin legge il tuo sorgente, il runtime mostra la frase giusta per la lingua corrente."
overview_1s8hk8v: "<0>La tua prima app tradotta</0>"
overview_1tmxv8o: "<0>Migrazione dalla 3.x</0>"
overview_1ucvhhj: "Dove andare adesso"
overview_1w5ljcb: "Cos'è viteTranslate, i quattro passaggi da una frase in JSX a una lingua pubblicata, e dove andare adesso."
overview_1yszoc0: "Cerca qualcosa"
overview_275qvn: "<b>Pronto per interfacce reali.</b> <0>ICU</0> plurali, select, numeri e date; un chunk in lazy loading per lingua; il testo di origine come fallback finché non esiste una traduzione; un sottoinsieme sicuro di tag HTML."
overview_3bbkzl: "Cos'è"
overview_48nlby: "<b>Strumenti dove ti servono.</b> Una <0>CLI</0> per la sincronizzazione, i controlli CI e la traduzione LLM protetta; un'<1>estensione VS Code</1> che mostra ogni stringa e il suo stato."
overview_4mlj3q: "Installalo in un progetto esistente"
overview_61l2zr: "<b>Meno lavoro manuale.</b> Estrazione e sincronizzazione avvengono dentro Vite, non come un comando separato da ricordare."
overview_6deyc0: "<0>Opzioni del plugin</0> · <1>CLI</1> · <2>Tipi TypeScript</2>"
