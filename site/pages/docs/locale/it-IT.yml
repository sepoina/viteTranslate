overview_fvljmk: "Il runtime del browser pesa 5 kB gzip, React escluso. Gli helper ICU fanno parte di quel numero ma vengono inclusi solo quando una tabella usa ICU. Nient'altro entra nel tuo bundle: Babel e Vite girano sulla tua macchina in fase di {0} e {1} (<2>perché</2>)."
