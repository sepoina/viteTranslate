price_1oemlgj: "Il costo richiede entrambi i prezzi. Senza di essi gli stessi preset ricadono su limiti in token (input + output) — una unità alla volta. Un oggetto sovrascrive singoli campi sopra {0}: {1}, {2} (questi due richiedono i prezzi), {3}, {4}. Un campo esplicito conta sempre, in entrambe le unità. Qualsiasi altra cosa è un errore di configurazione."
price_1ohpfmm: "La stima usa sempre i tuoi prezzi. Quanto spende il run usa invece la cifra che riporta il provider, quando la fornisce — OpenRouter lo fa, in {0} — per l'ultima riga, per la spesa di oggi e per i limiti di budget: tramite OpenRouter un batch può finire su un provider più costoso di quello da cui hai copiato i prezzi."
