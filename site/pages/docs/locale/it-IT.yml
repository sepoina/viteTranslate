panel_8q2aqb: "❇️"
panel_98m59d: "Sottolineatura sottile"
panel_bphmgh: "Mantieni <b>Project</b> almeno alto quanto la sua barra dei comandi: trascinalo a zero e sparisce anche la barra."
panel_civ59p: "Chip con bordo"
panel_csde8k: "‼️"
panel_e15qk4: "Queste si prendono il pannello per sé: <b>Selector</b>, <b>Results</b> e <b>Project</b> si fanno da parte (niente da scegliere mentre sei qui) e lo sfondo prende una tinta dell'accento del tuo tema. La barra dei comandi resta, stesso aspetto: <b>← Back</b> a sinistra, più i comandi propri della pagina se ne ha; a destra, l'icona della pagina. Back rimette tutto dov'era (così fa anche la ← nel titolo della sezione)."
panel_g2g9go: "🔸"
panel_gcfv5n: "🔹"
panel_h8rh4y: "<b>Results</b> richiede {0} 4.6.4 o successivo nel progetto. Nessuna libreria, o una più vecchia? <b>Results</b> e <b>Project</b> si fanno da parte per una pagina che dice cosa non va e il {1} che lo risolve (<b>Selector</b> resta solo se c'è un altro progetto su cui passare). Se ne va da sola una volta che la libreria c'è, oppure premi <b>Check again</b>."
panel_hc0sxu: "Quello evidenziato in <b>Config</b>, e ti segue ovunque: passa a un file e il suo progetto prende l'evidenziazione, mentre <b>Results</b> salta a quel file con le sue voci aperte. Stesso progetto? Niente si ridisegna. Ne hai scelto un altro in <b>Config</b>? Resta finché non cambi editor, e tra un riavvio e l'altro. Finché non ce n'è uno, <b>Results</b> e <b>Project</b> ti aspettano."
panel_hi4i3j: "Un glifo davanti a ogni voce dice come sta andando. <em>I problemi indossano gli stessi glifi che la tua app mostra sullo schermo</em>: i tuoi {0} (<1>diagnostica</1>), o i valori predefiniti."
panel_hj95t4: "<b>Filter</b>: cosa mostra <b>Results</b>. <b>All</b>, <b>Malformed</b> (‼️, anche i file illeggibili), <b>Not synced</b> (🔄) o <b>Untranslated</b> (🔸 🔹), ognuno con il suo conteggio. Compaiono solo quelli con qualcosa dentro, e quando tutto va bene il filtro si fa da parte."
panel_i64xb7: "Mentre si aggiorna, <em>il pannello non spaccia mai vecchie notizie per fresche</em>: un progetto ancora in caricamento dice <i>Caricamento…</i>, un file appena salvato mostra ⏳, uno con modifiche non salvate mostra ✎, e le loro voci smettono di saltare (le righe potrebbero essersi spostate) finché non arriva la nuova scansione."
panel_nrc4c7: "Stile snippet"
panel_o6kg5s: "Sfondo incassato"
panel_ogeqzl: "{0} (predefinito)"
panel_pw36i1: "<b>vite.config</b> viene eseguito come lo esegue {0}: in un processo separato, mai tramite Vite. Nessun hook del plugin viene eseguito, nulla viene sincronizzato, nulla viene scritto. Una configurazione che si blocca viene scartata dopo 15 secondi, e tutto ciò che stampa finisce nel canale di output <b>viteTranslate</b>. In <b>Modalità limitata</b> non viene eseguito nulla: ottieni solo {1}, nessun <b>Risultati</b> e nessun <b>Sync</b>. Considera attendibile l'area di lavoro per vedere il resto."
panel_q9qics: "Pagine che prendono il sopravvento: Settings, LLM, Help"
panel_qvinrj: "Ciò che guardi, e cosa farne. Dall'alto verso il basso:"
panel_rivipb: "Quale progetto"
panel_rolex: "<i>malformato</i>: l'estrazione ha segnalato un problema proprio lì ({0} annidato o non accoppiato, una macro rifiutata)"
panel_rpv5dy: "🟢"
panel_rtb8e2: "Sotto, le azioni {0}, ognuna spiegata: translate, stima il costo, retranslate, rigenera il contesto, status, ping, imposta / verifica / cancella la chiave API. Cliccane una e viene eseguita in un terminale, come Sync. <i>Check again</i>, nella barra, rifà le tre righe; se una è andata storta, il <b>?</b> accanto apre la guida alla configurazione. Altro sui flag: <1>Running and debugging</1>."
panel_ry3ncz: "Results, con il suo filtro"
panel_tiq9jm: "Sotto <b>VERSION</b>, chi è chi: questa estensione, la libreria installata nel progetto, la libreria più vecchia che l'estensione accetta, e l'API dell'IDE (come <b>Results</b> parla alla libreria), presente / richiesta. Giallo significa mancante o troppo vecchio; passa il mouse per il perché."
panel_udj5qm: "<b>Detailed config</b>: le impostazioni proprie dell'estensione in VS Code (<0>commands and settings</0>)."
panel_ui2bsg: "<b>Chiave API</b>: <i>dove</i> si trova (una variabile d'ambiente, {0}, {1}, il portachiavi di sistema), <em>mai cos'è</em>. Non trovata? Dice dove ha cercato."
