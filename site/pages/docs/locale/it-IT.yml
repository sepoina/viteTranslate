panel_1lmrijn: "Link puntinato"
panel_1lpabch: "Solo corsivo"
panel_1mfsq4h: "<b>Search</b>: restringe <b>Results</b> alle voci il cui testo, o percorso file, contiene ciò che digiti. Niente maiuscole, niente accenti: {0} trova <i>Città</i>. Compare quando c'è qualcosa da cercare, e resta mentre digiti, anche quando nulla corrisponde. {1}, o la × alla sua destra, lo cancella."
