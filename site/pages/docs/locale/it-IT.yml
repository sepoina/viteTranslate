pluralsanddates_1e83fak: "I plurali e le date usano i messaggi ICU, scritti in una stringa contrassegnata e compilati in fase di build. Questo tutorial costruisce una piccola pagina con entrambi, in due lingue. La sintassi completa è in <0>Messaggi ICU</0>; qui lo vedi all'opera."
pluralsanddates_1ixgsd1: "Выбрано: 21 файл"
pluralsanddates_1j5ntiu: "La traduzione è libera di riordinare gli argomenti o di eliminare una forma plurale di cui la lingua non ha bisogno. Un nome come {0} è codice, non testo: resta come scritto in ogni lingua."
pluralsanddates_1jge9o0: "Ora chiedi lo stato:"
pluralsanddates_1nc1d4y: "21"
pluralsanddates_1tqn8et: "{0} formatta una data per la lingua sullo schermo. Una stringa come {1} è una data di calendario, non un istante, quindi non scivola mai al giorno prima in un fuso orario occidentale (<2>fusi orari</2>)."
pluralsanddates_1xi6hy9: "Aggiungi una lingua con più forme plurali"
pluralsanddates_1yioljz: "Un contatore che dice \"1 file\" e \"5 file\" in ogni lingua, una data che si legge bene ovunque, e l'avviso che ti dice che a una traduzione manca una forma plurale."
pluralsanddates_243eyo: "La data si legge <i>Oct 3, 2026</i> in inglese e <i>3 окт. 2026 г.</i> in russo, dallo stesso messaggio. Ogni lingua sceglie la propria regola plurale e il proprio ordine delle date: non li scrivi mai tu."
pluralsanddates_3do4qk: "Traducilo con solo le due forme che conosci dall'inglese, come primo tentativo:"
pluralsanddates_5kx4f4: "Un <0>LLM</0> riceve lo stesso controllo: una risposta a cui manca una categoria plurale per la lingua di destinazione viene rifiutata."
pluralsanddates_baat3: "L'inglese ha due forme plurali. Il russo ne ha quattro. Aggiungilo:"
pluralsanddates_dfbb72: "{0} sceglie un ramo dal numero in {1}. {2} corrisponde esattamente a zero, {3} e {4} sono le categorie plurali dell'inglese, e {5} sta per il numero stesso."
pluralsanddates_fh49ic: "Russo"
pluralsanddates_gx3r32: "Compila, visualizza in anteprima e clicca attraverso il contatore in russo:"
pluralsanddates_ihmb8g: "Parti da un progetto con {0} come lingua di origine, come quello in <1>La tua prima app tradotta</1>."
