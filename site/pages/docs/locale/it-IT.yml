price_up47op: "<b>Riga 3</b> — token stimati, il costo quando i prezzi sono impostati, e il confronto con <0>{1}</0> quando è impostato."
price_v10mgk: "Alcuni modelli pensano prima di rispondere, e fatturano il pensiero come token di output sotto lo stesso {0} della risposta. Nella demo del ristorante, {1} ha speso il 78% del suo output pensando, e ogni troncamento è venuto da lì. L'esecuzione lo misura a parte — da {2}, dove il provider lo riporta — per chiave e per lingua, dimensiona i batch per esso, e mostra la sua quota sull'ultima riga:"
price_ydn5di: "Una risposta che torna <b>troncata</b> non viene mai reinviata così com'era: la stessa domanda con lo stesso limite si troncherebbe di nuovo, e ogni tentativo viene fatturato. Ciò che è tornato completo viene conservato; le altre chiavi tornano al modello <b>nella stessa esecuzione</b>, in lotti di dimensione al massimo pari alla metà, per un massimo di tre round (100 → 50 → 25 → 12). Le chiavi ancora tagliate dopo restano {0}, e una nota sotto il pannello lo segnala. La risposta troncata calibra anche l'esecuzione successiva: le chiavi che ha riportato misurano la risposta, e il suo ragionamento, distribuito sull'intero lotto, è un limite minimo — anche quando il modello ha bruciato l'intero {1} a pensare e non è mai arrivato alla risposta."
price_yrfndr: "La stima converte i caratteri in token con un rapporto fisso alla prima esecuzione: 4 caratteri per token, 1,5 quando la lingua <b>di origine</b> è cinese, giapponese o coreana. Da quel momento si fida di ciò che ha riportato {0} del provider — per modello, e per l'output per lingua di destinazione, diviso in due: la risposta stessa, e il pensiero di un <1>modello di ragionamento</1>, per chiave. Contano solo le ultime ~300 chiavi di ogni lingua, così un modello che cambia modo si nota entro un'esecuzione."
