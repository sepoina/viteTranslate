languages_13m8b5t: "Un valore come {0} deriva dall'aver scritto JSX dentro {1} (<2>Translate</2>): {3} qui non ha attributi, quindi è testo — spostalo dove la frase lo richiede, come si sposta qualsiasi altro tag. Un {4} è diverso: è uno <b>slot</b>, che sostituisce un link o un componente fornito dal codice sorgente — un {5}, un {6}. Mantieni ogni tag numerato, di apertura e chiusura, con il suo numero, attorno alle parole che gli appartengono; puoi spostare un tag insieme alle sue parole, ma <em>non rinumerarne mai uno, eliminarlo o trasformarlo in un tag diverso</em> — il numero è come la tabella compilata trova l'elemento giusto, non una scelta stilistica."
languages_1ar9jvo: "Il tag deve essere nella forma {0} e indicare una lingua e una regione reali (<1>elenco supportato</1>) — <em>{2} viene rifiutato prima che qualsiasi cosa venga scritta su disco</em>. Una lingua già presente viene lasciata intatta."
