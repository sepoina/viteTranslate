migratingfrom3_pdmdyp: "I file di lingua ora sono dati ({0}) invece di moduli JS. <b>Nulla cambia nel tuo codice o nel tuo bundle</b> — lo stesso chunk lazy per lingua, la stessa API — solo i file su disco e la loro estensione."
migratingfrom3_smaizi: "Gli originali vengono rinominati in {0}, <em>mai eliminati</em>: controlla il risultato, poi rimuovili. Un file che il convertitore non riesce a leggere da solo (un modulo di lingua con import o valori calcolati) viene lasciato dov'è e segnalato, così nulla viene convertito a metà. Se avvii Vite con i vecchi file ancora al loro posto, il plugin si ferma e dice esattamente questo invece di segnalare una lingua di origine mancante."
