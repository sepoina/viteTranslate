pluralsanddates_1e83fak: "I plurali e le date usano i messaggi ICU, scritti in una stringa contrassegnata e compilati in fase di build. Questo tutorial costruisce una piccola pagina con entrambi, in due lingue. La sintassi completa è in <0>Messaggi ICU</0>; qui lo vedi all'opera."
