translatecontainer_ez7ayu: "{0}, {1}, {2} e {3} sono {4}, {5}, {6} e {7} con un nome più corto: <b>la stessa funzione</b>, non una copia ({8}), quindi React DevTools mostra il nome completo. Entrambi continuano a funzionare per sempre, e il preprocessore legge entrambi (anche con un alias {9}). Una chiave non dipende mai dal nome o dai delimitatori: rinominare {10} in {11} mantiene tutte le traduzioni. L'unica eccezione è un testo che contiene la parola {12} stessa — un sito su questa libreria — che è un nuovo messaggio. Il resto dell'API ({13}, {14}, {15}, {16}) non ha un nome corto."
