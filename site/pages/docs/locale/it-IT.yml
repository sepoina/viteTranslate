installation_13yxl2y: "Un'asimmetria che vale la pena conoscere. Con il rendering lato server il runtime viene eseguito da Node in produzione, quindi <em>lì il pacchetto va in {0}</em>, e Babel viene classificato come dipendenza di produzione insieme a esso. Lo stesso vale se ripubblichi una libreria che riesporta questi componenti."
installation_14c3hli: "Entrambe le major funzionano, ed entrambe producono un'estrazione identica. Babel 8 richiede Node {0}, che è più restrittivo di qualsiasi cosa chieda questo plugin. Nota che npm avvisa solo di {1}, quindi installerà tranquillamente Babel 8 su un Node più vecchio, dove non può essere caricato affatto. Se succede, ti viene detto, e ti viene detto di aggiornare Node o restare su Babel 7 — non di reinstallare ciò che hai già."
installation_1742npj: "Il plugin analizza le tue sorgenti con esso per trovare i marker. Senza di esso non viene estratto nulla, i marker raggiungono il browser nella loro forma sorgente e l'app renderizza non tradotta in ogni stringa pur sembrando funzionare. Quindi <em>la sua assenza blocca il dev server e fa fallire la build</em>, invece di produrre un avviso che nessuno legge."
installation_17md6b: "Perché <code>%s</code> è obbligatorio"
installation_1bdat4y: "Sotto Vitest nessuno dei due controlli scatta. Il test runner esegue gli hook del plugin, e la tua suite non dovrebbe morire per una dipendenza che i tuoi test non raggiungono mai."
