limitations_qqyckm: "autoWrap"
limitations_y2my8s: "<b>文件安全是尽力而为，而非锁定。</b>表会被逐个原子地替换，替换前会检查是否有其他人修改过；但在检查与重命名之间仍存在一个很短的竞争窗口，进程之间没有锁，多个表也不构成一个事务（中途失败会被报告，再次运行即可修复），而且重命名不会保留被其他用户拥有的文件的所有者。"
limitations_yqgloe: "<b>{0} 不能重新排序。</b>{1} 会按顺序使用 {2} 替换它；需要不同顺序的语言无法通过 {3} 表达这一点——请改写为 {4}/{5}，LLM 翻译<b>可以</b>对其重新排序（参见<6>ICU 消息</6>）。保留为 {7} 时，提示会告诉模型保持源顺序并围绕它措辞，验证器只检查<i>数量</i>。🧪 <8>{9} 任意顺序，实时演示</8>。"
limitations_z0qqlr: "<b>只有当 {1} 与 {2}（或 {3}）来自同一文件时，{0} 带标签的模板才会被识别。</b>如果将其作为 prop 传递、从包装 hook 中解构，或从其他模块导入，带标签的模板会未经编译地到达运行时，并被视为普通的未标记模板——开发环境中会有控制台警告。"
limitations_zb73cb: "<b>LLM 自动翻译只能从 CLI 运行，绝不会从 {0} 运行。</b>将其接入插件意味着每次启动开发服务器时都会有网络调用——以及费用。请改在第二个终端中运行 {1}；开发服务器的监视器会检测到重写后的 {2} 并重新加载。"
