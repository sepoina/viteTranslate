markers_1wpz33o: "{0} 运行完整检查但不写入任何内容；它会输出当前标记与重写后标记下的翻译状态。{1} 对<b>每个文件执行同样的检查</b>，然后才写入：要么全部成功，要么全部不写。如果有任何一个键会改变（例如宏的文本包含新定界符），或某个包含旧标记的文件无法解析，它将不写入任何内容，列出问题项并以 {2} 退出。如果写入中途失败（权限不足、文件被其他程序锁定），它会停止并列出已重写与未重写的内容；无论哪种情况，键都保持一致，因此再次运行同一命令即可完成剩余工作。之后不会运行同步：表与缓存会在你下一次同步时更新。"
