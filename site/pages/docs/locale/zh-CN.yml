limitations_1tvr0mt: "<b>{0} 只会在它能识别为组件的组件内重写属性或 JSX 文本。</b>该检查基于文件，并且刻意保守（参见 <1>架构说明</1>）：被导出为组件、或已经调用过 Hook 的函数会被识别；同一文件中仅作为普通函数被<i>调用</i>的函数永远不会，因为向其中注入 Hook 会导致无效的 Hook 调用。未被识别时，标记的文本或属性会保持原样，并会输出一条指明文件的 {2} 警告——{3} 在那里仍然可用。🧪 本条以及下一条 autoWrap 限制的在线演示：<4>edge/#autowrap</4>。"
limitations_1vp1h3t: "<b>{0} 不能出现在消息文本中。</b>在 {1} 或带标记的模板中，应将该值写作 {2}——此处的字面量 {3} 会导致构建错误（{4}），而非静默透传。"
limitations_86x8k8: "<b>{0} 无法被识别。</b>预处理器只查找从 {1} 导入的普通标识符（{2}，或 {3}）；命名空间导入（{4}，然后 {5}）是预处理器不匹配的另一种 AST 结构——从你自己的文件中重新导出的 {6} 同理。"
