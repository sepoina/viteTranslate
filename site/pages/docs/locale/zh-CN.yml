limitations_n2r7v: "<b>分隔符不能包含空格、控制字符、{0} {1} {2} {3} {4} {5} 反引号、反斜杠、{6} 或 {7}，而且常见的单个字符会引发大量警告。</b><8>{9}/{10}</8> 会在插件启动时检查。在普通文本中很容易出现的分隔符（例如单独的 {11}）会让每个包含它但未被其包裹的字符串都触发 {12} 警告：请选择两个或更多字符，或永远不会出现在真实文本中的符号（{13}）。"
limitations_nci5d5: "<b>标记必须是完整字符串。</b>嵌入在较长字符串中的标记，或内部包含 {0} 的模板字符串，不会被提取——请改用 {1} 占位符。🧪 <2>实时演示</2>。"
limitations_o1ugcp: "<b>不支持展开式子元素。</b>{0} 会收到一条 {1} 警告且保持不变；请直接写出各个值，或使用 {2} 构建句子。"
