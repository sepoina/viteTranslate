limitations_1i9qpus: "<b>无法解析的已标记文件会阻止同步。</b>CLI 和 {0} 会以 {1} 停止，而不是从你的表中删除其键；{2} 只会警告并继续启动。解析器仅启用 {3} 和 {4}，因此例如使用装饰器的文件在修改之前总会处于这种情况。参见 <5>同步何时停止</5>。"
