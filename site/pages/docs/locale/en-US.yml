markers_9hu72z: "{0} runs the whole check and writes nothing; it prints the translation status with the current markers and with the rewritten ones. {1} runs <b>the same check on every file</b> and only then writes: all or nothing. If a single key would change (a macro whose text contains the new delimiter, for example), or a file that holds old markers cannot be parsed, it writes nothing, lists the culprits and exits {2}. If a write fails halfway (permissions, a file locked by another program) it stops and lists what was and wasn't rewritten; the keys are the same either way, so <em>running the same command again finishes the job</em>. No sync runs afterwards: tables and caches catch up on your next one."
