pluralsanddates_1yioljz: "A counter that says \"1 file\" and \"5 files\" in every language, a date that reads right everywhere, and the warning that tells you a translation misses a plural form."
pluralsanddates_2fy7gy: "{0} formats a date for the language on screen. A string like {1} is a calendar date, not an instant, so <em>it never slips to the day before in a western time zone</em> (<2>time zones</2>)."
pluralsanddates_3do4qk: "Translate it with only the two forms you know from English, as a first attempt:"
pluralsanddates_3k97k8: "Nothing is missing, but one key does not cover every plural category Russian needs. <em>It is a warning, not an error: the missing forms fall back to {0} at run time.</em> Add the two forms it asks for, {1} and {2}:"
pluralsanddates_5kx4f4: "An <0>LLM</0> gets the same check: a reply that misses a plural category for the target language is rejected."
pluralsanddates_baat3: "English has two plural forms. Russian has four. Add it:"
pluralsanddates_dfbb72: "{0} picks a branch from the number in {1}. {2} matches exactly zero, {3} and {4} are the plural categories of English, and {5} stands for the number itself."
