price_sn605a: "What happens"
price_tcej28: "Each request sends a {0} of its own: the batch's expected output × 2.5, at least 1,024 and at most the class's {1}. <em>You pay for what the model writes, not for the limit</em>: the room is there because the estimate can be off — replies have come back at 1.3 times it in French and up to 1.8 in Chinese — and it follows the batch, so a runaway reply on a five-key batch stays cheap. It goes under the name in {2}; OpenAI's reasoning models want {3}."
price_thuw9: "Without prices: {0}"
price_tzmgvy: "Two hard ceilings close it sooner: the expected output tokens and the number of keys. Smaller batches mean fewer hallucinations, hence the smallest one that keeps the overhead low."
price_up47op: "<b>Line 3</b> — estimated tokens, the cost when prices are set, and the comparison with <0>{1}</0> when it is set."
price_v10mgk: "Some models think before they answer, and bill the thinking as output tokens under the same {0} as the reply. On the restaurant demo, {1} spent 78% of its output thinking, and every truncation came from there. The run measures it apart — from {2}, where the provider reports it — per key and per language, sizes the batches for it, and shows its share on the last line:"
price_ydn5di: "A reply that comes back <b>truncated</b> is never sent again as it was: the same question under the same limit would truncate again, and every attempt is billed. What came back complete is kept; the other keys go back to the model <b>in the same run</b>, in batches of at most half the size, for up to three rounds (100 → 50 → 25 → 12). Keys still cut off after that stay {0}, and a note under the panel says so. The truncated reply also calibrates the next run: the keys it brought back measure the reply, and its thinking, spread over the whole batch, is a floor — even when the model burned the whole {1} thinking and never got to the answer."
price_yrfndr: "The estimate converts characters to tokens with a fixed ratio on the first run: 4 characters per token, 1.5 when the <b>source</b> language is Chinese, Japanese or Korean. From then on it trusts what the provider's {0} reported — per model, and for the output per target language, split in two: the reply itself, and the thinking of a <1>reasoning model</1>, per key. Only the last ~300 keys of each language count, so a model that changes its ways shows up within a run."
