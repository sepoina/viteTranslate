preloading_c6op7g: "🎮 <0>Switching, live</0> — the status line shows {1} between {2} and {3}, while a language that isn't preloaded loads its chunk."
preloading_cy9iba: "A production build doesn't ship the source language just as a fallback: every compiled table is <b>self-contained</b>, each untranslated key already carrying the source text. An app that starts in {0} with {1} ships one table, not two."
preloading_k0xrc7: "<b>dev</b>"
preloading_m407v2: "Each language is a separate chunk loaded on demand, so it may not be ready on the <b>first</b> render. {0} has a built-in {1} boundary, and <em>neither path ever shows the wrong language</em>:"
preloading_pkkqow: "Without {0}, the container starts from the first eager language ({1}) — the same in dev and in build, on purpose. Starting from a language that isn't eager still works, but costs a round trip before the first paint; it is reported once in the console, in production too (in dev the source language is always eager, so the check would never fire there)."
