price_1oemlgj: "Cost needs both prices. Without them the same presets fall back to caps in tokens (input + output) — one unit at a time. An object overrides single fields on top of {0}: {1}, {2} (these two need prices), {3}, {4}. An explicit field always counts, in either unit. Anything else is a configuration error."
price_1ohpfmm: "The estimate always uses your prices. What the run spends uses the provider's own figure when it reports one — OpenRouter does, in {0} — for the last line, today's spend and the budget caps alike: through OpenRouter a batch can land on a pricier provider than the one you copied the prices from."
