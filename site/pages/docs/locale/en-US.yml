price_c58y6f: "Two separate ideas, two units. {0} is <b>your</b> spending, in <b>cost</b>. <1>{2}</1> says how much <b>the model</b> can take, in <b>tokens</b>, and sizes the batches. Keys, requests and characters are not caps."
