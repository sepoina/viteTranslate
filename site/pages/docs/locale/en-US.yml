price_90bmez: "A run that would exceed a cap is refused, and the message names the cap. {0} bypasses all four. If one is reached mid-run, the run stops but keeps everything already validated — <em>nothing already paid for is thrown away</em>. The day's totals are written after <b>every</b> request, so Ctrl+C doesn't reset today's spend."
