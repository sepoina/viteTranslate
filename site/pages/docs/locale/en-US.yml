translationfiles_1fjnly4: "A header comment (language name, tag, count of keys still missing, last-sync timestamp, format version) sits at the top, regenerated on every sync — never hand-edit it. Everything below it is text: the rest of the file holds nothing else."
translationfiles_1ldtag2: "<b>Atomic replacement.</b> A table is written to a temporary file ({0}) and renamed over the old one, so <em>a crash never leaves half a table</em>. If a crash leaves one of these temporary files behind, delete it."
translationfiles_1npo7k0: "The sync is the only thing that writes your tables, so it is careful:"
translationfiles_1p3j85i: "File format"
translationfiles_1u4t3tb: "Values are always double-quoted, one entry per line, no indentation. It is a <b>strict subset of YAML</b>: whatever this format accepts, a real YAML parser reads the same way, so your editor colours it and any YAML tool can read it. The subset is narrow on purpose — unquoted YAML scalars mangle exactly the text translators write ({0} is a syntax error, {1} truncates to {2}, {3} becomes the number {4}). Anything outside the subset is an error naming the <b>line number</b>, <em>not a plausible wrong value</em>."
translationfiles_2p6vq7: "Each language is one {0} file in {1}, named after its BCP 47 tag ({2}, {3}, …), holding the translation table as a flat map. The <b>source language</b> file is fully autogenerated from the markers found in your source — <em>you never hand-write it</em>. To add a language, see <4>Adding a language</4>."
translationfiles_ag80ux: "Coming from 3.x? Language files used to be JS modules: see <0>migrating from 3.x</0>."
translationfiles_fth1yh: "The .yml language files: their format, and what protects them while the sync rewrites them."
translationfiles_gsf4r5: "🧪 What that text looks like on screen — accents, emoji, CJK, quotes, backslashes, new lines: <0>real texts, live</0>."
translationfiles_h4afs3: "<b>No clobbering.</b> A file you saved while the sync was running is not overwritten: the sync stops with a message and you run it again."
translationfiles_ov9sxt: "<b>Backups.</b> Before a table is regenerated because it was corrupted ({0}), or before a suspicious mass deletion ({1}, one per language), the file is copied byte for byte — whatever its encoding. If a backup cannot be written, nothing is overwritten."
translationfiles_t5lj77: "What protects your files"
translationfiles_vt6wmr: "<b>All or nothing, before the first write.</b> Every file is read, planned and backed up before any table is replaced. One unreadable file, including a broken or inaccessible language symlink, <em>stops the whole sync with nothing changed</em>."
translationfiles_y304mw: "It is careful, not magic: the check is made just before each rename attempt, including Windows retries (a tiny window remains), there is no lock between processes, and several tables are replaced one after another, not as one transaction — see <0>limitations</0>. The messages and what to do are in <1>the CLI reference</1>."
