Signature_19q6eiq: "Trois plats que <i>nous ne retirons jamais</i> de la carte"
Signature_1b4j51v: "Les plats signature"
Signature_1diq83x: "Spaghettone aux crevettes rouges"
Signature_1gylm6c: "La recette de nonna Ada, restée identique depuis 1987 : tomates cerises, câpres, un filet d'huile et l'eau de mer qui donne son nom au plat."
Signature_1mvz9p8: "Dorade à l'acqua pazza"
Signature_gskjxa: "Le plat avec lequel Tommaso s'est présenté à la famille, au retour de Tokyo. La bisque cuit six heures ; les pâtes, onze minutes exactement."
Signature_qw37fu: "Nous avons essayé de les retirer, une fois. Pendant trois semaines, les hôtes les ont demandés quand même, et ils ont repris leur place."
Signature_uqjxui: "Peau croustillante comme une gaufrette, cœur à peine rosé. L'aigre-doux de l'oignon et la grenade en font le plat le plus commandé de l'été."
Signature_vc2g3n: "Tranche de sériole"
Story_13993y1: "Pêche du jour"
Story_17uk6p1: "Ce qui ne change pas"
Story_1f2hlmn: "D'un kiosque de fritures à <i>une table sur la mer</i>"
Story_1o9odjl: "Trois promesses, <i>chaque soir</i>"
Story_1ql9l2x: "Herbes aromatiques, tomates, artichauts et agrumes viennent de notre potager en terrasses à quatre kilomètres du port, cultivé sans chimie par Luca et Marta."
Story_1s7xuhu: "générations en cuisine"
Story_1wdd07a: "La nôtre est une cuisine de soustraction : peu d'ingrédients, des cuissons précises, des saveurs qui se reconnaissent les yeux fermés. Un plat est terminé quand il n'y a plus rien à enlever."
Story_1xwhcj: "étiquettes en cave"
Story_1yoimn2: "le premier kiosque sur le môle"
Story_1ywqlhg: "chef et patron"
Story_3lvahq: "« Le bon poisson n'a pas besoin d'être convaincu. Il a seulement besoin que personne ne le gâche. »"
Story_fgc6l5: "Trente-huit ans plus tard, les tables sont devenues soixante-quatre, l'ardoise est toujours accrochée près de la porte de la cuisine et la règle n'a pas changé d'un iota. Aux fourneaux, il y a Tommaso, le neveu, revenu à la maison après dix ans entre Paris, San Sebastián et Tokyo, avec une valise de techniques et la même faim de simplicité."
Story_gbg975: "Des pâtes étirées à la main chaque après-midi, des fonds qui cuisent pendant douze heures, du pain à levain naturel sorti du four deux fois par jour. Certaines choses ne peuvent pas être accélérées."
Story_lbyvhh: "Le potager sur la colline"
Story_oowwri: "Le temps juste"
Story_qybom0: "En 1987, nonna Ada faisait frire des anchois dans un kiosque en bois à dix mètres de l'eau. Elle avait quatre tables, une ardoise écrite à la craie et une seule règle : on ne cuisine que ce que la mer a apporté aujourd'hui."
Story_swm5o1: "ans sur le port"
Story_w5v20j: "Notre histoire"
Story_wfzdik: "bateaux de pêcheurs amis"
Story_zi6ys2: "Nous travaillons avec sept bateaux de la petite pêche locale. Pas d'élevage, pas de surgelés : si la mer est grosse, le menu se raccourcit, et nous vous le disons avec honnêteté."
Tasting_12iufd: "Trois routes différentes, une seule règle : faites-nous confiance et nous ne vous ferons jamais manger deux fois la même chose. Chaque parcours se termine par la petite pâtisserie et le café."
Tasting_1bpmnxc: "Mare aperto"
Tasting_1cv6xrc: "Une première dégustation de notre cuisine : le cru, une entrée chaude, un premier plat, un second plat et le dessert. Parfait pour ceux qui viennent nous voir pour la première fois."
