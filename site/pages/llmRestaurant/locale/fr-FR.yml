Cellar_18bgaoo: "Elle abrite 420 étiquettes, avec une prédilection affichée pour les blancs de mer et les petits producteurs de la côte. Irene, notre sommelière, vous guidera parmi les vermentinos de falaise, les bulles refermentées en bouteille et quelques raretés à garder de côté pour les occasions qui le méritent."
Cellar_1g02opt: "Amers, grappas et spiritueux de la côte, pour clore la soirée"
Cellar_1irml4d: "Notre cave était la grotte où les pêcheurs réparaient les filets, creusée dans le tuf juste sous la salle : quatorze degrés toute l'année, sans besoin d'installation."
