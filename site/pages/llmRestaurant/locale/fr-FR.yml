Reviews_1jdbu4g: "Lyon"
Reviews_1kreff3: "Nous avons fêté ici les soixante-dix ans de mon père : salle privée, menu sur mesure et un personnel qui nous a fait sentir comme chez nous dès la première minute."
Reviews_1mol6pe: "Service chaleureux et jamais envahissant. Irene nous a conseillé un vermentino dont je rêve encore. Nous reviendrons pour essayer le comptoir du chef."
Reviews_1qydt2l: "Munich"
Reviews_g2skyf: "Nous sommes arrivés pour le coucher du soleil et nous sommes partis à minuit sans nous en rendre compte. Le cru est le meilleur que j'aie mangé hors du Japon."
