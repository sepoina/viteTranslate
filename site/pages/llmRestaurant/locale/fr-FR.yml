Faq_10hgh1e: "Bien sûr, et nous vous demandons de le faire dès la réservation. La cuisine gère la maladie cœliaque, les allergies aux crustacés et aux fruits à coque avec des lignes de préparation séparées : dites-le-nous et nous nous organisons."
Faq_10p2hjj: "Y a-t-il des propositions végétariennes ?"
Faq_1541b7u: "Aucun. Nous sommes sur le port : les tongs au déjeuner sont de mise, la chemise au dîner est appréciée mais pas obligatoire."
Faq_1bbk3wf: "Puis-je venir avec mon chien ?"
Faq_1dko3l6: "Y a-t-il un dress code ?"
Faq_1ee6zlb: "Vous pouvez annuler ou déplacer la réservation gratuitement jusqu'à 24 heures avant. Pour le comptoir du chef et pour les groupes, nous demandons un acompte, restitué si vous prévenez dans les 72 heures."
Faq_1iyv0dq: "Comment fonctionne l'annulation ?"
Faq_1m3xud1: "Vous ne trouvez pas la réponse que vous cherchez ? Écrivez-nous ou appelez-nous : en salle, il y a toujours quelqu'un heureux de vous raconter le restaurant."
Faq_1vyqrgy: "Toujours. Nous avons des chaises hautes, des feuilles et des crayons, et un petit menu avec des pâtes à la tomate, une escalope de poisson et de la glace. Pour les plus petits, la salle intérieure est le choix le plus pratique."
Faq_40nikn: "Questions fréquentes"
Faq_jbfem8: "Les enfants sont-ils les bienvenus ?"
Faq_kkk6d1: "Chaque section de la carte a au moins un plat végétarien, construit sur le potager et non comme un pis-aller. Pour un menu dégustation entièrement végétarien, un jour de préavis suffit."
Faq_ks01fe: "En terrasse oui, avec plaisir : un bol d'eau arrivera avant même le menu. En salle intérieure, par respect pour les autres convives, nous préférons éviter."
Faq_u3t3ow: "Puis-je signaler des allergies et des intolérances ?"
