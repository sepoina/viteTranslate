Events_13gb797: "Anniversaires, dîners d'entreprise, mariages intimes : nous construisons le menu avec vous, à partir de la pêche de la semaine et de ce qui vous plaît. Nous nous occupons aussi des fleurs, de la musique et du gâteau."
Events_1jr6sd7: "La Sala delle Reti"
Events_1xbzy80: "Jusqu'à 60 convives debout, pour des apéritifs, des anniversaires et des cérémonies avec le soleil qui se couche sur le golfe."
