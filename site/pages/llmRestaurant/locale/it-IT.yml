Story_13993y1: "Pescato del giorno"
Story_17uk6p1: "Quello che non cambia"
Story_1f2hlmn: "Da un chiosco di fritture a <i>una tavola sul mare</i>"
Story_1o9odjl: "Tre promesse, <i>ogni sera</i>"
Story_1ql9l2x: "Erbe aromatiche, pomodori, carciofi e agrumi arrivano dal nostro orto terrazzato a quattro chilometri dal porto, coltivato senza chimica da Luca e Marta."
Story_1s7xuhu: "generazioni in cucina"
Story_1wdd07a: "La nostra è una cucina di sottrazione: pochi ingredienti, cotture precise, sapori che si riconoscono a occhi chiusi. Un piatto è finito quando non c'è più niente da togliere."
Story_1xwhcj: "etichette in cantina"
Story_1yoimn2: "il primo chiosco sul molo"
Story_1ywqlhg: "chef e patron"
Story_3lvahq: "«Il pesce buono non ha bisogno di essere convinto. Ha solo bisogno che nessuno lo rovini.»"
Story_fgc6l5: "Trentotto anni dopo i tavoli sono diventati sessantaquattro, la lavagna è ancora appesa accanto alla porta della cucina e la regola non è cambiata di una virgola. Ai fornelli c'è Tommaso, il nipote, tornato a casa dopo dieci anni tra Parigi, San Sebastián e Tokyo con una valigia di tecniche e la stessa fame di semplicità."
Story_gbg975: "Paste tirate a mano ogni pomeriggio, fondi che cuociono per dodici ore, pane a lievitazione naturale sfornato due volte al giorno. Certe cose non si possono accelerare."
Story_lbyvhh: "L'orto sulla collina"
Story_oowwri: "Il tempo giusto"
Story_qybom0: "Nel 1987 nonna Ada friggeva acciughe in un chiosco di legno a dieci metri dall'acqua. Aveva quattro tavoli, una lavagna scritta col gesso e una regola sola: si cucina soltanto quello che il mare ha portato oggi."
Story_swm5o1: "anni sul porto"
Story_w5v20j: "La nostra storia"
Story_wfzdik: "barche di pescatori amici"
Story_zi6ys2: "Lavoriamo con sette barche della piccola pesca locale. Niente allevamenti, niente surgelati: se il mare è grosso il menù si accorcia, e ve lo diciamo con onestà."
Tasting_12iufd: "Tre rotte diverse, un'unica regola: vi fidate di noi e noi non vi facciamo mai mangiare due volte la stessa cosa. Ogni percorso si chiude con la piccola pasticceria e il caffè."
Tasting_1bpmnxc: "Mare aperto"
Tasting_1cv6xrc: "Un primo assaggio della nostra cucina: il crudo, un antipasto caldo, un primo, un secondo e il dolce. Perfetto per chi ci viene a trovare per la prima volta."
