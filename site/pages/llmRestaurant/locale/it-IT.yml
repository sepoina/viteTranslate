Faq_1dko3l6: "C'è un dress code?"
Faq_1ee6zlb: "Potete cancellare o spostare la prenotazione gratuitamente fino a 24 ore prima. Per il bancone dello chef e per i gruppi chiediamo una caparra, restituita se avvisate entro 72 ore."
Faq_1iyv0dq: "Come funziona la cancellazione?"
Faq_1m3xud1: "Non trovate la risposta che cercate? Scriveteci o chiamateci: in sala c'è sempre qualcuno felice di raccontarvi il ristorante."
Faq_1vyqrgy: "Sempre. Abbiamo seggioloni, fogli e pastelli, e un piccolo menù con la pasta al pomodoro, la cotoletta di pesce e il gelato. Per i più piccoli la sala interna è la scelta più comoda."
