Faq_10hgh1e: "Certo, e vi chiediamo di farlo già al momento della prenotazione. La cucina gestisce celiachia, allergie ai crostacei e alla frutta secca con linee di preparazione separate: ditecelo e ci organizziamo."
Faq_10p2hjj: "Ci sono proposte vegetariane?"
Faq_1541b7u: "Nessuno. Siamo sul porto: le infradito a pranzo sono di casa, la camicia a cena è gradita ma non obbligatoria."
