Faq_jbfem8: "I bambini sono i benvenuti?"
Faq_kkk6d1: "Ogni sezione della carta ha almeno un piatto vegetariano, costruito sull'orto e non come ripiego. Per un menù degustazione interamente vegetariano basta un giorno di preavviso."
Faq_ks01fe: "In terrazza sì, con piacere: arriverà una ciotola d'acqua prima ancora del menù. In sala interna, per rispetto degli altri ospiti, preferiamo di no."
