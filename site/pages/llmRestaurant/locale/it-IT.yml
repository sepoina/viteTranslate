Cellar_18bgaoo: "Custodisce 420 etichette, con una predilezione dichiarata per i bianchi di mare e i piccoli produttori della costa. Irene, la nostra sommelier, vi guiderà tra vermentini di scogliera, bollicine rifermentate in bottiglia e qualche rarità da tenere da parte per le occasioni che se lo meritano."
