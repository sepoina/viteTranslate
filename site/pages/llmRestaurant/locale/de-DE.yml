Reviews_1kreff3: "Wir haben hier den siebzigsten Geburtstag meines Vaters gefeiert: privater Saal, maßgeschneidertes Menü und ein Personal, das uns vom ersten Moment an wie zu Hause fühlen ließ."
Reviews_1mol6pe: "Warmer und nie aufdringlicher Service. Irene hat uns einen Vermentino empfohlen, von dem ich noch heute träume. Wir kommen wieder, um den Chefkoch-Tresen zu probieren."
Reviews_1qydt2l: "München"
Reviews_g2skyf: "Wir kamen für den Sonnenuntergang und gingen um Mitternacht, ohne es zu merken. Das Crudo ist das beste, das ich außerhalb Japans gegessen habe."
