Cellar_18bgaoo: "Sie beherbergt 420 Etiketten, mit einer erklärten Vorliebe für Meeresweißweine und kleine Produzenten der Küste. Irene, unsere Sommelière, führt Sie durch Vermentini von der Klippe, in der Flasche nachvergorene Perlen und manche Rarität, die man für die Anlässe aufspart, die es verdienen."
