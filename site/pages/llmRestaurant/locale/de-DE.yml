Faq_10hgh1e: "Natürlich, und wir bitten Sie, es bereits bei der Reservierung anzugeben. Die Küche handhabt Zöliakie, Krustentier- und Nussallergien mit getrennten Zubereitungslinien: Sagen Sie es uns, und wir organisieren uns."
Faq_10p2hjj: "Gibt es vegetarische Angebote?"
Faq_1541b7u: "Keinen. Wir sind am Hafen: Flip-Flops zum Mittagessen sind hier üblich, ein Hemd zum Abendessen ist willkommen, aber nicht Pflicht."
Faq_1bbk3wf: "Darf ich meinen Hund mitbringen?"
Faq_1dko3l6: "Gibt es einen Dresscode?"
Faq_1ee6zlb: "Sie können die Reservierung bis 24 Stunden vorher kostenlos stornieren oder verschieben. Für die Kochtheke und für Gruppen bitten wir um eine Anzahlung, die zurückerstattet wird, wenn Sie uns innerhalb von 72 Stunden Bescheid geben."
Faq_1iyv0dq: "Wie funktioniert die Stornierung?"
Faq_1m3xud1: "Sie finden die Antwort nicht, die Sie suchen? Schreiben Sie uns oder rufen Sie an: Im Gastraum ist immer jemand, der Ihnen gerne vom Restaurant erzählt."
Faq_1vyqrgy: "Immer. Wir haben Hochstühle, Blätter und Stifte sowie ein kleines Menü mit Pasta mit Tomatensauce, Fischkotelett und Eis. Für die Kleinsten ist der Innenraum die bequemste Wahl."
Faq_40nikn: "Häufige Fragen"
Faq_jbfem8: "Sind Kinder willkommen?"
Faq_kkk6d1: "Jeder Abschnitt der Karte hat mindestens ein vegetarisches Gericht, auf Basis des Gartens und nicht als Notlösung. Für ein vollständig vegetarisches Degustationsmenü genügt ein Tag Vorlauf."
Faq_ks01fe: "Auf der Terrasse ja, gerne: Eine Wasserschüssel kommt noch vor der Karte. Im Innenraum bitten wir darum, auf die anderen Gäste Rücksicht zu nehmen, lieber nicht."
