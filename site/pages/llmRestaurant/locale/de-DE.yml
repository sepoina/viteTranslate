Tasting_q8z4x9: "Diesen Weg reservieren"
Tasting_r4v4s2: "Der komplette Weg der Saison, mit zwei Gerichten außerhalb der Karte, die jede Woche aus dem Fang erfunden werden. Es ist das Menü, das Tommaso für sich selbst bestellen würde."
Tasting_vp2dyl: "pro Person"
Tasting_z3dj42: "Nur am Küchentresen, höchstens sechs Gäste pro Abend. Vor Ihnen wird gekocht, was das Meer an diesem Tag entschieden hat, ohne geschriebene Karte."
