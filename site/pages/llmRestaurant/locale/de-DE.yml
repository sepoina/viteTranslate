Signature_1gylm6c: "Das Rezept von nonna Ada, seit 1987 unverändert: Kirschtomaten, Kapern, ein Faden Öl und das Meerwasser, das dem Gericht seinen Namen gibt."
Signature_1mvz9p8: "Goldbrasse all'acqua pazza"
Signature_gskjxa: "Das Gericht, mit dem sich Tommaso der Familie vorstellte, nach seiner Rückkehr aus Tokio. Die Bisque köchelt sechs Stunden; die Pasta genau elf Minuten."
Signature_qw37fu: "Wir haben einmal versucht, sie wegzunehmen. Drei Wochen lang fragten die Gäste trotzdem nach ihnen, und sie kehrten an ihren Platz zurück."
Signature_uqjxui: "Knusprige Haut wie eine Waffel, innen zart rosa. Das Süß-Saure der Zwiebel und der Granatapfel machen es zum meistbestellten Hauptgang des Sommers."
