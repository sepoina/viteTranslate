Story_17uk6p1: "Was sich nicht ändert"
Story_1f2hlmn: "Von einem Frittierstand zu <i>einer Tafel am Meer</i>"
Story_1o9odjl: "Drei Versprechen, <i>jeden Abend</i>"
Story_1ql9l2x: "Kräuter, Tomaten, Artischocken und Zitrusfrüchte kommen aus unserem terrassierten Garten vier Kilometer vom Hafen entfernt, von Luca und Marta ohne Chemie angebaut."
Story_1s7xuhu: "Generationen in der Küche"
Story_1wdd07a: "Unsere ist eine Küche der Wegnahme: wenige Zutaten, präzise Garzeiten, Aromen, die man mit geschlossenen Augen erkennt. Ein Gericht ist fertig, wenn nichts mehr wegzunehmen ist."
Story_1xwhcj: "Etiketten im Weinkeller"
Story_1yoimn2: "der erste Kiosk am Kai"
Story_1ywqlhg: "Küchenchef und Patron"
Story_3lvahq: "„Guter Fisch muss nicht überzeugt werden. Er braucht nur jemanden, der ihn nicht verdirbt.“"
Story_fgc6l5: "Achtunddreißig Jahre später sind aus den Tischen vierundsechzig geworden, die Tafel hängt noch immer neben der Küchentür, und die Regel hat sich kein Jota geändert. Am Herd steht Tommaso, der Enkel, zurückgekehrt nach zehn Jahren zwischen Paris, San Sebastián und Tokio mit einem Koffer voller Techniken und demselben Hunger nach Einfachheit."
Story_gbg975: "Jeden Nachmittag von Hand gezogene Pasta, Fonds, die zwölf Stunden köcheln, Sauerteigbrot, das zweimal täglich aus dem Ofen kommt. Manches lässt sich nicht beschleunigen."
Story_lbyvhh: "Der Gemüsegarten auf dem Hügel"
Story_oowwri: "Die richtige Zeit"
Story_qybom0: "1987 briet Nonna Ada Sardellen in einem Holzkiosk zehn Meter vom Wasser entfernt. Sie hatte vier Tische, eine mit Kreide beschriebene Tafel und nur eine Regel: Gekocht wird nur, was das Meer heute gebracht hat."
Story_swm5o1: "Jahre am Hafen"
Story_w5v20j: "Unsere Geschichte"
Story_wfzdik: "Boote befreundeter Fischer"
Story_zi6ys2: "Wir arbeiten mit sieben Booten der kleinen lokalen Fischerei. Keine Zucht, keine Tiefkühlware: Ist die See rau, wird die Karte kürzer, und das sagen wir Ihnen ehrlich."
Tasting_12iufd: "Drei verschiedene Routen, eine einzige Regel: Sie vertrauen uns, und wir lassen Sie nie zweimal dasselbe essen. Jeder Weg endet mit dem kleinen Gebäck und dem Kaffee."
Tasting_1bpmnxc: "Mare aperto"
Tasting_1cv6xrc: "Ein erster Vorgeschmack auf unsere Küche: der Rohe, eine warme Vorspeise, ein erster Gang, ein zweiter Gang und das Dessert. Perfekt für alle, die uns zum ersten Mal besuchen."
