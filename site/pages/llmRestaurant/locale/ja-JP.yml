Story_wfzdik: "仲間の漁師の船"
Story_zi6ys2: "地元の小型漁業の七隻の船と仕事をしています。養殖はなく、冷凍もありません。海が荒れればメニューは短くなります。そのことは正直にお伝えします。"
Tasting_12iufd: "三つの異なる航路、ただ一つのルール。私たちを信頼してください。同じものを二度お出しすることは決してありません。それぞれのコースは小さな焼き菓子とコーヒーで締めくくられます。"
Tasting_1bpmnxc: "Mare aperto"
Tasting_1cv6xrc: "私たちの料理の最初の味見：生魚、温かい前菜、プリモ、セコンド、そしてドルチェ。初めてお越しになる方にぴったりです。"
