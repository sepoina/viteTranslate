Faq_10hgh1e: "もちろんです。ご予約の際にお知らせいただくようお願いしております。厨房では、セリアック病、甲殻類アレルギー、ナッツ類アレルギーに別々の調理ラインで対応しています。お知らせいただければ調整いたします。"
Faq_10p2hjj: "ベジタリアン向けのメニューはありますか？"
Faq_1541b7u: "ありません。当店は港にありますので、ランチ時のビーチサンダルは普通のことです。ディナーでのシャツは歓迎いたしますが、必須ではございません。"
Faq_1bbk3wf: "犬を連れて行くことはできますか？"
Faq_1dko3l6: "ドレスコードはありますか？"
Faq_1ee6zlb: "ご予約は24時間前まで無料でキャンセルまたは変更いただけます。シェフズカウンターおよびグループの場合は、デポジットをお願いしております。72時間前までにご連絡いただければ返金いたします。"
Faq_1iyv0dq: "キャンセルはどのように行いますか？"
Faq_1m3xud1: "お探しの答えが見つかりませんか？メールまたはお電話でお問い合わせください。店内には、レストランについて喜んでお話しするスタッフがいつもおります。"
Faq_1vyqrgy: "もちろんです。ベビーチェア、紙とクレヨンをご用意しており、トマトソースのパスタ、魚のカツレツ、ジェラートのお子さま向け小さなメニューもございます。小さなお子さまには、屋内のダイニングルームが一番ご利用いただきやすいお席です。"
Faq_40nikn: "よくあるご質問"
Faq_jbfem8: "お子さまも歓迎ですか？"
Faq_kkk6d1: "メニューのどのセクションにも、消去法ではなく菜園を主役にしたベジタリアン料理が少なくとも一品ございます。完全にベジタリアンのテイスティングメニューは、前日までにお知らせいただければ承ります。"
Faq_ks01fe: "テラス席では喜んで承ります。メニューより先に水の器をお持ちします。屋内のダイニングルームでは、他のお客さまのご迷惑となりますので、ご遠慮いただいております。"
