Cellar_18bgaoo: "420種類のラベルを蔵し、海の白ワインと海岸の小さな生産者をことのほか愛しております。当店のソムリエ、Ireneが、岩礁のヴェルメンティーノ、瓶内二次発酵の泡、そして特別な日に取っておきたくなるような希少な一本へとご案内いたします。"
