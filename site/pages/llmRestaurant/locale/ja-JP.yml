Story_1o9odjl: "三つの約束、<i>毎晩</i>"
Story_1ql9l2x: "ハーブ、トマト、アーティチョーク、柑橘類は、港から4キロ離れた私たちの段々畑の菜園から届きます。ルカとマルタが化学薬品を使わずに育てています。"
Story_1s7xuhu: "厨房の世代"
Story_1wdd07a: "私たちの料理は引き算の料理です。少ない食材、正確な火入れ、目を閉じてもわかる味。引くものが何もなくなったとき、一皿は完成します。"
Story_1xwhcj: "ワインセラーのラベル"
Story_1yoimn2: "桟橋の最初の屋台"
Story_1ywqlhg: "シェフ兼オーナー"
Story_3lvahq: "「良い魚は説得を必要としない。ただ、誰にも台無しにされないことだけを必要としている。」"
Story_fgc6l5: "38年後、テーブルは64席になり、黒板は今も厨房の扉の横に掛かったままで、その決まりごとは一言も変わっていません。厨房に立つのは甥のTommaso。パリ、サン・セバスティアン、東京での10年を経て家に戻り、技術を詰め込んだスーツケースと、素朴さへの変わらぬ飢えを携えています。"
Story_gbg975: "毎午後、手打ちのパスタ。12時間煮込む出汁。1日2回焼き上げる天然酵母のパン。急ぐことのできないものがあります。"
Story_lbyvhh: "丘の上の菜園"
Story_oowwri: "ちょうどよい時間"
Story_qybom0: "1987年、nonna Adaは海から10メートルの木の屋台でアンチョビを揚げていました。テーブルは4つ、チョークで書いた黒板、そしてたった一つの決まりごと――今日、海がもたらしたものだけを料理すること。"
