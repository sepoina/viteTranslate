Story_13993y1: "Catch of the day"
Story_17uk6p1: "What never changes"
Story_1f2hlmn: "From a fried-fish kiosk to <i>a table on the sea</i>"
Story_1o9odjl: "Three promises, <i>every evening</i>"
Story_1ql9l2x: "Aromatic herbs, tomatoes, artichokes and citrus fruits come from our terraced garden four kilometers from the port, farmed without chemicals by Luca and Marta."
Story_1s7xuhu: "generations in the kitchen"
Story_1wdd07a: "Ours is a cuisine of subtraction: few ingredients, precise cooking, flavors you recognize with your eyes closed. A dish is finished when there is nothing left to take away."
Story_1xwhcj: "labels in the cellar"
Story_1yoimn2: "the first kiosk on the pier"
Story_1ywqlhg: "chef and owner"
Story_3lvahq: "“Good fish doesn't need to be persuaded. It just needs no one to ruin it.”"
Story_fgc6l5: "Thirty-eight years later the tables have become sixty-four, the chalkboard still hangs beside the kitchen door and the rule hasn't changed one bit. At the stove is Tommaso, the grandson, back home after ten years between Paris, San Sebastián and Tokyo with a suitcase of techniques and the same hunger for simplicity."
Story_gbg975: "Pasta rolled by hand every afternoon, stocks simmered for twelve hours, naturally leavened bread baked twice a day. Some things can't be rushed."
Story_lbyvhh: "The garden on the hill"
Story_oowwri: "Just the right time"
Story_qybom0: "In 1987 grandma Ada fried anchovies in a wooden kiosk ten meters from the water. She had four tables, a chalkboard written in chalk and one rule: we cook only what the sea brought today."
Story_swm5o1: "years on the harbor"
Story_w5v20j: "Our story"
Story_wfzdik: "boats of fisherman friends"
Story_zi6ys2: "We work with seven boats from the local small-scale fishery. No farms, no frozen fish: if the sea is rough the menu gets shorter, and we tell you so honestly."
Tasting_12iufd: "Three different routes, one rule: you trust us and we never serve you the same thing twice. Every journey ends with the small pastries and coffee."
