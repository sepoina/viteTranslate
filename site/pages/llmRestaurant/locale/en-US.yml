Cellar_18bgaoo: "It holds 420 labels, with a declared fondness for coastal whites and small producers along the shore. Irene, our sommelier, will guide you through cliffside vermentinos, bottle-fermented sparkling wines and a few rarities to set aside for occasions that deserve them."
