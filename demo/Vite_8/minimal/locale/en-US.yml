App_1u2wczc: "Good type is invisible until it fails. A well-set paragraph guides the eye down the page without ever asking for attention, balancing measure, leading and contrast so the reader forgets there was a choice at all."
App_1vgk6pt: "\"Type is a beautiful group of letters, not a group of beautiful letters. The space between them matters just as much as the shapes.\""
