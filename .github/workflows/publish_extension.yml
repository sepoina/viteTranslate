name: Publish extension

# L'estensione per l'editor (packages/idePlugin/) su Open VSX e sul Visual Studio Marketplace. Workflow a
# sé, staccato da publish.yml, e solo a mano (Actions → Publish extension → Run workflow): lo si
# lancia quando la libreria che l'estensione richiede è già su npm (vedi "Controlli").
# Così niente gara con publish.yml quando un push alza insieme libreria ed estensione.
#
# Autenticazione: trusted publishing OIDC su entrambi i registri, nessun token salvato nel repo.
# - Open VSX: `ovsx publish --trusted-publishing` (OVSX nel job). Il criterio c'è dal 21/10/2026
#   (open-vsx.org → Settings → Trusted Publishers: sepoina/viteTranslate, questo file, nessun
#   environment). Si lega al nome del file: rinominarlo vuol dire cancellarlo e rifarlo lì.
# - Marketplace: `vsce publish --oidc` (VSCE nel job), solo con la variabile di repo
#   MARKETPLACE_OIDC = true (Settings → Secrets and variables → Actions → Variables). A ottobre
#   2026 il Marketplace non lo accetta ancora (TrustedPublishingNotSupportedException,
#   microsoft/vscode-vsce#1275) e non c'è dove creare il criterio: finché la variabile manca lo
#   step si salta, e il .vsix si carica a mano con `npm run ide:release` in locale, DOPO questo
#   workflow (il suo "Controlli" si ferma se la versione è già sul Marketplace). Quando Microsoft
#   lo attiva: criterio per sepoina/viteTranslate e questo file, poi la variabile. Nessun ripiego
#   su un PAT: quelli globali smettono di funzionare l'1/12/2026.
on:
  workflow_dispatch:

jobs:
  publish-extension:
    runs-on: ubuntu-latest
    permissions:
      contents: write # il tag ide-vX.Y.Z
      id-token: write # il token OIDC che ovsx e vsce scambiano coi registri
    concurrency:
      group: vsce-publish
      cancel-in-progress: false
    # Il vsce del publish (controlli e package passano da code.mjs, col suo @3). Non "@4": la 4.0.0
    # di latest scambia il token OIDC col protocollo vecchio e il Marketplace risponde 400 ("No
    # api-version was supplied"). Quello finale (api-version, FederatedToken) c'è dalla 4.0.1-1,
    # ancora pre-release: microsoft/vscode-vsce@c960f2e. Il range prende oggi la 4.0.1-3, e da
    # solo la 4.0.1 stabile, o una successiva, quando esce.
    # L'ovsx del publish su Open VSX: --trusted-publishing c'è dalla 1.2.0, la 1 prende l'ultima.
    env:
      VSCE: "@vscode/vsce@^4.0.1-3"
      OVSX: "ovsx@1"
    steps:
      - uses: actions/checkout@v6

      # Node 24: @vscode/vsce 4 e ovsx 1.3 ne chiedono almeno 22.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # Tutto letto da packages/idePlugin/package.json, l'unico posto in cui vive. L'id sul Marketplace è
      # <publisher>.<name>; il nome del .vsix è quello che dà scripts/code.mjs.
      # LINKED-DATA: dist/vsix_release/ è VSIX in packages/idePlugin/scripts/code.mjs.
      - name: Nome e versione dell'estensione
        id: meta
        working-directory: packages/idePlugin
        run: |
          NAME=$(node -p "require('./package.json').name")
          PUBLISHER=$(node -p "require('./package.json').publisher")
          VERSION=$(node -p "require('./package.json').version")
          echo "Estensione: $PUBLISHER.$NAME@$VERSION"
          echo "id=$PUBLISHER.$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "vsix=packages/idePlugin/dist/vsix_release/$NAME-$VERSION.vsix" >> "$GITHUB_OUTPUT"

      # Si può pubblicare? Commit pulito, versione non ancora sul Marketplace, libreria su npm
      # (AGENTS.md, "REGOLE DI RILASCIO": latest, e anche next finché l'estensione è in preview).
      # Lo stesso controllo di `npm run ide:release` in locale: le regole stanno in code.mjs, una
      # volta sola. Prima di npm install, apposta: usa solo Node, git, npm e npx.
      - name: Controlli
        run: node packages/idePlugin/scripts/code.mjs check

      # Un solo npm install alla radice: idePlugin è un workspace, e rolldown, codicons e i
      # sorgenti di lib/ che il bundle si porta dentro stanno lì.
      - name: Install deps
        run: npm install

      # I test dell'estensione e quello dell'ingresso ./ide/scan che Results legge: gli stessi di
      # `npm run ide:release`.
      - name: Test
        run: node packages/idePlugin/scripts/code.mjs test

      # La stessa strada del .vsix fatto in locale: build e vsce package --no-dependencies.
      - name: Package
        run: npm run ide:package

      - name: Upload .vsix
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.id }}-${{ steps.meta.outputs.version }}
          path: ${{ steps.meta.outputs.vsix }}
          retention-days: 30

      # Prima Open VSX, che funziona: se un giorno fallisse il Marketplace, Open VSX è già fatto.
      # Pubblica il .vsix appena fatto, senza rifarlo. Una versione già lì fa fallire lo step: la
      # stessa guardia di "Controlli" per il Marketplace.
      - name: Publish Open VSX (trusted publishing OIDC, nessun token)
        run: npx --yes "$OVSX" publish --trusted-publishing --packagePath "${{ steps.meta.outputs.vsix }}"

      # $VSCE (vedi env del job) e non il @3 di scripts/code.mjs: --oidc c'è solo dalla 4. Solo con
      # MARKETPLACE_OIDC = true: vedi l'intestazione.
      - name: Publish Marketplace (trusted publishing OIDC, nessun token)
        if: vars.MARKETPLACE_OIDC == 'true'
        run: npx --yes "$VSCE" publish --oidc --packagePath "${{ steps.meta.outputs.vsix }}"

      # Senza l'interruttore il Marketplace resta da fare a mano: lo dice il riepilogo della run.
      - name: Marketplace a mano
        if: vars.MARKETPLACE_OIDC != 'true'
        run: |
          {
            echo "### Marketplace: upload by hand"
            echo "Open VSX is done. The Marketplace step was skipped (repo variable \`MARKETPLACE_OIDC\` is not \`true\`)."
            echo "From this commit, locally: \`npm run ide:release\`, then upload the .vsix it shows."
          } >> "$GITHUB_STEP_SUMMARY"

      # Segna il commit pubblicato. Prefisso "ide-": i "vX.Y.Z" sono della libreria. Niente
      # release GitHub, come per il launcher in publish.yml: diventerebbe la "Latest" del repo al
      # posto di quella della libreria. Tag leggero: basta a ritrovare il commit, e non chiede
      # un'identità git.
      - name: Tag git
        env:
          TAG: ide-v${{ steps.meta.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Il tag $TAG c'è già."
            exit 0
          fi
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
