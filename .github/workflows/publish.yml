name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Aggiorna npm (richiesto per OIDC)
        run: npm install -g npm@latest
      - name: Install deps
        run: npm ci
      - name: Publish
        run: npm publish --access public