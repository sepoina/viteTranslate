name: Build, publish & deploy

# Un solo workflow al posto di due, per condividere il lavoro che pubblicazione e deploy
# facevano ciascuno per conto proprio (npm install + npm run build alla radice). "publish" ne
# esce alleggerito parecchio: non installa più nulla, gli basta l'artefatto del job "build".
# "deploy-pages" NON può fare lo stesso — vedi il commento lì sopra — quindi lì resta la
# doppia spesa, per una ragione precisa, non per distrazione.
#
# Nessun filtro sui path in ingresso: gira a ogni push su main, e la pubblicazione decide da
# sola se c'è qualcosa da fare (vedi "Versione già pubblicata?" nel job "publish", e lo stesso
# step in "publish-launcher" per il secondo pacchetto, launcher/). Se non hai
# cambiato la versione, npm non fa niente — è la stessa garanzia di prima, non più legata al
# fatto che il push tocchi package.json.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm install

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Solo lib/dist: è l'unica cosa che "publish" non ha già dal proprio checkout (il resto
      # di lib/ è sorgente versionato). node_modules non viaggia con l'artefatto: zippare e
      # dezippare ~90 MB di pacchetti, bit di eseguibilità dei binari compresi, è un rischio
      # che qui non serve correre — "publish" non ne ha bisogno (vedi sotto), e "deploy-pages"
      # deve comunque installarli per conto suo.
      - name: Upload lib/dist
        uses: actions/upload-artifact@v4
        with:
          name: lib-dist
          path: lib/dist
          retention-days: 1

  # Ogni commit/push su main che supera "build" prova a pubblicare. Una versione stabile
  # (4.6.0) va su "latest", diventa una release GitHub e porta "next" con sé; una pre-release
  # (4.6.0-rc.1, 4.6.0-beta.2: c'è un "-") va su "next" e riceve solo il tag git, niente release.
  # La versione pubblicata trasporta il campo versionDescription, scritto a mano in
  # package.json, che diventa anche il titolo/le note della release.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # serve per creare tag e release
      id-token: write
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download lib/dist
        uses: actions/download-artifact@v4
        with:
          name: lib-dist
          path: lib/dist

      - name: Aggiorna npm (richiesto per trusted publishing OIDC)
        run: npm install -g npm@latest

      - name: Rilascio
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DESC=$(node -p "require('./package.json').versionDescription || 'nessuna nota'")
          echo "Pubblicazione v$VERSION - $DESC"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Una pre-release (4.6.0-rc.1, 4.6.0-beta.2: tutto ciò che ha un "-") va sul dist-tag
          # "next", non su "latest": chi fa npm install senza chiedere la rc non se la ritrova.
          # npm 11 del resto rifiuta di pubblicare una pre-release senza un --tag esplicito.
          case "$VERSION" in
            *-*) echo "disttag=next" >> "$GITHUB_OUTPUT"; echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "disttag=latest" >> "$GITHUB_OUTPUT"; echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          {
            echo "desc<<__EOF__"
            echo "$DESC"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Versione già pubblicata?
        id: check
        run: |
          if npm view "@sepoina/vitetranslate@${{ steps.meta.outputs.version }}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # --ignore-scripts: "prepare" (npm run build) non deve ripartire qui. Non ci sono
      # node_modules in questo job — l'unica cosa scaricata è lib/dist — quindi ripartirebbe
      # comunque a vuoto, fallendo su "rolldown: command not found".
      - name: Publish (trusted publishing OIDC, nessun token)
        if: steps.check.outputs.published == 'false'
        run: npm publish --access public --ignore-scripts --tag ${{ steps.meta.outputs.disttag }}

      # Tag e release si controllano separatamente: "npm run release" (npm version + push
      # --follow-tags) il tag lo pusha da sé, prima che questo job parta. Guardando solo il tag,
      # una versione stabile rilasciata così resterebbe senza release GitHub.
      - name: Tag o release già presenti?
        id: gh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=false" >> "$GITHUB_OUTPUT"
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      # Solo le versioni stabili finiscono nella lista delle release. Se il tag c'è già (pushato
      # da "npm run release") gh lo riusa e --target non conta; se non c'è, lo crea su questo commit.
      - name: Release GitHub (versione stabile)
        if: steps.meta.outputs.prerelease == 'false' && steps.gh.outputs.release == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          DESC: ${{ steps.meta.outputs.desc }}
        run: |
          printf '%s\n\nnpm: https://www.npmjs.com/package/@sepoina/vitetranslate/v/%s\n' \
            "$DESC" "$VERSION" > release-notes.md
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION — $DESC" \
            --notes-file release-notes.md

      # Una rc o una beta resta un tag e basta: segna il commit, ma nella lista delle release
      # non compare. Tag leggero: basta a ritrovare il commit, e non chiede un'identità git.
      - name: Tag git (pre-release)
        if: steps.meta.outputs.prerelease == 'true' && steps.gh.outputs.tag == 'false'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/v$VERSION"

      # Chi dipende da "next" deve ricevere la stabile appena esce: dopo la 4.6.0, "next" non
      # può restare fermo su 4.6.0-rc.1. Lo si sposta solo in avanti, però: se "next" punta già
      # a una pre-release più nuova (4.7.0-beta.1 mentre esce la correzione 4.6.1), resta lì.
      #
      # Ultimo step apposta: il trusted publishing OIDC vale solo per npm publish, non per
      # npm dist-tag, quindi qui serve un token classico — il secret NPM_DISTTAG_TOKEN (granular
      # access token, Read and write sul solo @sepoina/vitetranslate). Senza, lo step non fallisce:
      # lascia un avviso con il comando da lanciare a mano.
      - name: Sposta "next" sulla stabile
        if: steps.meta.outputs.prerelease == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_DISTTAG_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          PKG="@sepoina/vitetranslate"
          NEXT=$(npm view "$PKG" dist-tags.next 2>/dev/null || true)
          # exit 0 = "next" manca o è più vecchio di VERSION; a parità di X.Y.Z una pre-release
          # è più vecchia della stabile, come vuole semver.
          if ! node -e '
            const [next, stable] = process.argv.slice(1);
            if (!next) process.exit(0);
            const parse = (v) => { const [core, ...pre] = v.split("-"); return [core.split(".").map(Number), pre.length > 0]; };
            const [a, aPre] = parse(next), [b] = parse(stable);
            for (let i = 0; i < 3; i++) if (a[i] !== b[i]) process.exit(a[i] < b[i] ? 0 : 1);
            process.exit(aPre ? 0 : 1);
          ' "$NEXT" "$VERSION"; then
            echo "next=${NEXT} non è più vecchio di ${VERSION}: resta dov'è."
            exit 0
          fi
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::Manca il secret NPM_DISTTAG_TOKEN: next resta su ${NEXT:-(nessuno)}. A mano: npm dist-tag add $PKG@$VERSION next"
            exit 0
          fi
          npm dist-tag add "$PKG@$VERSION" next

  # Il secondo pacchetto del repo: launcher/, su npm come "vitetranslate", il comando globale
  # (vedi doc/structure.md § "The global command: launcher/"). Job a sé invece di altri step in
  # "publish": le due pubblicazioni non dipendono l'una dall'altra, e un guasto nella prima, o
  # nel suo tag, non deve fermare la seconda. Gli basta il checkout: il launcher è un file solo,
  # senza dipendenze né build, e i suoi test sono già passati in "build" (npm test gira anche
  # test/list/launcher.test.mjs).
  #
  # Stessa regola della libreria: si pubblica solo se la versione di launcher/package.json non
  # è ancora su npm, quindi un push che non la cambia qui non fa niente.
  #
  # Niente tag né release GitHub: i "vX.Y.Z" sono della libreria (un v2.0.0 c'è già), e una
  # release del launcher diventerebbe la "Latest" del repo al posto di quella della libreria.
  #
  # Il trusted publishing è per pacchetto: va configurato anche per questo su npmjs.com
  # (vitetranslate → Settings → Trusted publishing: sepoina / viteTranslate / publish.yml),
  # altrimenti il primo cambio di versione fallisce qui con un errore di autenticazione.
  publish-launcher:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-publish-launcher
      cancel-in-progress: false
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Aggiorna npm (richiesto per trusted publishing OIDC)
        run: npm install -g npm@latest

      # Nome letto dal file e non scritto qui: launcher/package.json è l'unico posto in cui vive.
      - name: Nome e versione del launcher
        id: meta
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "Launcher: $NAME@$VERSION"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Versione già pubblicata?
        id: check
        run: |
          if npm view "${{ steps.meta.outputs.name }}@${{ steps.meta.outputs.version }}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # --access public non serve a un nome senza scope, ma diventa obbligatorio il giorno in
      # cui il pacchetto passasse sotto @sepoina: così quel giorno non c'è niente da ricordare.
      - name: Publish (trusted publishing OIDC, nessun token)
        if: steps.check.outputs.published == 'false'
        run: npm publish --access public

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # Un solo npm install copre libreria, landing e pagine: sono tutti workspace, e il loro
      # "^<versione>" si risolve col link al working tree (vedi test/syncDemoDeps.mjs). Lo
      # "prepare" della radice builda già la libreria; lo step esplicito resta per fallire con
      # un nome leggibile.
      - name: Install deps
        run: npm install

      - name: Build library
        run: npm run build

      # Landing alla radice, ogni pagina di site/pages/* nel suo slug (vedi site/build.mjs).
      - name: Build site
        run: npm run site:build -- --root=/${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  pages:
    needs: deploy-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
