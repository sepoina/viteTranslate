name: Deploy playground to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install root deps
        run: npm install

      - name: Build library
        run: npm run build

      - name: Install playground deps
        run: npm install --install-links
        working-directory: playground

      - name: Check lib resolution
        run: npm ls @sepoina/vitetranslate || true
        working-directory: playground

      - name: Build playground
        run: npm run build -- --base=/${{ github.event.repository.name }}/
        working-directory: playground

      # La pagina degli edge case è un progetto Vite a sé: ha la sua localeDir e un
      # errorSolve tutto acceso, e due configurazioni del plugin nella stessa build non
      # convivono (il modulo virtuale delle lingue ha un id unico). Quindi si builda a
      # parte e il suo dist finisce in una sottocartella di quello del playground.
      - name: Install edge deps
        run: npm install
        working-directory: playEdge

      # package.json dichiara la versione npm, così la cartella resta importabile su
      # StackBlitz così com'è. Qui sopra ci mettiamo il working tree, senza toccare il
      # file (--no-save): la pagina pubblicata mostra la libreria di questo commit,
      # come già fa il playground.
      - name: Use local library for edge
        run: npm run link:lib
        working-directory: playEdge

      - name: Build edge
        run: npm run build -- --base=/${{ github.event.repository.name }}/edge/
        working-directory: playEdge

      - name: Collect edge into playground dist
        run: cp -r playEdge/dist playground/dist/edge

      - name: SPA fallback
        run: cp playground/dist/index.html playground/dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
