name: Build, publish & deploy

# Un solo workflow al posto di due, per condividere il lavoro che pubblicazione e deploy
# facevano ciascuno per conto proprio (npm install + npm run build alla radice). "publish" ne
# esce alleggerito parecchio: non installa più nulla, gli basta l'artefatto del job "build".
# "deploy-pages" NON può fare lo stesso — vedi il commento lì sopra — quindi lì resta la
# doppia spesa, per una ragione precisa, non per distrazione.
#
# Nessun filtro sui path in ingresso: gira a ogni push su main, e la pubblicazione decide da
# sola se c'è qualcosa da fare (vedi "Versione già pubblicata?" nel job "publish"). Se non hai
# cambiato la versione, npm non fa niente — è la stessa garanzia di prima, non più legata al
# fatto che il push tocchi package.json.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm install

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Solo lib/dist: è l'unica cosa che "publish" non ha già dal proprio checkout (il resto
      # di lib/ è sorgente versionato). node_modules non viaggia con l'artefatto: zippare e
      # dezippare ~90 MB di pacchetti, bit di eseguibilità dei binari compresi, è un rischio
      # che qui non serve correre — "publish" non ne ha bisogno (vedi sotto), e "deploy-pages"
      # deve comunque installarli per conto suo.
      - name: Upload lib/dist
        uses: actions/upload-artifact@v4
        with:
          name: lib-dist
          path: lib/dist
          retention-days: 1

  # Ogni commit/push su main che supera "build" prova a pubblicare, un tag e una release
  # GitHub compresi. La versione pubblicata trasporta il campo versionDescription, scritto a
  # mano in package.json, che diventa anche il titolo/le note della release.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # serve per creare tag e release
      id-token: write
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download lib/dist
        uses: actions/download-artifact@v4
        with:
          name: lib-dist
          path: lib/dist

      - name: Aggiorna npm (richiesto per trusted publishing OIDC)
        run: npm install -g npm@latest

      - name: Rilascio
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DESC=$(node -p "require('./package.json').versionDescription || 'nessuna nota'")
          echo "Pubblicazione v$VERSION - $DESC"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "desc<<__EOF__"
            echo "$DESC"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Versione già pubblicata?
        id: check
        run: |
          if npm view "@sepoina/vitetranslate@${{ steps.meta.outputs.version }}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # --ignore-scripts: "prepare" (npm run build) non deve ripartire qui. Non ci sono
      # node_modules in questo job — l'unica cosa scaricata è lib/dist — quindi ripartirebbe
      # comunque a vuoto, fallendo su "rolldown: command not found".
      - name: Publish (trusted publishing OIDC, nessun token)
        if: steps.check.outputs.published == 'false'
        run: npm publish --access public --ignore-scripts

      - name: Tag già esistente?
        id: tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.meta.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag + release GitHub
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          DESC: ${{ steps.meta.outputs.desc }}
        run: |
          printf '%s\n\nnpm: https://www.npmjs.com/package/@sepoina/vitetranslate/v/%s\n' \
            "$DESC" "$VERSION" > release-notes.md
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION — $DESC" \
            --notes-file release-notes.md

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install root deps
        run: npm install

      # Non basta scaricare l'artefatto di "build": npm install --install-links qui sotto,
      # sulla dipendenza "file:.." di playground, fa ripartire da sé lo script "prepare" della
      # radice (npm run build) — verificato: succede comunque, con o senza questo passaggio.
      # Lo si tiene esplicito per due ragioni: fallisce qui, con un nome di step leggibile,
      # invece che in mezzo al log dell'installazione di playground; e resta vero anche se un
      # domani "prepare" sparisse da package.json.
      - name: Build library
        run: npm run build

      - name: Install playground deps
        run: npm install --install-links
        working-directory: playground

      - name: Check lib resolution
        run: npm ls @sepoina/vitetranslate || true
        working-directory: playground

      - name: Build playground
        run: npm run build -- --base=/${{ github.event.repository.name }}/
        working-directory: playground

      # La pagina degli edge case è un progetto Vite a sé: ha la sua localeDir e un
      # errorSolve tutto acceso, e due configurazioni del plugin nella stessa build non
      # convivono (il modulo virtuale delle lingue ha un id unico). Quindi si builda a
      # parte e il suo dist finisce in una sottocartella di quello del playground.
      - name: Install edge deps
        run: npm install
        working-directory: playEdge

      # package.json dichiara la versione npm, così la cartella resta importabile su
      # StackBlitz così com'è. Qui sopra ci mettiamo il working tree, senza toccare il
      # file (--no-save): la pagina pubblicata mostra la libreria di questo commit,
      # come già fa il playground.
      - name: Use local library for edge
        run: npm run link:lib
        working-directory: playEdge

      - name: Build edge
        run: npm run build -- --base=/${{ github.event.repository.name }}/edge/
        working-directory: playEdge

      - name: Collect edge into playground dist
        run: cp -r playEdge/dist playground/dist/edge

      - name: SPA fallback
        run: cp playground/dist/index.html playground/dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: playground/dist

  pages:
    needs: deploy-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
