ErrorToText_119zkzx: "Dopo una regolare fase di connessione la chiamata si è conclusa con successo con la disconnessione volontaria operata dall'interlocutore"
ErrorToText_14g9vli: "Risposta altrove"
ErrorToText_15bkmou: "Il chiamato non ha potuto rispondere a questa chiamata perché era già impegnato in una o più conversazioni telefoniche"
ErrorToText_17p3lrc: "Timeout del trasporto"
ErrorToText_19uh3gy: "Timeout del trasporto in uso"
ErrorToText_1dzoig9: "Il destinatario ha rifiutato volontariamente la chiamata"
ErrorToText_1g8sg5p: "---"
ErrorToText_1hzpuio: "La chiamata uscente è fallita perché al momento il server non ha potuto gestire la richiesta ricevuta dall'applicazione. Ciò può essere stato determinato da un sovraccarico di lavoro del server oppure da una sospensione del servizio per motivi di manutenzione. Notare che, in sistemi in cui sono presenti più server, significa che l'applicazione ha tentato di inviare la richiesta a tutti i server disponibili senza successo; questo esito spiega l'insuccesso nel tentativo di contattare l'ultimo server; i motivi di insuccesso nel tentativo di contattare gli altri server possono essere stati diversi"
ErrorToText_1j53mit: "La chiamata entrante è stata persa perché, nel momento in cui è giunta, erano già in corso altre chiamate"
ErrorToText_1jfz3v1: "Errore generico"
ErrorToText_1lptgs2: "Segnalazione interrotta"
ErrorToText_1ns1gcc: "Errore interno"
ErrorToText_1o260fs: "Non si ha l'autorizzazione per effettuare la chiamata. La chiamata di solito passa attraverso uno o più server; ciascuno dei server di passaggio può vietare la chiamata. L'autorizzazione è concessa dai responsabili dei server coinvolti nella chiamata"
ErrorToText_1p3ro5y: "Chiamata entrante generata in seguito a forking che ha ricevuto una risposta da un altro dispositivo"
ErrorToText_1pgyca5: "Si è tentato di chiamare un indirizzo sintatticamente errato. Ad esempio, “mario rossi@domain.net”: questo indirizzo contiene uno spazio tra le parole “mario” e “rossi”; lo spazio non è un carattere ammesso; l'indirizzo corretto potrebbe essere “mario.rossi@domain.net” oppure “mariorossi@domain.net”. Correggere l'errore nell'indirizzo e rifare la chiamata"
ErrorToText_1qmznic: "Preparazione connettività audio non riuscita"
ErrorToText_1t4z3gs: "La chiamata uscente è fallita perché non è stato possibile contattare i server del sistema. Notare che, in sistemi in cui sono presenti più server, significa che l'applicazione ha tentato di inviare la richiesta a tutti i server disponibili senza successo; questo esito spiega l'insuccesso nel tentativo di contattare l'ultimo server; i motivi di insuccesso nel tentativo di contattare gli altri server possono essere stati diversi. Verificare innanzitutto che il computer che esegue l'applicazione non sia isolato dalla rete"
ErrorToText_1uy4sow: "La chiamata effettuata non ha ricevuto risposta dal destinatario entro il tempo massimo concesso dal sistema per rispondere ad una chiamata"
ErrorToText_1wnw5qu: "Rediretta"
ErrorToText_4snw7j: "Chiamata rifiutata"
ErrorToText_51wt6s: "Chiamata vietata"
ErrorToText_629j0m: "La chiamata ricevuta è stata persa perché non si è riusciti a rispondere in tempo. Il motivo potrebbe essere dovuto a una decisione del chiamante che ha annullato la chiamata prima della risposta oppure al raggiungimento del tempo massimo concesso dal sistema per rispondere ad una chiamata. La durata della chiamata indica per quanto tempo la chiamata ha “squillato”"
ErrorToText_6tblhb: "Questo è un esito che si può ottenere su una chiamata uscente o, più raramente, su una chiamata entrante nel momento in cui si risponde alla chiamata. Significa che i due terminali coinvolti nella chiamata non sono stati in grado di negoziare con successo i media (audio, video, chat, ... ) da impiegare per la chiamata. Il motivo più frequente dell'insuccesso della negoziazione è la mancanza di media in comune o di codec (algoritmi per la codifica e decodifica di un flusso di dati) in comune tra i due terminali"
ErrorToText_7mlj44: "Non trovato"
ErrorToText_7qnsv5: "La chiamata si è conclusa inaspettatamente con un esito non catalogabile. Questa situazione anomala dovrebbe essere segnalata all'assistenza tecnica che, dopo un'analisi, dovrebbe essere in grado di modificare l'applicazione per risolvere il problema e catalogare correttamente la chiamata"
ErrorToText_89dw0n: "Quasi sempre è un esito negativo di una chiamata uscente molto più raramente può verificarsi al momento di rispondere a una chiamata entrante. Il codice numerico di tre cifre rappresenta un numero di errore del protocollo di segnalazione SIP usato dal sistema. È un esito non comune della chiamata in quanto tutti gli esiti più comuni sono catalogati con messaggi più chiari e precisi"
ErrorToText_a2vv6x: "Causa SIP %s"
ErrorToText_b13zfq: "Si è tentato di chiamare un destinatario non esistente o al momento non raggiungibile. Per motivi di riservatezza di solito il sistema non fornisce indicazioni più precise"
ErrorToText_cs9pbl: "Indirizzo errato"
ErrorToText_fo9i57: "Server temporaneamente non disponibile"
ErrorToText_ithlkx: "Non applicabile"
ErrorToText_mfwi7a: "Senza risposta"
ErrorToText_mgku5i: "Media incompatibili"
ErrorToText_mk5s8j: "Una chiamata entrante è stata deviata volontariamente verso un'altra destinazione prima di rispondere"
ErrorToText_ob0nmf: "Questo errore può comparire sia in chiamate audio entranti sia in chiamate audio uscenti entro 3 secondi dal momento della connessione. Significa che i due terminali, pur essendo connessi, non sono riusciti a determinare un percorso adatto tra le reti dati diponibili in cui far transitare lo stream audio. Quando ciò accade, nell'impossibilità di trasmettere e ricevere la voce, l'applicazione abbatte automaticamente la chiamata."
ErrorToText_oqzgzx: "Se si chiama un numero della rete telefonica e si riceve un esito di questo tipo, significa che il numero composto non è completo, ossia mancano una o più cifre per completarlo"
ErrorToText_osvci6: "OK"
ErrorToText_pd5520: "Indirizzo incompleto"
ErrorToText_rfi87q: "Connettività audio assente"
ErrorToText_se6ud2: "Annullata"
ErrorToText_swqqkv: "Errore di ret"
ErrorToText_uj9em8: "Occupato"
ErrorToText_xrh9ve: "Si può verificare sia nelle chiamate uscenti, al momento di fare la chiamata o quando il chiamato risponde, sia nelle chiamate entranti, al momento dell'arrivo della chiamata o al momento di rispondere. È un errore interno all'applicazione. Questo tipo di errore non è causato da problemi esterni, quali: problemi di rete, errata configurazione dell'applicazione, problemi dei server. Per risolvere un errore di questo tipo è necessario contattare l'assistenza tecnica affinché apporti le opportune correzioni all'applicazione"
ErrorToText_xxe15: "Si è deciso di terminare volontariamente una chiamata uscente prima della risposta del chiamato"
ErrorToText_yqs3x1: "Questo errore può comparire sia in chiamate entranti sia in chiamate uscenti. Inoltre può comparire sia nelle fasi iniziali della chiamata prima della connessione oppure in qualunque momento dopo la connessione quando si tenta di fare qualche operazione sulla chiamata (ad esempio, si mette in attesa la chiamata, si aggiunge il video a una chiamata audio, etc.); può avvenire anche spontaneamente in qualunque momento della chiamata se l'applicazione rileva di non essere più in grado di scambiare la segnalazione con l'interlocutore"
ErrorToText_yzv3pe: "Si può verificare al momento di effettuare una chiamata uscente o al momento di rispondere a una chiamata entrante. Il problema è dovuto alla temporanea indisponibilità o irraggiungibilità dei server (server STUN, server TURN) che permettono all'applicazione di determinare il migliore percorso per la connettività audio"
