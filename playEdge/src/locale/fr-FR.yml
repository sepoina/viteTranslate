App_1dtvcsy: "\n          <small>\n              La colonne <b>Attendu</b> vaut en <b>développement</b>, avec la langue source active et les fichiers de langue déjà synchronisés. Les marques <code>🔸</code> (non traduit ici) et <code>🔹</code> (non traduit ailleurs) ne sont pas rapportées : elles dépendent de l'état des fichiers de langue, pas de la ligne. <code>‼️</code>, <code>🚫</code> <code>⁇</code> font en revanche partie du résultat attendu. En build, les marques diagnostiques disparaissent — là où on lit <code>🚫[type]</code> ici, on ne rend plus rien — tandis que <code>⁇</code> reste : ce n'est pas un diagnostic mais un rendu normal.<br /> En passant la souris sur <code>&lt;/&gt;</code> à côté du nom de la ligne, on voit le code qui l'a produite.            \n          </small>            \n          "
