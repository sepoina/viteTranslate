ZZZsnippetList_1itbzsw: "<code>&lt;Translate&gt;</code> returns React nodes: it cannot be used in HTML attributes that require a plain string, such as <code>placeholder</code>, <code>aria-label</code> or <code>title</code>. In these cases you need the <code>useTranslateToString()</code> hook, which resolves the same translation but returns a primitive string. These attributes are not visible as on-screen text: to see them translated, inspect the element with F12."
ZZZsnippetList_1ployd4: "The useTranslateLanguage() hook exposes in one go the current language (id), the BCP 47 tags found in localeDir (no loading, just the list), the debug flag and proposeNewLanguage to request lazy loading of another language at runtime, with onStart/onDone/onError callbacks to track the outcome."
ZZZsnippetList_1s73ur1: "The <code>&lt;Translate&gt;</code> component wraps static text marked with %s, replaced at build time with the translation id and its fallback."
