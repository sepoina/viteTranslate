App_18e29q3: "Playground"
App_dlm7c5: "Plugin Vite per estrarre stringhe dal sorgente (marcatore %s e componente <code>&#60;Translate&#62;</code> ) e generare/sincronizzare le tabelle di traduzione. I file di lingua sono dati (.yml), non moduli JS, e vengono raggruppati in src (non in public, per evitare di servire moduli iniettabili) e caricati pigramente uno alla volta: il cambio lingua a runtime scarica solo il chunk necessario, senza appesantire il bundle iniziale con le lingue non usate."
AppplaygroundStringfromjs_1vtdae9: "📚"
BasicExample_1ujwz35: "Benvenuto in viteTranslate"
DynamicExample_kiyc37: "Ciao %s, come stai?"
InstallSection_104nql7: "Prima del primo avvio serve che il file della lingua di default esista già: TranslateContainer lo cerca subito e, se manca, il caricamento fallisce (la cartella localeDir non serve che esista in anticipo, la crea il plugin). Se non l'hai ancora generato, lancia una volta il comando descritto in Build linguistico: alla fine avrai già la tabella della lingua di default, pronta per essere letta."
InstallSection_12ynmbk: ". È esattamente il file che localeDir deve già contenere al primo avvio, come richiesto in Esecuzione dev."
InstallSection_1a5vici: "Prima della build di produzione, sincronizza le tabelle di traduzione con tutte le stringhe trovate nel sorgente lanciando il comando come step \"prebuild\": garantisce che la lingua di default sia sempre completa."
InstallSection_1inn77d: "Ecco come appare src una volta configurato il plugin: locale è una sottocartella come le altre, indicata da localeDir, con dentro un file .yml per ogni lingua."
InstallSection_1rl7c67: "Ogni lingua è un file .yml dentro localeDir, con lo stesso nome del suo tag"
InstallSection_1w2c6tx: "Le stesse chiavi compaiono, nello stesso momento, anche nel file della lingua di default: mai come null lì, ma raggruppate sotto la stessa riga separatrice finché restano da tradurre in almeno un'altra lingua. È un'occasione pratica: puoi copiare quel blocco (testo reale, non null) e incollarlo in un LLM per farlo tradurre, poi incollare la risposta al posto dei null nel file della lingua di destinazione."
InstallSection_3809a4: ". Il file della lingua di default viene creato e tenuto aggiornato in automatico dal comando di sincronizzazione: non va scritto a mano, solo tradotto se serve."
InstallSection_az53ni: "Per aggiungere una nuova lingua crea un file vuoto con il nome del tag scelto, poi rilancia il comando di sincronizzazione: aggiunge in coda tutte le chiavi mancanti con valore null e segnala nel log quali restano da tradurre. Basta sostituire quei null con il testo tradotto."
InstallSection_b1j9f6: "Installazione"
InstallSection_dhlwwk: "Avvolgi l'app in TranslateContainer indicando la lingua iniziale da caricare: espone il contesto usato da Translate e dagli altri hook per leggere la tabella di traduzione corrente. In sviluppo il fallback resta incorporato nel codice compilato, quindi l'app mostra già il testo tradotto senza dover lanciare altri comandi."
InstallSection_eqg418: "Registra il plugin viteTranslate in vite.config.js: gli va indicata la cartella dei file di lingua e la lingua di default. Il plugin si occupa sia dell'estrazione delle stringhe da tradurre via Babel sia della generazione del modulo virtuale che elenca le lingue disponibili."
InstallSection_fc81ky: "Installa il pacchetto nel tuo progetto Vite + React: React e Vite sono peer dependency, quindi devono già essere presenti."
InstallSection_fhcky6: "Subito dopo il comando il file contiene già tutte le chiavi trovate nel sorgente, ma non tradotte (valore null): sotto la riga separatrice trovi l'elenco esatto di ciò che manca."
InstallSection_t4vmjs: "Lanciando semplicemente questo comando, anche a progetto appena creato e senza altri file di lingua presenti, viene generata la prima tabella linguistica: quella della lingua indicata come lingua di default in"
InstallSection_t5nanj: "Sostituendo ogni null con il testo tradotto (mantenendo invariati eventuali %s) il file risulta completo, pronto per essere usato come lingua disponibile."
InstallSection_uq5uv6: "Ogni file .yml trovato in localeDir diventa automaticamente disponibile: useTranslateLanguage() lo elenca e TranslateContainer lo carica pigramente alla richiesta, senza bisogno di registrarlo altrove."
