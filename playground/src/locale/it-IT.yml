ZZZsnippetList_1itbzsw: "<code>&lt;Translate&gt;</code> restituisce nodi React: non può essere usato in attributi HTML che richiedono una stringa semplice, come <code>placeholder</code>, <code>aria-label</code> o <code>title</code>. In questi casi serve l'hook <code>useTranslateToString()</code>, che risolve la stessa traduzione ma restituisce una stringa primitiva. Questi attributi non sono visibili come testo a schermo: per vederli tradotti ispeziona l'elemento con F12."
ZZZsnippetList_1ployd4: "L'hook useTranslateLanguage() espone in un colpo solo la lingua corrente (id), i tag BCP 47 trovati in localeDir (nessun caricamento, solo l'elenco), il flag debug e proposeNewLanguage per richiedere il caricamento pigro di un'altra lingua a runtime, con callback onStart/onDone/onError per seguirne l'esito."
ZZZsnippetList_1s73ur1: "Il componente <code>&lt;Translate&gt;</code> avvolge il testo statico marcato con %s, sostituito in build-time con l'id di traduzione e il relativo fallback."
